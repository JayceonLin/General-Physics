           a: R`$\omega = \dfrac{(21)(2\pi)}{60} \approx 2.2\ \text{rad/s}$，$v = r\omega = (28)(2.2) \approx 62\ \text{m/s}$。` }] },
  { id: 'f10-2', name: '等角加速度運動',
    tex: R`@{w}{\omega}^2 = @{w0}{\omega_0}^2 + 2\,@{al}{\alpha}\,\Delta@{th}{\theta}`,
    sym: [['w', R`\omega`, '末角速度', 'rad/s', ''], ['w0', R`\omega_0`, '初角速度', 'rad/s', ''],
          ['al', R`\alpha`, '角加速度', 'rad/s²', ''], ['th', R`\Delta\theta`, '角位移', 'rad', '']],
    idea: '和直線等加速度公式一一對應：x→θ、v→ω、a→α。',
    derive: [R`$\omega = \omega_0 + \alpha t$。`, R`$\theta = \theta_0 + \omega_0 t + \tfrac12\alpha t^2$。`,
             R`兩式消去 $t$ 得 $\omega^2 = \omega_0^2 + 2\alpha\,\Delta\theta$。`],
    links: ['f10-1', 'f10-4'],
    ex: [{ ref: '例題 10.2 轉停', q: R`風停後，例題 10.1 的風機以 0.12 rad/s² 等減速停下。停下前轉了幾圈？`,
           a: R`$0 = \omega_0^2 - 2\alpha\Delta\theta$，$\Delta\theta = \dfrac{2.2^2}{2(0.12)} \approx 20\ \text{rad}$，即 $20/2\pi \approx 3.2$ 圈。` }] },
  { id: 'f10-3', name: '力矩',
    tex: R`@{tau}{\tau} = @{r}{r}\,@{F}{F}\sin@{th}{\theta}`,
    sym: [['tau', R`\tau`, '力矩', 'N·m', ''],
          ['r', R`r`, '轉軸到施力點的距離', 'm', ''],
          ['F', R`F`, '施力大小', 'N', ''],
          ['th', R`\theta`, R`$\vec r$ 與 $\vec F$ 的夾角`, '°', '']],
    idea: '同樣大小的力，施力點離轉軸越遠、方向越接近垂直，轉動效果越大。',
    derive: [R`只有垂直於 $\vec r$ 的分量 $F\sin\theta$ 會造成轉動。`,
             R`$\tau = r(F\sin\theta)$；也可看成 $F$ 乘上力臂 $r\sin\theta$。`],
    links: ['f10-4', 'f11-1', 'f12-2'],
    ex: [{ ref: '例題 10.3 換輪胎', q: R`輪胎螺帽要鎖到 95 N·m。45 cm 長的扳手與水平夾 67°，你水平拉扳手末端，要用多大的力？`,
           a: R`力與扳手的夾角是 $180^\circ - 67^\circ = 113^\circ$。$F = \dfrac{\tau}{r\sin\theta} = \dfrac{95}{(0.45)\sin113^\circ} \approx 230\ \text{N}$。` }] },
  { id: 'f10-4', name: '轉動的牛頓第二定律',
    tex: R`@{tau}{\tau_{net}} = @{I}{I}\,@{al}{\alpha}`,
    sym: [['tau', R`\tau_{net}`, '合力矩', 'N·m', ''],
          ['I', R`I`, '轉動慣量', 'kg·m²', '轉動版的「質量」'],
          ['al', R`\alpha`, '角加速度', 'rad/s²', '']],
    idea: '轉動版的 F = ma：力矩對應力，轉動慣量對應質量。',
    derive: [R`一個質點的切線方向：$F_t = ma_t = mr\alpha$。`, R`兩邊乘上 $r$：$\tau = mr^2\alpha$。`,
             R`對所有質點相加：$\tau_{net} = \left(\sum m_ir_i^2\right)\alpha = I\alpha$。`],
    links: ['f5-1', 'f10-3', 'f10-5', 'f11-4'],
    ex: [{ ref: '例題 10.9 吊桶入井', q: R`質量 $M$、半徑 $R$ 的實心圓柱裝在無摩擦軸上，纏在上面的繩子吊著質量 $m$ 的水桶。水桶下落的加速度？`,
           a: R`水桶：$mg - T = ma$。圓柱：$TR = I\alpha = \tfrac12 MR^2\cdot\dfrac aR$，得 $T = \tfrac12 Ma$。相加：$a = \dfrac{mg}{m + M/2}$，比自由落體小。` }] },
  { id: 'f10-5', name: '轉動慣量',
    tex: R`@{I}{I} = \sum @{m}{m_i}\,@{r}{r_i}^2 \;\longrightarrow\; \int r^2\,dm`,
    sym: [['I', R`I`, '轉動慣量', 'kg·m²', ''],
          ['m', R`m_i`, '質點質量', 'kg', ''],
          ['r', R`r_i`, '到轉軸的垂直距離', 'm', '']],
    idea: '質量離轉軸越遠越難轉。細桿（中心）ML²/12、圓環 MR²、圓盤 ½MR²、實心球 ⅖MR²。',
    derive: [R`離散質點直接加總 $\sum m_ir_i^2$；連續物體改成積分 $\int r^2\,dm$。`,
             R`例：圓盤取半徑 $r$、寬 $dr$ 的圓環，$dm = \dfrac{2M}{R^2}r\,dr$。`,
             R`$I = \dfrac{2M}{R^2}\int_0^R r^3\,dr = \tfrac12 MR^2$。`,
             R`平行軸定理：$I = I_{cm} + Md^2$。`],
    links: ['f10-4', 'f10-6', 'f13-5', 'f11-3'], sim: 'rolling',
    ex: [{ ref: '例題 10.4 啞鈴', q: R`兩個 0.64 kg 的質點裝在 85 cm 長、質量可忽略的桿兩端。轉軸垂直於桿、距一端 1/4 桿長。轉動慣量？`,
           a: R`$I = m\left(\dfrac L4\right)^2 + m\left(\dfrac{3L}4\right)^2 = \tfrac58 mL^2 = \tfrac58(0.64)(0.85)^2 \approx 0.29\ \text{kg·m}^2$。` }] },
  { id: 'f10-6', name: '轉動動能',
    tex: R`@{K}{K_{rot}} = \tfrac{1}{2}\,@{I}{I}\,@{w}{\omega}^2`,
    sym: [['K', R`K_{rot}`, '轉動動能', 'J', ''], ['I', R`I`, '轉動慣量', 'kg·m²', ''], ['w', R`\omega`, '角速度', 'rad/s', '']],
    idea: '轉動中的物體每一小塊都在動；把它們的動能加起來就是 ½Iω²。飛輪就是用這個儲能。',
    derive: [R`每一小塊：$\tfrac12 m_iv_i^2 = \tfrac12 m_ir_i^2\omega^2$。`, R`加總：$\tfrac12\left(\sum m_ir_i^2\right)\omega^2 = \tfrac12 I\omega^2$。`],
    links: ['f6-4', 'f10-5', 'f10-7'],
    ex: [{ ref: '例題 10.10 飛輪儲能', q: R`135 kg、半徑 30 cm 的實心圓柱飛輪以 31,000 rpm 旋轉，儲存多少能量？`,
           a: R`$\omega = 31000 \times 2\pi/60 \approx 3246\ \text{rad/s}$。$K = \tfrac12\left(\tfrac12 MR^2\right)\omega^2 = \tfrac14(135)(0.30)^2(3246)^2 \approx 32\ \text{MJ}$。` }] },
  { id: 'f10-7', name: '滾動',
    tex: R`@{K}{K} = \tfrac12 @{M}{M}@{v}{v_{cm}}^2 + \tfrac12 @{I}{I_{cm}}@{w}{\omega}^2,\qquad v_{cm} = \omega R`,
    sym: [['K', R`K`, '總動能', 'J', ''], ['M', R`M`, '質量', 'kg', ''],
          ['v', R`v_{cm}`, '質心速率', 'm/s', ''], ['I', R`I_{cm}`, '對質心的轉動慣量', 'kg·m²', ''],
          ['w', R`\omega`, '角速度', 'rad/s', '']],
    idea: '滾動 = 質心平移 + 繞質心轉動；轉動慣量越大，滾下斜坡越慢。',
    derive: [R`不打滑時接觸點瞬間靜止，所以 $v_{cm} = \omega R$。`,
             R`寫成 $I_{cm} = cMR^2$，能量守恆：$Mgh = \tfrac12(1 + c)Mv^2$。`,
             R`$v = \sqrt{\dfrac{2gh}{1 + c}}$：實心球 $c = 2/5$、圓盤 $1/2$、圓環 $1$。`],
    links: ['f10-6', 'f7-4', 'f10-1'], sim: 'rolling',
    ex: [{ ref: '例題 10.12 滾下山坡', q: R`實心球從靜止滾下山坡，質心下降高度 $h$。到底部時速率多少？`,
           a: R`$Mgh = \tfrac12 Mv^2 + \tfrac12\left(\tfrac25 MR^2\right)\left(\dfrac vR\right)^2 = \tfrac7{10}Mv^2$，所以 $v = \sqrt{\dfrac{10gh}7}$，比無摩擦滑下的 $\sqrt{2gh}$ 慢。` }] }
], [
  { id: 'p10-1', ref: '改編自例題 10.8 衛星消旋', f: ['f10-4', 'f10-2'],
    q: R`直徑 1.4 m、質量 940 kg 的均勻圓柱形衛星以 10 rpm 自轉。兩側各有一個推力 20 N 的噴嘴沿切線方向噴氣讓它停轉。要噴多久？`,
    unit: 's', ans: 8.61,
    hints: [R`兩個噴嘴的力矩相加：$\tau = 2RF$。`, R`實心圓柱 $I = \tfrac12 MR^2$，$\alpha = \tau/I$。`, R`$t = \omega_0/\alpha$，記得把 rpm 換成 rad/s。`],
    sol: R`$\tau = 2(0.70)(20) = 28\ \text{N·m}$，$I = \tfrac12(940)(0.70)^2 \approx 230\ \text{kg·m}^2$，$\alpha \approx 0.122\ \text{rad/s}^2$。$\omega_0 = 1.05\ \text{rad/s}$，$t \approx 8.6\ \text{s}$。` },
  { id: 'p10-2', ref: '改編自例題 10.11 輪胎平衡', f: ['f10-6', 'f10-4'],
    q: R`輪胎轉動慣量 2.7 kg·m²。平衡機要在 25 圈內把它從靜止轉到 700 rpm，需要多大的定力矩？`,
    unit: 'N·m', ans: 46.18,
    hints: [R`力矩做的功 $W = \tau\Delta\theta$ 等於轉動動能的增加。`, R`$\Delta\theta = 25 \times 2\pi$ rad，$\omega = 700 \times 2\pi/60$ rad/s。`],
    sol: R`$\tau = \dfrac{\tfrac12 I\omega^2}{\Delta\theta} = \dfrac{\tfrac12(2.7)(73.3)^2}{50\pi} \approx 46\ \text{N·m}$。` },
  { id: 'p10-3', ref: '改編自例題 10.12 滾下山坡', f: ['f10-7'],
    q: R`實心球從靜止沿斜坡滾下（不打滑），質心下降了 1.5 m。到底部時質心速率是多少？`,
    unit: 'm/s', ans: 4.583,
    hints: [R`實心球 $I = \tfrac25 MR^2$，總動能 $= \tfrac7{10}Mv^2$。`, R`$Mgh = \tfrac7{10}Mv^2$。`],
    sol: R`$v = \sqrt{\dfrac{10gh}7} = \sqrt{\dfrac{10(9.8)(1.5)}7} \approx 4.6\ \text{m/s}$。`,
    sim: { id: 'rolling', preset: { h: 1.5 } } }
]);

/* ---------- Ch11 ---------- */
chapter({ id: 11, exam: 2, title: '角動量', en: 'Rotational Vectors and Angular Momentum',
  blurb: '力矩和角動量都是向量；沒有外力矩時角動量守恆。' }, [
  { id: 'f11-1', name: '力矩向量（外積）',
    tex: R`@{tau}{\vec\tau} = @{r}{\vec r}\times@{F}{\vec F}`,
    sym: [['tau', R`\vec\tau`, '力矩向量', 'N·m', '方向沿轉軸'],
          ['r', R`\vec r`, '從參考點到施力點的位置', 'm', ''],
          ['F', R`\vec F`, '力', 'N', '']],
    idea: '力矩是向量，方向由右手定則決定：四指從 r 轉向 F，拇指方向就是 τ。',
    derive: [R`外積大小 $|\vec A\times\vec B| = AB\sin\theta$，與 $\tau = rF\sin\theta$ 相同。`,
             R`分量：$\vec A\times\vec B = (A_yB_z - A_zB_y,\ A_zB_x - A_xB_z,\ A_xB_y - A_yB_x)$。`,
             R`外積不可交換：$\vec A\times\vec B = -\vec B\times\vec A$。`],
    links: ['f10-3', 'f11-4'],
    ex: [{ ref: '補充示範', q: R`$\vec r = (2,\,0,\,0)\ \text{m}$，$\vec F = (0,\,3,\,0)\ \text{N}$，力矩？`,
           a: R`$\vec\tau = (0\cdot0 - 0\cdot3,\ 0\cdot0 - 2\cdot0,\ 2\cdot3 - 0\cdot0) = (0,\,0,\,6)\ \text{N·m}$，指向 +z，物體繞 z 軸逆時針轉。` }] },
  { id: 'f11-2', name: '質點的角動量',
    tex: R`@{L}{\vec L} = @{r}{\vec r}\times@{p}{\vec p} = m\,\vec r\times\vec v`,
    sym: [['L', R`\vec L`, '角動量', 'kg·m²/s', ''], ['r', R`\vec r`, '相對參考點的位置', 'm', ''], ['p', R`\vec p`, '動量', 'kg·m/s', '']],
    idea: '就算是走直線的質點，對不在那條線上的參考點也有角動量。',
    derive: [R`定義 $\vec L = \vec r\times\vec p$。`, R`圓周運動時 $\vec r \perp \vec v$：$L = mrv = mr^2\omega$。`],
    links: ['f11-3', 'f9-3'],
    ex: [{ ref: '例題 11.1 單一粒子', q: R`質量 $m$ 的粒子在 xy 平面以速率 $v$ 逆時針繞半徑 $r$ 的圓。對圓心的角動量？`,
           a: R`$\vec L = mrv\,\hat k = mr^2\omega\,\hat k = I\vec\omega$，其中 $I = mr^2$。` }] },
  { id: 'f11-3', name: '剛體的角動量',
    tex: R`@{L}{L} = @{I}{I}\,@{w}{\omega}`,
    sym: [['L', R`L`, '角動量', 'kg·m²/s', ''], ['I', R`I`, '轉動慣量', 'kg·m²', ''], ['w', R`\omega`, '角速度', 'rad/s', '']],
    idea: '繞對稱軸轉動的剛體，角動量就是轉動慣量乘角速度，方向沿轉軸。',
    derive: [R`每個質點 $L_i = m_ir_i^2\omega$。`, R`加總：$L = \left(\sum m_ir_i^2\right)\omega = I\omega$。`],
    links: ['f11-2', 'f10-5', 'f11-5'] },
  { id: 'f11-4', name: '角動量與力矩',
    tex: R`@{tau}{\vec\tau_{net}} = \frac{d@{L}{\vec L}}{dt}`,
    sym: [['tau', R`\vec\tau_{net}`, '外力矩的合', 'N·m', ''], ['L', R`\vec L`, '角動量', 'kg·m²/s', '']],
    idea: '轉動版的 F = dP/dt：外力矩改變角動量。',
    derive: [R`$\dfrac{d\vec L}{dt} = \dfrac{d\vec r}{dt}\times\vec p + \vec r\times\dfrac{d\vec p}{dt}$。`,
             R`第一項 $\vec v\times m\vec v = 0$。`, R`第二項 $\vec r\times\vec F = \vec\tau$。`],
    links: ['f9-3', 'f10-4', 'f11-5', 'f11-6'] },
  { id: 'f11-5', name: '角動量守恆',
    tex: R`@{I1}{I_1}\,@{w1}{\omega_1} = @{I2}{I_2}\,@{w2}{\omega_2}`,
    sym: [['I1', R`I_1`, '之前的轉動慣量', 'kg·m²', ''], ['w1', R`\omega_1`, '之前的角速度', 'rad/s', ''],
          ['I2', R`I_2`, '之後的轉動慣量', 'kg·m²', ''], ['w2', R`\omega_2`, '之後的角速度', 'rad/s', '']],
    idea: '沒有外力矩時角動量不變：把質量收向轉軸（I 變小）就會轉得更快，溜冰選手和脈衝星都是如此。',
    derive: [R`$\vec\tau_{net} = 0$，所以 $d\vec L/dt = 0$。`, R`$L = I\omega$ 為常數。`,
             R`轉動動能 $K = L^2/2I$ 會改變：收手時人對系統做了正功。`],
    links: ['f9-4', 'f11-3', 'f8-4'], sim: 'spin',
    ex: [{ ref: '例題 11.2 脈衝星（觀念）', q: R`恆星核心坍縮時半徑變成原來的 $1/k$，自轉週期怎麼變？（假設是均勻球、沒有外力矩）`,
           a: R`$I \propto r^2$，$I_0\omega_0 = I\omega$，所以 $\omega = k^2\omega_0$，週期變成原來的 $1/k^2$。半徑縮小一千倍，就轉快一百萬倍。` }] },
  { id: 'f11-6', name: '陀螺儀的進動',
    tex: R`@{W}{\Omega} = \frac{@{tau}{\tau}}{@{L}{L}} = \frac{@{M}{M}\,g\,@{r}{r}}{@{I}{I}\,@{w}{\omega}}`,
    sym: [['W', R`\Omega`, '進動角速度', 'rad/s', ''], ['tau', R`\tau`, '重力力矩', 'N·m', ''],
          ['L', R`L`, '自轉角動量', 'kg·m²/s', ''], ['M', R`M`, '陀螺質量', 'kg', ''],
          ['r', R`r`, '支點到質心的距離', 'm', ''], ['I', R`I`, '自轉轉動慣量', 'kg·m²', ''], ['w', R`\omega`, '自轉角速度', 'rad/s', '']],
    idea: '重力力矩不會讓陀螺倒下，而是讓角動量向量水平繞圈；轉得越快，進動越慢。',
    derive: [R`力矩水平且垂直於 $\vec L$，只改變 $\vec L$ 的方向。`, R`$dt$ 時間內 $dL = \tau\,dt$，$\vec L$ 轉過 $d\phi = dL/L$。`, R`$\Omega = d\phi/dt = \tau/L$。`],
    links: ['f11-4'] }
], [
  { id: 'p11-1', ref: '改編自例題 11.2 脈衝星', f: ['f11-5'],
    q: R`一顆恆星每 45 天自轉一次。超新星爆炸後，半徑 20 Mm（$2\times10^7$ m）的核心坍縮成半徑只有 6 km 的中子星。假設核心是均勻球且沒有外力矩，中子星每秒轉幾圈？`,
    unit: '圈/秒', ans: 2.858,
    hints: [R`$I = \tfrac25 mr^2$，質量不變，所以 $r_0^2\omega_0 = r^2\omega$。`, R`週期 $T = T_0\left(\dfrac r{r_0}\right)^2$，45 天 = $3.888\times10^6$ s。`],
    sol: R`$T = (3.888\times10^6)\left(\dfrac{6\times10^3}{2\times10^7}\right)^2 \approx 0.35\ \text{s}$，每秒約 2.9 圈，這就是脈衝星的脈衝頻率。` },
  { id: 'p11-2', ref: '補充題（依 11.4 角動量守恆）', f: ['f11-5', 'f10-5'],
    q: R`你坐在無摩擦旋轉椅上，兩手各握 2.0 kg 的啞鈴伸直在離轉軸 0.80 m 處，人加椅子的轉動慣量是 3.0 kg·m²，起初角速度 2.0 rad/s。把啞鈴收到離轉軸 0.20 m 後，角速度變成多少？`,
    unit: 'rad/s', ans: 3.519,
    hints: [R`總轉動慣量 = 人椅 + 兩個啞鈴 $2mr^2$。`, R`$I_1 = 3.0 + 2(2.0)(0.80)^2$，$I_2 = 3.0 + 2(2.0)(0.20)^2$。`, R`$I_1\omega_1 = I_2\omega_2$。`],
    sol: R`$I_1 = 5.56$、$I_2 = 3.16\ \text{kg·m}^2$，$\omega_2 = \dfrac{(5.56)(2.0)}{3.16} \approx 3.5\ \text{rad/s}$。`,
    sim: { id: 'spin', preset: { r: 0.8, w0: 2.0 } } },
  { id: 'p11-3', ref: '補充題（依 11.5 陀螺儀）', f: ['f11-6'],
    q: R`玩具陀螺儀質量 0.15 kg，質心離支點 4.0 cm，轉子轉動慣量 $1.2\times10^{-4}\ \text{kg·m}^2$，自轉 300 rad/s。進動角速度是多少？`,
    unit: 'rad/s', ans: 1.633,
    hints: [R`重力力矩 $\tau = Mgr$。`, R`自轉角動量 $L = I\omega$，$\Omega = \tau/L$。`],
    sol: R`$\Omega = \dfrac{(0.15)(9.8)(0.040)}{(1.2\times10^{-4})(300)} \approx 1.6\ \text{rad/s}$。` }
]);

/* ---------- Ch12 ---------- */
chapter({ id: 12, exam: 2, title: '靜力平衡', en: 'Static Equilibrium',
  blurb: '合力為零、合力矩為零；挑對支點，未知力就消失。' }, [
  { id: 'f12-1', name: '力平衡',
    tex: R`\sum @{F}{\vec F_i} = 0`,
    sym: [['F', R`\vec F_i`, '作用在物體上的外力', 'N', '每個分量的和都要為零']],
    idea: '靜力平衡的第一個條件：質心不加速。',
    derive: [R`由 $\vec F_{ext} = M\vec a_{cm}$，靜止時 $\vec a_{cm} = 0$。`, R`寫成分量：$\sum F_x = 0$、$\sum F_y = 0$。`],
    links: ['f5-1', 'f12-2', 'f9-2'] },
  { id: 'f12-2', name: '力矩平衡',
    tex: R`\sum @{tau}{\vec\tau_i} = 0`,
    sym: [['tau', R`\vec\tau_i`, '各外力的力矩', 'N·m', '對任何一點都成立']],
    idea: '第二個條件：物體不轉。合力為零時，對任何點的力矩和都相同，所以支點可以挑在未知力上，讓它的力矩消失。',
    derive: [R`$\tau_{net} = I\alpha$，靜止時 $\alpha = 0$。`, R`若 $\sum\vec F = 0$，換支點不會改變力矩和，所以可任選支點。`],
    links: ['f10-3', 'f12-1', 'f12-4'], sim: 'ladder',
    ex: [{ ref: '例題 12.1 吊橋', q: R`吊橋橋面長 14 m、質量 11,000 kg 均勻分布，抬起到與水平成 30°，支撐纜繩與橋面夾 15°。纜繩的張力？`,
           a: R`以鉸鏈為支點，鉸鏈力不產生力矩：$-\tfrac L2 mg\sin120^\circ + LT\sin165^\circ = 0$，$T = \dfrac{mg\sin120^\circ}{2\sin165^\circ} \approx 1.8\times10^5\ \text{N}$。` }] },
  { id: 'f12-3', name: '重心',
    tex: R`@{x}{x_{cg}} = \frac{\sum @{m}{m_i}\,@{xi}{x_i}}{\sum m_i}`,
    sym: [['x', R`x_{cg}`, '重心位置', 'm', ''], ['m', R`m_i`, '各部分質量', 'kg', ''], ['xi', R`x_i`, '各部分位置', 'm', '']],
    idea: '重力場均勻時重心就是質心；計算力矩時，可以把全部重量當成作用在重心。',
    derive: [R`重力的總力矩 $\sum x_i m_ig$。`, R`令它等於 $\left(\sum m_i\right)g\,x_{cg}$，g 均勻時就是質心公式。`],
    links: ['f9-1', 'f12-2'],
    ex: [{ ref: '觀念題 12.1 找重心', q: R`怎麼用一條線找出不規則平板的重心？`,
           a: R`從任一點吊起，平板靜止時重心一定在懸點正下方（否則重力有力矩），沿線畫一條鉛直線；換另一點吊起再畫一條，兩線交點就是重心。` }] },
  { id: 'f12-4', name: '梯子不滑的條件',
    tex: R`\tan@{th}{\theta} \ge \frac{1}{2\,@{mu}{\mu}}`,
    sym: [['th', R`\theta`, '梯子與地面的夾角', '°', ''], ['mu', R`\mu`, '地面的靜摩擦係數', '無單位', '牆面無摩擦']],
    idea: '梯子越斜（θ 越小）越容易滑；摩擦係數越大，可以放得越斜。',
    derive: [R`水平：牆的推力 $n_2$ = 地面摩擦 $\mu n_1$；垂直：$n_1 = mg$。`,
             R`對梯腳取力矩：$Ln_2\sin\theta = \tfrac L2 mg\cos\theta$。`,
             R`代入 $n_2 = \mu mg$ 得臨界角 $\tan\theta = \dfrac1{2\mu}$。`],
    links: ['f12-1', 'f12-2', 'f5-3'], sim: 'ladder',
    ex: [{ ref: '例題 12.2 梯子安全', q: R`質量 $m$、長 $L$ 的梯子靠在無摩擦牆上，地面靜摩擦係數 $\mu$。最小傾角？`,
           a: R`由上面的推導，$\theta_{min} = \tan^{-1}\dfrac1{2\mu}$，與梯子的質量、長度都無關。` }] },
  { id: 'f12-5', name: '平衡的穩定性',
    tex: R`\frac{d@{U}{U}}{d@{x}{x}} = 0,\qquad \frac{d^2U}{dx^2} > 0\ \text{（穩定）}`,
    sym: [['U', R`U(x)`, '位能', 'J', ''], ['x', R`x`, '位置', 'm', '']],
    idea: '平衡點在位能曲線的峰頂或谷底；谷底稍微推開會回來（穩定），峰頂會越跑越遠（不穩定）。',
    derive: [R`平衡：$F = -dU/dx = 0$。`, R`稍微偏離 $\Delta x$：$F \approx -U''(x_0)\,\Delta x$，$U'' > 0$ 時力指回平衡點。`],
    links: ['f7-6'],
    ex: [{ ref: '例題 12.4 半導體元件', q: R`電子位能 $U(x) = ax^2 - bx^4$，$a = 8\ \text{aJ/nm}^2$、$b = 1\ \text{aJ/nm}^4$。平衡點與穩定性？`,
           a: R`$U' = 2ax - 4bx^3 = 0$，得 $x = 0$ 與 $x = \pm\sqrt{a/2b} = \pm2\ \text{nm}$。$U''(0) = 2a > 0$ 穩定；$U''(\pm2) = 2a - 12b(4) < 0$ 不穩定。` }] }
], [
  { id: 'p12-1', ref: '改編自例題 12.3 手臂拿南瓜', f: ['f12-2', 'f12-1'],
    q: R`前臂質量 2.7 kg，重心距手肘 17.6 cm；手上 4.5 kg 的南瓜距手肘 32 cm。二頭肌接在距手肘 3.6 cm 處，拉力與前臂夾 80°。前臂水平靜止，二頭肌張力是多少？`,
    unit: 'N', ans: 529.4,
    hints: [R`以手肘為支點，手肘接觸力不產生力矩。`, R`$x_1T\sin80^\circ = x_2mg + x_3Mg$。`],
    sol: R`$T = \dfrac{(0.176 \times 2.7 + 0.32 \times 4.5)(9.8)}{(0.036)\sin80^\circ} \approx 530\ \text{N}$，是南瓜重量的 12 倍，因為肌肉的力臂很短。` },
  { id: 'p12-3', ref: '改編自例題 12.3 手臂拿南瓜（續）', f: ['f12-1'],
    q: R`承第 1 題（二頭肌張力約 529 N、與前臂夾 80°），手肘關節施給前臂的接觸力大小是多少？`,
    unit: 'N', ans: 460.0,
    hints: [R`用力平衡：x 方向 $F_{cx} = T\cos80^\circ$。`, R`y 方向 $F_{cy} = (m + M)g - T\sin80^\circ$，結果是負的（向下）。`, R`$F_c = \sqrt{F_{cx}^2 + F_{cy}^2}$。`],
    sol: R`$F_{cx} \approx 92\ \text{N}$，$F_{cy} = (7.2)(9.8) - 529\sin80^\circ \approx -451\ \text{N}$，$F_c \approx 460\ \text{N}$。投影片把 T 取成 500 N 估算，得到約 430 N。` },
  { id: 'p12-2', ref: '改編自例題 12.2 梯子安全（數字為補充）', f: ['f12-4'],
    q: R`梯子靠在無摩擦牆上，地面與梯腳的靜摩擦係數是 0.42。梯子與地面的夾角至少要幾度才不會滑？`,
    unit: '°', ans: 49.97,
    hints: [R`臨界條件 $\tan\theta = \dfrac1{2\mu}$。`],
    sol: R`$\theta = \tan^{-1}\dfrac1{2(0.42)} = \tan^{-1}1.19 \approx 50^\circ$。`,
    sim: { id: 'ladder', preset: { mu: 0.42, th: 50 } } }
]);

/* ---------- Ch13 ---------- */
chapter({ id: 13, exam: 2, title: '振盪運動', en: 'Oscillatory Motion',
  blurb: '回復力正比於位移，就產生週期與振幅無關的簡諧運動。' }, [
  { id: 'f13-1', name: '週期、頻率與角頻率',
    tex: R`@{f}{f} = \frac{1}{@{T}{T}},\qquad @{w}{\omega} = 2\pi f`,
    sym: [['f', R`f`, '頻率', 'Hz', '每秒幾次'], ['T', R`T`, '週期', 's', '來回一次的時間'], ['w', R`\omega`, '角頻率', 'rad/s', '']],
    idea: '週期是來回一次的時間，頻率是一秒幾次，角頻率把一次循環換算成 2π 弧度。',
    derive: [R`$f = 1/T$ 是定義。`, R`每個循環對應 $2\pi$ rad，所以 $\omega = 2\pi/T = 2\pi f$。`],
    links: ['f13-2', 'f14-1'],
    ex: [{ ref: '例題 13.1 振盪的尺', q: R`一把尺 10 s 內振了 28 次，來回的總距離 8.0 cm。振幅、週期、頻率？`,
           a: R`振幅 $A = 8.0/2 = 4.0\ \text{cm}$，$T = 10/28 \approx 0.36\ \text{s}$，$f = 2.8\ \text{Hz}$。` }] },
  { id: 'f13-2', name: '簡諧運動',
    tex: R`@{x}{x(t)} = @{A}{A}\cos(@{w}{\omega}\,@{t}{t} + @{ph}{\phi})`,
    sym: [['x', R`x(t)`, '位移', 'm', ''], ['A', R`A`, '振幅', 'm', ''], ['w', R`\omega`, '角頻率', 'rad/s', ''],
          ['t', R`t`, '時間', 's', ''], ['ph', R`\phi`, '相位常數', 'rad', '由初始條件決定']],
    idea: '回復力 F = −kx 造成的運動就是餘弦函數；振幅大小不影響週期。',
    derive: [R`牛頓第二定律：$m\dfrac{d^2x}{dt^2} = -kx$。`, R`試解 $x = A\cos(\omega t + \phi)$，代入得 $-m\omega^2 = -k$。`,
             R`只要 $\omega = \sqrt{k/m}$ 就成立；$A$、$\phi$ 由初始位置與速度決定。`],
    links: ['f13-3', 'f13-1', 'f14-2'], sim: 'oscillator' },
  { id: 'f13-3', name: '彈簧振子',
    tex: R`@{w}{\omega} = \sqrt{\frac{@{k}{k}}{@{m}{m}}},\qquad @{T}{T} = 2\pi\sqrt{\frac{m}{k}}`,
    sym: [['w', R`\omega`, '角頻率', 'rad/s', ''], ['k', R`k`, '彈力常數', 'N/m', ''], ['m', R`m`, '質量', 'kg', ''], ['T', R`T`, '週期', 's', '']],
    idea: '彈簧越硬振得越快，質量越大振得越慢；週期和振幅無關。',
    derive: [R`由 $-m\omega^2 = -k$ 得 $\omega = \sqrt{k/m}$。`, R`$T = 2\pi/\omega = 2\pi\sqrt{m/k}$。`],
    links: ['f13-2', 'f13-6', 'f6-3'], sim: 'oscillator',
    ex: [{ ref: '例題 13.2 調諧質量阻尼器', q: R`紐約花旗大樓頂的 373 Mg 混凝土塊，振盪一次要 6.80 s。等效彈力常數？`,
           a: R`$k = m\left(\dfrac{2\pi}T\right)^2 = (373\times10^3)\left(\dfrac{2\pi}{6.80}\right)^2 \approx 3.2\times10^5\ \text{N/m}$。` }] },
  { id: 'f13-4', name: '單擺',
    tex: R`@{T}{T} = 2\pi\sqrt{\frac{@{L}{L}}{@{g}{g}}}`,
    sym: [['T', R`T`, '週期', 's', ''], ['L', R`L`, '擺長', 'm', ''], ['g', R`g`, '重力加速度', 'm/s²', '']],
    idea: '小角度時單擺近似簡諧運動，週期只和擺長、g 有關，與質量、振幅無關。',
    derive: [R`切線方向回復力 $-mg\sin\theta \approx -mg\theta$（小角度）。`, R`弧長 $s = L\theta$：$mL\ddot\theta = -mg\theta$。`, R`$\omega = \sqrt{g/L}$，$T = 2\pi\sqrt{L/g}$。`],
    links: ['f13-3', 'f13-5'], sim: 'oscillator' },
  { id: 'f13-5', name: '物理擺',
    tex: R`@{T}{T} = 2\pi\sqrt{\frac{@{I}{I}}{@{m}{m}\,@{g}{g}\,@{d}{d}}}`,
    sym: [['T', R`T`, '週期', 's', ''], ['I', R`I`, '對支點的轉動慣量', 'kg·m²', ''], ['m', R`m`, '質量', 'kg', ''],
          ['g', R`g`, '重力加速度', 'm/s²', ''], ['d', R`d`, '支點到質心的距離', 'm', '']],
    idea: '任何繞支點擺動的剛體都是物理擺；用轉動慣量取代單擺的 mL²。',
    derive: [R`重力力矩 $\tau = -mgd\sin\theta \approx -mgd\,\theta$。`, R`$I\ddot\theta = -mgd\,\theta$，$\omega = \sqrt{mgd/I}$。`, R`質點 $I = mL^2$、$d = L$ 時回到單擺公式。`],
    links: ['f13-4', 'f10-5', 'f10-4'],
    ex: [{ ref: '例題 13.4 走路', q: R`走路時離地的腿像物理擺。把 90 cm 長的腿當成繞一端擺動的均勻細桿，週期多少？`,
           a: R`$I = \tfrac13 mL^2$、$d = L/2$：$T = 2\pi\sqrt{\dfrac{2L}{3g}} = 2\pi\sqrt{\dfrac{2(0.90)}{3(9.8)}} \approx 1.6\ \text{s}$。` }] },
  { id: 'f13-6', name: '簡諧運動的能量',
    tex: R`@{E}{E} = \tfrac12 @{m}{m}@{v}{v}^2 + \tfrac12 @{k}{k}@{x}{x}^2 = \tfrac12 k@{A}{A}^2`,
    sym: [['E', R`E`, '總能量', 'J', ''], ['m', R`m`, '質量', 'kg', ''], ['v', R`v`, '速率', 'm/s', ''],
          ['k', R`k`, '彈力常數', 'N/m', ''], ['x', R`x`, '位移', 'm', ''], ['A', R`A`, '振幅', 'm', '']],
    idea: '動能和位能來回交換，總能量由振幅決定；最大速率在平衡點，v_max = ωA。',
    derive: [R`端點 $x = \pm A$ 時 $v = 0$，所以 $E = \tfrac12 kA^2$。`, R`平衡點 $x = 0$：$\tfrac12 mv_{max}^2 = \tfrac12 kA^2$，$v_{max} = \omega A$。`, R`最大加速度在端點：$a_{max} = \omega^2A$。`],
    links: ['f7-3', 'f7-4', 'f13-3'], sim: 'oscillator' },
  { id: 'f13-7', name: '阻尼振盪',
    tex: R`@{x}{x(t)} = @{A}{A}\,e^{-@{b}{b}t/2@{m}{m}}\cos(\omega' t + \phi)`,
    sym: [['x', R`x(t)`, '位移', 'm', ''], ['A', R`A`, '初始振幅', 'm', ''], ['b', R`b`, '阻尼常數', 'kg/s', '阻力 = −bv'], ['m', R`m`, '質量', 'kg', '']],
    idea: '阻力讓振幅以指數衰減；阻尼不大時，頻率 ω′ = √(k/m − (b/2m)²) 幾乎不變。',
    derive: [R`運動方程式 $m\ddot x = -kx - b\dot x$。`, R`解為衰減的餘弦，$\omega' = \sqrt{k/m - (b/2m)^2}$。`, R`振幅減半的時間：$e^{-bt/2m} = \tfrac12$，$t_{1/2} = \dfrac{2m}b\ln2$。`],
    links: ['f13-2'], sim: 'oscillator' }
], [
  { id: 'p13-1', ref: '改編自例題 13.2 調諧質量阻尼器', f: ['f13-6', 'f13-3'],
    q: R`373 Mg 的阻尼塊振盪週期 6.80 s，強風中的振幅是 110 cm。它的最大速率是多少？`,
    unit: 'm/s', ans: 1.016,
    hints: [R`$v_{max} = \omega A$。`, R`$\omega = 2\pi/T$，振幅要換成公尺。`],
    sol: R`$\omega = 2\pi/6.80 \approx 0.924\ \text{rad/s}$，$v_{max} = (0.924)(1.10) \approx 1.0\ \text{m/s}$；最大加速度 $\omega^2A \approx 0.94\ \text{m/s}^2$。` },
  { id: 'p13-2', ref: '改編自例題 13.3 拯救泰山', f: ['f13-4'],
    q: R`泰山和珍站在同高度的兩根樹枝上，25 m 長的藤蔓綁在兩人中間正上方。珍抓著藤蔓從靜止盪出，要多久才能盪到泰山那裡？`,
    unit: 's', ans: 5.018,
    hints: [R`從一端盪到另一端是半個週期。`, R`$T = 2\pi\sqrt{L/g}$，所求是 $T/2$。`],
    sol: R`$\tfrac12 T = \pi\sqrt{\dfrac{25}{9.8}} \approx 5.0\ \text{s}$。`,
    sim: { id: 'oscillator', preset: { mode: 'pendulum', L: 25, A: 0.35, b: 0 } } },
  { id: 'p13-3', ref: '改編自例題 13.6 壞掉的避震器', f: ['f13-7'],
    q: R`汽車懸吊 $m = 1200\ \text{kg}$、$k = 58\ \text{kN/m}$，老舊避震器的阻尼常數 $b = 230\ \text{kg/s}$。壓到坑洞後，振幅降到一半之前大約會振幾次？`,
    unit: '次', ans: 8.0,
    hints: [R`振幅減半時間 $t_{1/2} = \dfrac{2m}b\ln2$。`, R`振盪頻率 $f' = \dfrac{\omega'}{2\pi}$，$\omega' \approx \sqrt{k/m}$。`, R`次數 = $t_{1/2}\times f'$。`],
    sol: R`$t_{1/2} = \dfrac{2(1200)}{230}\ln2 \approx 7.2\ \text{s}$，$\omega' \approx \sqrt{58000/1200} \approx 6.95\ \text{rad/s}$，$f' \approx 1.11\ \text{Hz}$，約振 8 次。` }
]);

/* ---------- Ch14 ---------- */
chapter({ id: 14, exam: 2, title: '波動', en: 'Wave Motion',
  blurb: '波把能量傳出去而不搬運物質；疊加產生駐波，移動產生都卜勒效應。' }, [
  { id: 'f14-1', name: '波速',
    tex: R`@{v}{v} = @{lam}{\lambda}\,@{f}{f} = \frac{\lambda}{@{T}{T}}`,
    sym: [['v', R`v`, '波速', 'm/s', ''], ['lam', R`\lambda`, '波長', 'm', ''], ['f', R`f`, '頻率', 'Hz', ''], ['T', R`T`, '週期', 's', '']],
    idea: '一個週期的時間內，波形剛好前進一個波長。',
    derive: [R`波峰經過一個週期 $T$ 移動到下一個波峰的位置，距離 $\lambda$。`, R`$v = \lambda/T = \lambda f$。`],
    links: ['f13-1', 'f14-2', 'f14-3'],
    ex: [{ ref: '例題 14.1 衝浪', q: R`海浪波峰間距 14 m，衝浪者從波谷到波峰上下 3.6 m，花 1.5 s。波速多少？`,
           a: R`波谷到波峰是半個週期，$T = 3.0\ \text{s}$。$v = \lambda/T = 14/3.0 \approx 4.7\ \text{m/s}$；振幅 $A = 1.8\ \text{m}$。` }] },
  { id: 'f14-2', name: '簡諧波',
    tex: R`@{y}{y(x,t)} = @{A}{A}\cos(@{k}{k}\,@{x}{x} - @{w}{\omega}\,@{t}{t})`,
    sym: [['y', R`y`, '介質的位移', 'm', ''], ['A', R`A`, '振幅', 'm', ''], ['k', R`k`, '波數', 'rad/m', R`$k = 2\pi/\lambda$`],
          ['x', R`x`, '位置', 'm', ''], ['w', R`\omega`, '角頻率', 'rad/s', ''], ['t', R`t`, '時間', 's', '']],
    idea: '固定 x 看是簡諧振動，固定 t 看是餘弦波形；kx − ωt 為定值的點以 v = ω/k 前進。',
    derive: [R`任何形狀 $f(x)$ 以速度 $v$ 向 +x 移動：$y = f(x - vt)$。`, R`取 $f$ 為餘弦：$A\cos[k(x - vt)]$。`, R`令 $kv = \omega$，所以 $v = \omega/k = \lambda f$。`],
    links: ['f14-1', 'f13-2', 'f14-6'], sim: 'standing' },
  { id: 'f14-3', name: '弦上的波速',
    tex: R`@{v}{v} = \sqrt{\frac{@{F}{F}}{@{mu}{\mu}}}`,
    sym: [['v', R`v`, '波速', 'm/s', ''], ['F', R`F`, '弦的張力', 'N', ''], ['mu', R`\mu`, '線密度', 'kg/m', '每公尺的質量']],
    idea: '弦拉得越緊、越輕，波跑得越快——調音就是調張力。',
    derive: [R`取波峰附近一小段弦，在隨波移動的座標中看成以速率 $v$ 繞圓。`, R`張力的向心分量提供 $(\mu\Delta x)v^2/R$。`, R`解出 $v = \sqrt{F/\mu}$。`],
    links: ['f14-1', 'f14-6'],
    ex: [{ ref: '例題 14.2 攀岩', q: R`43 m 長、5.0 kg 的繩子連著兩位攀岩者。一人敲繩子，1.4 s 後另一人感覺到。繩子張力？`,
           a: R`$v = L/t$、$\mu = m/L$，$F = \mu v^2 = \dfrac{mL}{t^2} = \dfrac{(5.0)(43)}{1.4^2} \approx 110\ \text{N}$。` }] },
  { id: 'f14-4', name: '波的強度',
    tex: R`@{I}{I} = \frac{@{P}{P}}{4\pi\,@{r}{r}^2}`,
    sym: [['I', R`I`, '強度', 'W/m²', ''], ['P', R`P`, '波源功率', 'W', ''], ['r', R`r`, '到波源的距離', 'm', '']],
    idea: '點波源的能量均勻散到球面上，強度與距離平方成反比。',
    derive: [R`功率 $P$ 平均分到半徑 $r$ 的球面，面積 $4\pi r^2$。`],
    links: ['f14-5', 'f16-6'],
    ex: [{ ref: '例題 14.3 閱讀燈', q: R`書離 75 W 燈泡 1.9 m 時剛好看得清楚。換成 40 W 燈泡，書要放多遠才有同樣強度？`,
           a: R`$\dfrac{75}{1.9^2} = \dfrac{40}{r^2}$，$r = 1.9\sqrt{40/75} \approx 1.4\ \text{m}$。` }] },
  { id: 'f14-5', name: '聲強級（分貝）',
    tex: R`@{beta}{\beta} = 10\log_{10}\frac{@{I}{I}}{@{I0}{I_0}}`,
    sym: [['beta', R`\beta`, '聲強級', 'dB', ''], ['I', R`I`, '強度', 'W/m²', ''], ['I0', R`I_0`, '聽覺閾值', 'W/m²', '10⁻¹² W/m²']],
    idea: '耳朵的感覺是對數的：強度變 10 倍增加 10 dB，聽起來大約響一倍。',
    derive: [R`兩聲音的差：$\beta_2 - \beta_1 = 10\log_{10}(I_2/I_1)$。`, R`反解：$I_2/I_1 = 10^{(\beta_2 - \beta_1)/10}$。`],
    links: ['f14-4'],
    ex: [{ ref: '例題 14.4 電視', q: R`電視從 75 dB 轉小到 60 dB，功率變成原來的幾倍？`,
           a: R`$\dfrac{P_2}{P_1} = 10^{(60 - 75)/10} = 10^{-1.5} \approx 0.032$，約 1/30。` }] },
  { id: 'f14-6', name: '駐波（兩端固定）',
    tex: R`@{lam}{\lambda_n} = \frac{2@{L}{L}}{@{n}{n}},\qquad @{f}{f_n} = \frac{n\,@{v}{v}}{2L}`,
    sym: [['lam', R`\lambda_n`, '第 n 諧音的波長', 'm', ''], ['L', R`L`, '弦長或兩端開口管長', 'm', ''],
          ['n', R`n`, '諧音編號', '1, 2, 3…', ''], ['f', R`f_n`, '諧音頻率', 'Hz', ''], ['v', R`v`, '波速', 'm/s', '']],
    idea: '兩端都是節點時，長度必須剛好是半波長的整數倍，所以只有特定頻率能形成駐波。',
    derive: [R`兩列反方向的波疊加：$y = 2A\sin kx\cos\omega t$。`, R`兩端節點：$\sin kL = 0$，所以 $kL = n\pi$。`,
             R`$\lambda_n = 2L/n$，$f_n = v/\lambda_n = nv/2L$。兩端開口的管子條件相同。`],
    links: ['f14-1', 'f14-3', 'f32-1'], sim: 'standing',
    ex: [{ ref: '例題 14.6 低音管', q: R`低音管折疊後等效為 5.5 m 長、兩端開口的空氣柱，聲速 343 m/s。基音頻率？`,
           a: R`$f_1 = \dfrac v{2L} = \dfrac{343}{2(5.5)} \approx 31\ \text{Hz}$。` }] },
  { id: 'f14-7', name: '都卜勒效應',
    tex: R`@{fp}{f'} = \frac{@{f}{f}}{1 \mp @{u}{u}/@{v}{v}}\ \ \text{（波源動）},\qquad f' = f\left(1 \pm \frac{u}{v}\right)\ \ \text{（觀察者動）}`,
    sym: [['fp', R`f'`, '聽到的頻率', 'Hz', ''], ['f', R`f`, '波源頻率', 'Hz', ''],
          ['u', R`u`, '波源或觀察者的速率', 'm/s', '靠近取上面的符號'], ['v', R`v`, '聲速', 'm/s', '約 343 m/s']],
    idea: '波源靠近時，前方的波峰被擠密，頻率變高；遠離時變低。',
    derive: [R`波源移動：一個週期內波源前進 $uT$，前方波長縮短為 $\lambda' = (v - u)T$。`,
             R`$f' = v/\lambda' = \dfrac{f}{1 - u/v}$。`, R`觀察者移動：相對波速變成 $v \pm u$，$f' = f(1 \pm u/v)$。`],
    links: ['f14-1'], sim: 'doppler' }
], [
  { id: 'p14-1', ref: '改編自例題 14.7 走音', f: ['f14-7'],
    q: R`一輛車開著音響高速駛來。路邊有絕對音感的人發現應該是 G（392 Hz）的音，聽起來像 A（440 Hz）。聲速 343 m/s，車速多少？`,
    unit: 'm/s', ans: 37.42,
    hints: [R`波源靠近：$f' = \dfrac{f}{1 - u/v}$。`, R`解出 $u = v\left(1 - \dfrac f{f'}\right)$。`],
    sol: R`$u = (343)\left(1 - \dfrac{392}{440}\right) \approx 37\ \text{m/s}$，約 134 km/h。`,
    sim: { id: 'doppler', preset: { u: 37.4 } } },
  { id: 'p14-2', ref: '改編自觀念題 14.3 兩顆恆星', f: ['f14-4'],
    q: R`兩顆完全相同的恆星，較遠那顆的光強度只有較近那顆的 1%。較遠的恆星距離是較近的幾倍？`,
    unit: '倍', ans: 10,
    hints: [R`同樣功率，$I \propto 1/r^2$。`],
    sol: R`$\dfrac{I_2}{I_1} = \left(\dfrac{r_1}{r_2}\right)^2 = 0.01$，所以 $r_2 = 10r_1$。` },
  { id: 'p14-3', ref: '改編自例題 14.6 低音管', f: ['f14-6'],
    q: R`承例題 14.6，5.5 m 長、兩端開口的低音管（聲速 343 m/s），它的第 3 諧音頻率是多少？`,
    unit: 'Hz', ans: 93.55,
    hints: [R`$f_n = \dfrac{nv}{2L}$，代入 $n = 3$。`],
    sol: R`$f_3 = \dfrac{3(343)}{2(5.5)} \approx 94\ \text{Hz}$，剛好是基音的 3 倍。`,
    sim: { id: 'standing', preset: { n: 3 } } }
]);

/* ---------- Ch32 ---------- */
chapter({ id: 32, exam: 2, title: '干涉與繞射', en: 'Interference and Diffraction',
  blurb: '路徑差決定加強或抵消：雙狹縫、光柵、薄膜、單狹縫都是同一個原理。' }, [
  { id: 'f32-1', name: '干涉條件',
    tex: R`\Delta @{r}{r} = @{m}{m}\,@{lam}{\lambda}\ \text{（建設性）},\qquad \Delta r = \left(m + \tfrac12\right)\lambda\ \text{（破壞性）}`,
    sym: [['r', R`\Delta r`, '兩波源到某點的路徑差', 'm', ''], ['m', R`m`, '整數', '0, ±1, ±2…', ''], ['lam', R`\lambda`, '波長', 'm', '']],
    idea: '路徑差是整數個波長，波峰對波峰而加強；差半個波長，波峰對波谷而抵消。',
    derive: [R`疊加原理：$y = y_1 + y_2$。`, R`同相波源，相位差 $= 2\pi\,\Delta r/\lambda$。`, R`相位差 $2\pi m$ 為建設性，$(2m + 1)\pi$ 為破壞性。`],
    links: ['f14-6', 'f32-2'],
    ex: [{ ref: '例題 14.5 平靜的海水', q: R`防波堤上兩個相距 20 m 的開口。離堤 75 m、在兩開口中間的地方浪很大；沿堤平行移 33 m 處海水平靜（第一個平靜點）。波長？`,
           a: R`$AP = \sqrt{75^2 + 43^2} \approx 86.5\ \text{m}$，$BP = \sqrt{75^2 + 23^2} \approx 78.4\ \text{m}$。第一個破壞點 $\Delta r = \lambda/2$，所以 $\lambda \approx 2(8.1) \approx 16\ \text{m}$。` }] },
  { id: 'f32-2', name: '雙狹縫干涉',
    tex: R`@{d}{d}\sin@{th}{\theta} = @{m}{m}\,@{lam}{\lambda},\qquad @{y}{y_m} \approx \frac{m\lambda\,@{L}{L}}{d}`,
    sym: [['d', R`d`, '兩狹縫的間距', 'm', ''], ['th', R`\theta`, '亮紋方向的角度', 'rad', ''], ['m', R`m`, '亮紋級數', '0, ±1, ±2…', ''],
          ['lam', R`\lambda`, '波長', 'm', ''], ['y', R`y_m`, '第 m 亮紋到中央的距離', 'm', ''], ['L', R`L`, '狹縫到屏幕的距離', 'm', '']],
    idea: '兩條狹縫像兩個同相波源；L 遠大於 d 時，亮紋在屏幕上等間距排列。',
    derive: [R`遠處兩路徑幾乎平行，路徑差 $\Delta r \approx d\sin\theta$。`, R`亮紋：$d\sin\theta = m\lambda$。`, R`小角度 $\sin\theta \approx \tan\theta = y/L$，得 $y_m = m\lambda L/d$。`],
    links: ['f32-1', 'f32-3', 'f32-5'], sim: 'doubleslit',
    ex: [{ ref: '例題 32.1 雷射光', q: R`兩狹縫相距 0.075 mm，離屏幕 1.5 m。雷射照射後第 3 級亮紋距中央 3.8 cm。波長？`,
           a: R`$\lambda = \dfrac{y\,d}{mL} = \dfrac{(0.038)(7.5\times10^{-5})}{3(1.5)} \approx 633\ \text{nm}$，是氦氖雷射的紅光。` }] },
  { id: 'f32-3', name: '繞射光柵與解析度',
    tex: R`@{d}{d}\sin@{th}{\theta} = @{m}{m}\,@{lam}{\lambda},\qquad \frac{\lambda}{\Delta\lambda} = m\,@{N}{N}`,
    sym: [['d', R`d`, '刻線間距', 'm', ''], ['th', R`\theta`, '亮紋角度', 'rad', ''], ['m', R`m`, '級數', '', ''],
          ['lam', R`\lambda`, '波長', 'm', ''], ['N', R`N`, '被照到的刻線數', '', '']],
    idea: '狹縫越多，亮紋越尖銳，越能分開兩個非常接近的波長；用高級數光譜也有幫助。',
    derive: [R`相鄰兩縫路徑差 $d\sin\theta = m\lambda$ 時，所有縫都同相。`, R`主極大的寬度約隨 $1/N$ 變窄。`, R`解析度 $R = \lambda/\Delta\lambda = mN$。`],
    links: ['f32-2'],
    ex: [{ ref: '例題 32.2 光柵光譜儀', q: R`氫的 Hα（656.3 nm）與 Hβ（486.1 nm）經過每公分 6000 條的光柵，一級光譜的角度差？`,
           a: R`$d = 1/6000\ \text{cm} = 1.67\ \mu\text{m}$。$\theta_\alpha = \sin^{-1}(656.3/1667) \approx 23.2^\circ$，$\theta_\beta = \sin^{-1}(486.1/1667) \approx 17.0^\circ$，相差約 6.2°。` }] },
  { id: 'f32-4', name: '薄膜干涉',
    tex: R`2\,@{n}{n}\,@{d}{d} = \left(@{m}{m} + \tfrac12\right)@{lam}{\lambda}\quad\text{（一次反射有相位反轉時的亮紋）}`,
    sym: [['n', R`n`, '薄膜折射率', '', ''], ['d', R`d`, '薄膜厚度', 'm', ''], ['m', R`m`, '整數', '0, 1, 2…', ''], ['lam', R`\lambda`, '真空中的波長', 'm', '']],
    idea: '膜的上下表面各反射一道光並互相干涉；光從低折射率射向高折射率反射時，會多出半個波長的相位反轉。',
    derive: [R`兩道反射光路徑差 $2d$，膜內波長是 $\lambda/n$，光程差 $2nd$。`, R`肥皂膜（空氣–膜–空氣）只有上表面反射會反轉。`, R`總差 = $2nd + \lambda/2$，等於 $m\lambda$ 時加強，即 $2nd = (m + \tfrac12)\lambda$。`],
    links: ['f32-1'],
    ex: [{ ref: '觀念題 32.1 肥皂膜', q: R`直立的肥皂膜最上方快破掉時，為什麼看起來是黑的？`,
           a: R`頂端的膜薄到 $d \ll \lambda$，兩道反射光的路徑差幾乎為零，只剩下上表面反射的半波相位反轉，所以所有顏色都互相抵消。` }] },
  { id: 'f32-5', name: '單狹縫繞射',
    tex: R`@{a}{a}\sin@{th}{\theta} = @{m}{m}\,@{lam}{\lambda}\quad(m = \pm1, \pm2, \dots)\ \text{暗紋}`,
    sym: [['a', R`a`, '狹縫寬度', 'm', ''], ['th', R`\theta`, '暗紋角度', 'rad', ''], ['m', R`m`, '暗紋級數', '不含 0', ''], ['lam', R`\lambda`, '波長', 'm', '']],
    idea: '把狹縫分成上下兩半，對應點路徑差 λ/2 時全部成對抵消而成暗紋；中央亮紋寬度是其他亮紋的兩倍。',
    derive: [R`依惠更斯原理，狹縫上每一點都是子波源。`, R`上下兩半對應點路徑差 $\tfrac a2\sin\theta = \tfrac\lambda2$ 時成對抵消，得 $a\sin\theta = \lambda$。`, R`再分成 4、6… 份，得 $a\sin\theta = m\lambda$。`],
    links: ['f32-2', 'f32-6'], sim: 'doubleslit' },
  { id: 'f32-6', name: '繞射極限（瑞利準則）',
    tex: R`@{th}{\theta_{min}} = 1.22\,\frac{@{lam}{\lambda}}{@{D}{D}}`,
    sym: [['th', R`\theta_{min}`, '最小可分辨角', 'rad', ''], ['lam', R`\lambda`, '波長', 'm', ''], ['D', R`D`, '圓形孔徑直徑', 'm', '']],
    idea: '再完美的望遠鏡也受繞射限制：口徑越大、波長越短，能分辨的細節越小。',
    derive: [R`圓孔繞射的第一暗環在 $\sin\theta = 1.22\lambda/D$。`, R`瑞利準則：一個點的中央亮斑落在另一點的第一暗環上，就剛好可分辨。`],
    links: ['f32-5'],
    ex: [{ ref: '例題 32.5 小行星警報', q: R`距地球 $20\times10^6$ km 的小行星，用 2.4 m 口徑的哈伯望遠鏡、550 nm 的光，最小能分辨多大？`,
           a: R`$\theta_{min} = 1.22\dfrac{550\times10^{-9}}{2.4} \approx 2.8\times10^{-7}\ \text{rad}$。大小 $\ell = L\theta \approx (20\times10^9)(2.8\times10^{-7}) \approx 5.6\ \text{km}$。` }] }
], [
  { id: 'p32-1', ref: '改編自例題 32.4 沙塵暴', f: ['f32-1'],
    q: R`用 633 nm 雷射的邁克生干涉儀檢查被沙塵打出凹洞的鏡面，凹洞處的干涉條紋偏移了 0.2 個條紋（額外光程 0.2λ）。凹洞大約多深？（以 nm 為單位）`,
    unit: 'nm', ans: 63.3,
    hints: [R`光進出凹洞各走一次，深度 $d$ 造成的額外路徑是 $2d$。`, R`$2d = 0.2\lambda$。`],
    sol: R`$d = 0.1\lambda = 0.1(633) \approx 63\ \text{nm}$。` },
  { id: 'p32-2', ref: '改編自例題 32.3 看見雙星', f: ['f32-3'],
    q: R`雙星中靜止的主星 Hα 線在 656.272 nm，伴星因都卜勒效應移到 656.329 nm。光柵被照到 5000 條刻線，至少要用第幾級光譜才能分開這兩條線？`,
    unit: '級', ans: 3,
    hints: [R`需要 $mN \ge \dfrac\lambda{\Delta\lambda}$。`, R`$\Delta\lambda = 0.057\ \text{nm}$，算出 m 後要取整數。`],
    sol: R`$m \ge \dfrac{656.272}{(0.057)(5000)} \approx 2.3$，級數必須是整數，所以至少第 3 級。` },
  { id: 'p32-3', ref: '改編自例題 32.1 雷射光', f: ['f32-2'],
    q: R`同一組雙狹縫（間距 0.075 mm、離屏幕 1.5 m）改用 532 nm 的綠光雷射。第 3 級亮紋離中央多遠？（以 cm 為單位）`,
    unit: 'cm', ans: 3.192,
    hints: [R`$y_m = \dfrac{m\lambda L}d$。`, R`單位統一成公尺，最後換成公分。`],
    sol: R`$y_3 = \dfrac{3(532\times10^{-9})(1.5)}{7.5\times10^{-5}} \approx 0.032\ \text{m} = 3.2\ \text{cm}$，比紅光的 3.8 cm 近。`,
    sim: { id: 'doubleslit', preset: { lam: 532, d: 0.075, L: 1.5, a: 0.01 } } }
]);

chapter({ id: 15, exam: 3, title: '流體運動', en: 'Fluid Motion',
  blurb: '靜止流體看壓力與浮力，流動的流體看連續方程與白努利。' }, [
  { id: 'f15-1', name: '密度與壓力',
    tex: R`@{rho}{\rho} = \frac{@{m}{m}}{@{V}{V}},\qquad @{p}{p} = \frac{@{F}{F}}{@{A}{A}}`,
    sym: [['rho', R`\rho`, '密度', 'kg/m³', '水 1000 kg/m³'], ['m', R`m`, '質量', 'kg', ''], ['V', R`V`, '體積', 'm³', ''],
          ['p', R`p`, '壓力', 'Pa', '1 atm ≈ 101.3 kPa'], ['F', R`F`, '垂直作用力', 'N', ''], ['A', R`A`, '面積', 'm²', '']],
    idea: '壓力是單位面積上的垂直力；靜止流體中某一點的壓力在各方向都一樣大。',
    derive: [R`密度與壓力都是定義：$\rho = m/V$、$p = F/A$。`, R`1 Pa = 1 N/m²。`],
    links: ['f15-2', 'f17-1'] },
  { id: 'f15-2', name: '靜止流體中的壓力',
    tex: R`@{p}{p} = @{p0}{p_0} + @{rho}{\rho}\,@{g}{g}\,@{h}{h}`,
    sym: [['p', R`p`, '深度 h 處的壓力', 'Pa', ''], ['p0', R`p_0`, '液面上的壓力', 'Pa', '通常是大氣壓'],
          ['rho', R`\rho`, '液體密度', 'kg/m³', ''], ['g', R`g`, '重力加速度', 'm/s²', ''], ['h', R`h`, '深度', 'm', '']],
    idea: '越深壓力越大，因為要撐住上方液柱的重量；水每深 10 m 大約增加 1 atm。',
    derive: [R`取截面積 $A$、高 $dh$ 的液柱，上下壓力差撐住它的重量。`, R`$(p + dp)A = pA + \rho gA\,dh$，即 $dp/dh = \rho g$。`, R`積分得 $p = p_0 + \rho gh$。`],
    links: ['f15-1', 'f15-3', 'f15-4', 'f15-6'],
    ex: [{ ref: '例題 15.1(a) 海洋深度', q: R`水深多少時，壓力是大氣壓的兩倍？（取 1 atm = 100 kPa）`,
           a: R`$\rho gh = p_0$，$h = \dfrac{100\times10^3}{(1000)(9.8)} \approx 10\ \text{m}$。` }] },
  { id: 'f15-3', name: '帕斯卡原理（液壓機）',
    tex: R`\frac{@{F1}{F_1}}{@{A1}{A_1}} = \frac{@{F2}{F_2}}{@{A2}{A_2}}`,
    sym: [['F1', R`F_1`, '小活塞上的力', 'N', ''], ['A1', R`A_1`, '小活塞面積', 'm²', ''], ['F2', R`F_2`, '大活塞上的力', 'N', ''], ['A2', R`A_2`, '大活塞面積', 'm²', '']],
    idea: '對封閉液體加的壓力會傳到每一處；小活塞用小力，大活塞就能撐起大重量。',
    derive: [R`兩活塞在同一高度，壓力相同：$p = F_1/A_1 = F_2/A_2$。`, R`代價是小活塞要推較長的距離（功相同）。`],
    links: ['f15-2'],
    ex: [{ ref: '例題 15.2 液壓升降機', q: R`汽車加大活塞共 3200 kg。小活塞直徑 15 cm、大活塞直徑 120 cm，小活塞要施多大的力？`,
           a: R`$F_1 = mg\left(\dfrac{d_1}{d_2}\right)^2 = (3200)(9.8)\left(\dfrac{15}{120}\right)^2 = 490\ \text{N}$。` }] },
  { id: 'f15-4', name: '浮力（阿基米德原理）',
    tex: R`@{Fb}{F_b} = @{rho}{\rho_{f}}\,@{V}{V_{sub}}\,@{g}{g}`,
    sym: [['Fb', R`F_b`, '浮力', 'N', '方向向上'], ['rho', R`\rho_f`, '流體密度', 'kg/m³', ''],
          ['V', R`V_{sub}`, '排開流體的體積', 'm³', '物體在液面下的體積'], ['g', R`g`, '重力加速度', 'm/s²', '']],
    idea: '浮力等於被排開流體的重量；漂浮時浮力 = 重量，所以沒入的比例 = 物體密度 / 流體密度。',
    derive: [R`想像把物體換成同形狀的一團流體，它會靜止，所以周圍流體給它的向上力 = 它的重量。`, R`把物體放回去，周圍壓力分布不變，浮力相同。`, R`漂浮：$\rho_{obj}Vg = \rho_fV_{sub}g$，$\dfrac{V_{sub}}V = \dfrac{\rho_{obj}}{\rho_f}$。`],
    links: ['f15-2', 'f15-1'], sim: 'buoyancy',
    ex: [{ ref: '例題 15.4 冰山一角', q: R`冰山平均密度是海水的 0.86 倍。冰山有多少比例在水面下？`,
           a: R`$\dfrac{V_{sub}}{V} = \dfrac{\rho_{ice}}{\rho_{water}} = 0.86$，86% 在水下，只看得到「一角」。` }] },
  { id: 'f15-5', name: '連續方程',
    tex: R`@{A1}{A_1}\,@{v1}{v_1} = @{A2}{A_2}\,@{v2}{v_2}`,
    sym: [['A1', R`A_1`, '截面積一', 'm²', ''], ['v1', R`v_1`, '流速一', 'm/s', ''], ['A2', R`A_2`, '截面積二', 'm²', ''], ['v2', R`v_2`, '流速二', 'm/s', '']],
    idea: '不可壓縮的流體流量守恆：管子變窄，流速變快（捏住水管口的效果）。',
    derive: [R`$dt$ 時間內通過截面的質量是 $\rho Av\,dt$。`, R`穩定流動時流入 = 流出，$\rho$ 不變，所以 $Av$ 為常數。`],
    links: ['f15-6'],
    ex: [{ ref: '例題 15.5 奧賽布爾峽谷', q: R`河寬 40 m、深 2.2 m、流速 4.5 m/s，流進只有 3.7 m 寬的峽谷後流速變成 6.0 m/s。峽谷中的水深？`,
           a: R`$d_1w_1v_1 = d_2w_2v_2$，$d_2 = \dfrac{(2.2)(40)(4.5)}{(3.7)(6.0)} \approx 18\ \text{m}$。` }] },
  { id: 'f15-6', name: '白努利方程',
    tex: R`@{p}{p} + \tfrac12\,@{rho}{\rho}\,@{v}{v}^2 + \rho\,@{g}{g}\,@{y}{y} = \text{常數}`,
    sym: [['p', R`p`, '壓力', 'Pa', ''], ['rho', R`\rho`, '密度', 'kg/m³', ''], ['v', R`v`, '流速', 'm/s', ''], ['g', R`g`, '重力加速度', 'm/s²', ''], ['y', R`y`, '高度', 'm', '']],
    idea: '沿著流線的能量守恆：流速快的地方壓力低——文氏管、機翼、草原犬鼠的洞都靠它。',
    derive: [R`一小段體積 $\Delta V$ 從 1 流到 2，前後壓力做的淨功 $(p_1 - p_2)\Delta V$。`, R`動能變化 $\tfrac12\rho\Delta V(v_2^2 - v_1^2)$，位能變化 $\rho\Delta Vg(y_2 - y_1)$。`, R`功能定理整理後，每一點的 $p + \tfrac12\rho v^2 + \rho gy$ 都相同。`],
    links: ['f7-4', 'f15-5', 'f15-7', 'f15-2'],
    ex: [{ ref: '例題 15.7 文氏流量計', q: R`量測截面 $A_1$ 和縮口 $A_2$ 的壓力差 $\Delta p$，就能算出流速。寬管中的流速？`,
           a: R`白努利 $p_1 + \tfrac12\rho v_1^2 = p_2 + \tfrac12\rho v_2^2$，連續方程 $v_2 = v_1A_1/A_2$。解得 $v_1 = \sqrt{\dfrac{2\Delta p}{\rho\left[(A_1/A_2)^2 - 1\right]}}$。` }] },
  { id: 'f15-7', name: '托里切利定理',
    tex: R`@{v}{v} = \sqrt{2\,@{g}{g}\,@{h}{h}}`,
    sym: [['v', R`v`, '從小孔流出的速率', 'm/s', ''], ['g', R`g`, '重力加速度', 'm/s²', ''], ['h', R`h`, '液面到小孔的高度', 'm', '']],
    idea: '從液面下 h 深的小孔噴出的速率，跟從 h 高處自由落下一樣。',
    derive: [R`液面：$p = p_{atm}$、$v \approx 0$、$y = h$。小孔：$p = p_{atm}$、$y = 0$。`, R`白努利：$\rho gh = \tfrac12\rho v^2$，$v = \sqrt{2gh}$。`],
    links: ['f15-6', 'f7-4'],
    ex: [{ ref: '例題 15.6 水塔放水', q: R`開口大水塔裝了高度 $h$ 的液體，底部小孔流出的速率？`, a: R`由上式 $v = \sqrt{2gh}$，與液體密度無關。` }] }
], [
  { id: 'p15-1', ref: '改編自例題 15.3 水中搬水泥', f: ['f15-4'],
    q: R`湖底有一塊 60 kg 的混凝土，密度 2200 kg/m³。在水中把它抬起時，它的視重是多少？`,
    unit: 'N', ans: 320.7,
    hints: [R`視重 = 重量 − 浮力。`, R`體積 $V = m/\rho_c$，浮力 $F_b = \rho_wVg$。`],
    sol: R`$F_{app} = \left(1 - \dfrac{\rho_w}{\rho_c}\right)mg = \left(1 - \dfrac{1000}{2200}\right)(60)(9.8) \approx 320\ \text{N}$，大約是陸上重量的一半。`,
    sim: { id: 'buoyancy', preset: { rho: 2200, m: 60, rf: 1000 } } },
  { id: 'p15-2', ref: '改編自第 15 章習題 62 文氏管', f: ['f15-6', 'f15-5'],
    q: R`輸油管上的文氏流量計，縮口半徑是管子的一半。油在寬管中流速 1.9 m/s，寬管與縮口的壓力差 16 kPa。油的密度？`,
    unit: 'kg/m³', ans: 590.9,
    hints: [R`半徑一半，截面積是 1/4，所以 $A_1/A_2 = 4$、縮口流速 $v_2 = 4v_1$。`, R`白努利：$\Delta p = \tfrac12\rho(v_2^2 - v_1^2) = \tfrac12\rho v_1^2(16 - 1)$。`],
    sol: R`$\rho = \dfrac{2\Delta p}{15v_1^2} = \dfrac{2(16\times10^3)}{15(1.9)^2} \approx 590\ \text{kg/m}^3$。` },
  { id: 'p15-3', ref: '改編自例題 15.1(b) 馬里亞納海溝', f: ['f15-2'],
    q: R`馬里亞納海溝深 11 km。取海面氣壓 100 kPa、水密度 1000 kg/m³，用 $p = p_0 + \rho gh$ 算海溝底部的壓力（以 MPa 為單位）。`,
    unit: 'MPa', ans: 107.9,
    hints: [R`$\rho gh = (1000)(9.8)(11\times10^3)$ Pa。`, R`別忘了加上海面的 0.1 MPa。`],
    sol: R`$p = 0.1 + \dfrac{(1000)(9.8)(11000)}{10^6} \approx 108\ \text{MPa}$，約 1100 atm。` }
]);

/* ---------- Ch16 ---------- */
chapter({ id: 16, exam: 3, title: '溫度與熱', en: 'Temperature and Heat',
  blurb: '熱是因溫差而流動的能量：比熱決定升溫多少，傳導與輻射決定流多快。' }, [
  { id: 'f16-1', name: '溫標換算',
    tex: R`@{TK}{T_K} = @{TC}{T_C} + 273.15,\qquad @{TF}{T_F} = \tfrac95\,T_C + 32`,
    sym: [['TK', R`T_K`, '克氏溫度', 'K', '絕對零度為 0 K'], ['TC', R`T_C`, '攝氏溫度', '°C', ''], ['TF', R`T_F`, '華氏溫度', '°F', '']],
    idea: '克氏溫標的零點是絕對零度；熱力學公式裡的 T 一律要用 K。',
    derive: [R`攝氏與克氏的刻度大小相同，只差零點。`, R`華氏：水的冰點 32°F、沸點 212°F，相差 180 度對應 100°C。`],
    links: ['f17-1', 'f16-2'] },
  { id: 'f16-2', name: '比熱',
    tex: R`@{Q}{Q} = @{m}{m}\,@{c}{c}\,\Delta@{T}{T}`,
    sym: [['Q', R`Q`, '熱量', 'J', ''], ['m', R`m`, '質量', 'kg', ''], ['c', R`c`, '比熱', 'J/(kg·K)', '水 4184'], ['T', R`\Delta T`, '溫度變化', 'K 或 °C', '']],
    idea: '同樣的熱量，比熱大的物質溫度變化小；水的比熱特別大，所以能調節氣候。',
    derive: [R`熱容量 $C = Q/\Delta T$。`, R`比熱是每公斤的熱容量：$c = C/m$。`],
    links: ['f16-3', 'f18-1', 'f17-4'],
    ex: [{ ref: '例題 16.1 等洗澡', q: R`熱水器裡 150 kg 的水降到 18°C。加熱到 50°C 要多少熱？用 5.0 kW 的電熱器要多久？`,
           a: R`$Q = (150)(4184)(50 - 18) \approx 20\ \text{MJ}$，$t = Q/P = \dfrac{20\times10^6}{5000} \approx 4000\ \text{s}$，約 1 小時 7 分。` }] },
  { id: 'f16-3', name: '平衡溫度',
    tex: R`@{T}{T} = \frac{@{m1}{m_1}@{c1}{c_1}@{T1}{T_1} + @{m2}{m_2}@{c2}{c_2}@{T2}{T_2}}{m_1c_1 + m_2c_2}`,
    sym: [['T', R`T`, '平衡溫度', '°C', ''], ['m1', R`m_1`, '物體一質量', 'kg', ''], ['c1', R`c_1`, '物體一比熱', 'J/(kg·K)', ''], ['T1', R`T_1`, '物體一初溫', '°C', ''],
          ['m2', R`m_2`, '物體二質量', 'kg', ''], ['c2', R`c_2`, '物體二比熱', 'J/(kg·K)', ''], ['T2', R`T_2`, '物體二初溫', '°C', '']],
    idea: '熱從高溫流向低溫，直到兩者溫度相同；隔熱時一方放出的熱 = 另一方吸收的熱。',
    derive: [R`兩物體吸熱總和為零：$m_1c_1(T - T_1) + m_2c_2(T - T_2) = 0$。`, R`解出 $T$，是以 $mc$ 為權重的平均溫度。`],
    links: ['f16-2'], sim: 'mixing',
    ex: [{ ref: '例題 16.2 冷卻', q: R`1.5 kg、180°C 的鋁鍋（c = 900 J/kg·K）放進 8.0 kg、20°C 的水中。平衡溫度？`,
           a: R`$T = \dfrac{(1.5)(900)(180) + (8.0)(4184)(20)}{(1.5)(900) + (8.0)(4184)} \approx 26^\circ\text{C}$，水的比熱大，溫度幾乎沒變。` }] },
  { id: 'f16-4', name: '熱傳導',
    tex: R`@{H}{H} = -@{k}{k}\,@{A}{A}\,\frac{d@{T}{T}}{dx}`,
    sym: [['H', R`H`, '熱流率', 'W', ''], ['k', R`k`, '熱導率', 'W/(m·K)', '玻璃 0.8、空氣 0.026'], ['A', R`A`, '截面積', 'm²', ''], ['T', R`dT/dx`, '溫度梯度', 'K/m', '']],
    idea: '熱流率正比於面積與溫度梯度，負號表示熱往低溫流；均勻平板 H = kAΔT/Δx。',
    derive: [R`實驗發現熱流率正比於 $A$ 與 $\Delta T$，反比於厚度 $\Delta x$。`, R`取極限寫成梯度形式。`],
    links: ['f16-5', 'f6-6'],
    ex: [{ ref: '例題 16.3 湖水加溫', q: R`湖面積 1.5 km²、深 8.0 m，表面 30°C、湖底 4.0°C，溫度線性變化。水的 k = 0.61 W/m·K，熱傳導速率？`,
           a: R`$H = kA\dfrac{\Delta T}{\Delta x} = (0.61)(1.5\times10^6)\dfrac{26}{8.0} \approx 3.0\ \text{MW}$（往下傳）。` }] },
  { id: 'f16-5', name: '熱阻（R 值）',
    tex: R`@{H}{H} = \frac{@{A}{A}\,\Delta@{T}{T}}{@{R}{R}},\qquad R = \frac{\Delta x}{k}`,
    sym: [['H', R`H`, '熱流率', 'W', ''], ['A', R`A`, '面積', 'm²', ''], ['T', R`\Delta T`, '溫差', 'K', ''], ['R', R`R`, '熱阻', 'm²·K/W', '美制用 ft²·°F·h/Btu']],
    idea: '建材用 R 值標示隔熱能力，R 越大越隔熱；多層材料串聯時 R 直接相加。',
    derive: [R`把 $H = kA\Delta T/\Delta x$ 改寫，定義 $R = \Delta x/k$。`, R`串聯各層熱流相同，溫差相加，所以 $R$ 相加。`],
    links: ['f16-4'],
    ex: [{ ref: '觀念題 省能雙層窗', q: R`為什麼雙層玻璃窗比單層隔熱好很多？`,
           a: R`中間的空氣層熱導率（0.026）只有玻璃（0.8）的約 1/30，大幅提高 R 值；但空氣層太厚會產生對流，所以間距要小。` }] },
  { id: 'f16-6', name: '熱輻射（史蒂芬－波茲曼定律）',
    tex: R`@{P}{P} = @{e}{e}\,@{sig}{\sigma}\,@{A}{A}\,@{T}{T}^4`,
    sym: [['P', R`P`, '輻射功率', 'W', ''], ['e', R`e`, '放射率', '0–1', '黑體 e = 1'], ['sig', R`\sigma`, '史蒂芬－波茲曼常數', 'W/(m²·K⁴)', '5.67 × 10⁻⁸'],
          ['A', R`A`, '表面積', 'm²', ''], ['T', R`T`, '絕對溫度', 'K', '']],
    idea: '所有物體都在輻射，功率正比於 T⁴：溫度加倍，輻射功率變 16 倍。',
    derive: [R`實驗與統計物理都給出 $P \propto T^4$。`, R`淨輻射：$P_{net} = e\sigma A(T^4 - T_{env}^4)$。`],
    links: ['f14-4'],
    ex: [{ ref: '例題 16.5 太陽的溫度', q: R`太陽輻射功率 $3.9\times10^{26}$ W、半徑 $7.0\times10^8$ m，當成黑體，表面溫度？`,
           a: R`$T = \left(\dfrac P{\sigma\,4\pi R^2}\right)^{1/4} = \left(\dfrac{3.9\times10^{26}}{(5.67\times10^{-8})4\pi(7.0\times10^8)^2}\right)^{1/4} \approx 5800\ \text{K}$。` }] }
], [
  { id: 'p16-1', ref: '改編自例題 16.6 熱水器', f: ['f16-4'],
    q: R`隔熱不良的電熱水器，水和周圍每差 1°C 就以傳導散失 120 W。它的加熱器功率 2.5 kW、持續運作，放在保持 15°C 的地下室。水溫最後穩定在幾度？`,
    unit: '°C', ans: 35.83,
    hints: [R`穩定時：加熱功率 = 散熱功率。`, R`$(120)(T - 15) = 2500$。`],
    sol: R`$T = 15 + \dfrac{2500}{120} \approx 36^\circ\text{C}$，不夠熱，需要改善隔熱。` },
  { id: 'p16-2', ref: '改編自例題 16.7 太陽能溫室', f: ['f16-5'],
    q: R`溫室有 300 ft² 的 R-30 不透光牆，和 250 ft² 的 R-1.8 雙層玻璃，玻璃每 ft² 每小時讓 40 Btu 的太陽能進來。室外 15°F 時，溫室溫度幾 °F？`,
    unit: '°F', ans: 82.16,
    hints: [R`穩定時：太陽能輸入 = 牆 + 玻璃的散熱。`, R`散熱 $H = A\Delta T/R$：牆 $300/30 = 10$、玻璃 $250/1.8 \approx 139$（Btu/h/°F）。`, R`輸入 $250 \times 40 = 10000$ Btu/h。`],
    sol: R`$\Delta T = \dfrac{10000}{10 + 138.9} \approx 67^\circ\text{F}$，溫室溫度約 $15 + 67 = 82^\circ\text{F}$。` },
  { id: 'p16-3', ref: '改編自例題 16.2 冷卻', f: ['f16-3'],
    q: R`同一個 1.5 kg、180°C 的鋁鍋（c = 900 J/kg·K）改放進 4.0 kg、20°C 的水中，平衡溫度是多少？`,
    unit: '°C', ans: 31.94,
    hints: [R`用平衡溫度公式，水的 c = 4184 J/kg·K。`],
    sol: R`$T = \dfrac{(1.5)(900)(180) + (4.0)(4184)(20)}{(1.5)(900) + (4.0)(4184)} \approx 32^\circ\text{C}$。水少一半，溫度升得較多。`,
    sim: { id: 'mixing', preset: { m1: 1.5, c1: 900, T1: 180, m2: 4.0, T2: 20 } } }
]);

/* ---------- Ch17 ---------- */
chapter({ id: 17, exam: 3, title: '物質的熱行為', en: 'The Thermal Behavior of Matter',
  blurb: '理想氣體、分子動能、相變與熱膨脹。' }, [
  { id: 'f17-1', name: '理想氣體定律',
    tex: R`@{p}{p}\,@{V}{V} = @{n}{n}\,@{R}{R}\,@{T}{T} = @{N}{N}\,@{k}{k}\,T`,
    sym: [['p', R`p`, '壓力', 'Pa', ''], ['V', R`V`, '體積', 'm³', '1 L = 10⁻³ m³'], ['n', R`n`, '莫耳數', 'mol', ''],
          ['R', R`R`, '氣體常數', 'J/(mol·K)', '8.314'], ['T', R`T`, '絕對溫度', 'K', ''], ['N', R`N`, '分子數', '', ''], ['k', R`k`, '波茲曼常數', 'J/K', '1.38 × 10⁻²³']],
    idea: '稀薄氣體不論成分，壓力、體積、溫度、數量都由這一條關係連在一起。',
    derive: [R`波以耳、查理、給呂薩克等實驗定律合併。`, R`$R = N_Ak$，$N = nN_A$，所以 $nR = Nk$。`],
    links: ['f17-2', 'f18-2', 'f18-4', 'f16-1'], sim: 'gas',
    ex: [{ ref: '例題 17.1 標準溫壓', q: R`1.00 mol 理想氣體在 0°C、1 atm（101.3 kPa）時的體積？`,
           a: R`$V = \dfrac{nRT}p = \dfrac{(1.00)(8.314)(273.2)}{101.3\times10^3} \approx 22.4\ \text{L}$。` }] },
  { id: 'f17-2', name: '分子平均動能',
    tex: R`\overline{@{K}{K}} = \tfrac32\,@{k}{k}\,@{T}{T}`,
    sym: [['K', R`\overline K`, '分子平均平移動能', 'J', ''], ['k', R`k`, '波茲曼常數', 'J/K', ''], ['T', R`T`, '絕對溫度', 'K', '']],
    idea: '溫度就是分子平均平移動能的量度，和分子種類無關。',
    derive: [R`動力論：分子撞牆產生壓力，得 $pV = \tfrac23N\overline K$。`, R`與 $pV = NkT$ 比較，得 $\overline K = \tfrac32kT$。`],
    links: ['f17-1', 'f17-3', 'f18-5', 'f6-4'] },
  { id: 'f17-3', name: '方均根速率',
    tex: R`@{v}{v_{rms}} = \sqrt{\frac{3\,@{k}{k}\,@{T}{T}}{@{m}{m}}}`,
    sym: [['v', R`v_{rms}`, '方均根速率', 'm/s', ''], ['k', R`k`, '波茲曼常數', 'J/K', ''], ['T', R`T`, '絕對溫度', 'K', ''], ['m', R`m`, '一個分子的質量', 'kg', '1 u = 1.66 × 10⁻²⁷ kg']],
    idea: '同溫度下，輕的分子跑得快：氫分子比氧分子快 4 倍。',
    derive: [R`$\tfrac12 m\overline{v^2} = \tfrac32 kT$。`, R`$v_{rms} = \sqrt{\overline{v^2}} = \sqrt{3kT/m}$。`],
    links: ['f17-2'], sim: 'gas',
    ex: [{ ref: '例題 17.2 空氣分子', q: R`室溫 20°C 時，氮分子（28 u）的方均根速率？`,
           a: R`$\overline K = \tfrac32(1.38\times10^{-23})(293) \approx 6.07\times10^{-21}\ \text{J}$，$m = 28(1.66\times10^{-27})\ \text{kg}$，$v_{rms} = \sqrt{2\overline K/m} \approx 511\ \text{m/s}$。` }] },
  { id: 'f17-4', name: '潛熱',
    tex: R`@{Q}{Q} = @{L}{L}\,@{m}{m}`,
    sym: [['Q', R`Q`, '相變需要的熱', 'J', ''], ['L', R`L`, '潛熱', 'J/kg', '水：熔化 334 kJ/kg、汽化 2257 kJ/kg'], ['m', R`m`, '質量', 'kg', '']],
    idea: '相變時一直吸熱但溫度不變，能量用來拆開分子之間的鍵結。',
    derive: [R`潛熱是每公斤物質完成相變所需的熱。`, R`加熱曲線上，相變那一段是水平線。`],

/* ---------- Ch18（補充） ---------- */
chapter({ id: 18, exam: 3, title: '熱力學第一定律', en: 'Heat, Work, and the First Law of Thermodynamics', supplement: true,
  blurb: '吸收的熱 = 內能增加 + 對外做功；四種典型過程畫在 p–V 圖上。' }, [
  { id: 'f18-1', name: '熱力學第一定律',
    tex: R`\Delta @{E}{E_{int}} = @{Q}{Q} - @{W}{W}`,
    sym: [['E', R`\Delta E_{int}`, '內能變化', 'J', '只與起點、終點狀態有關'], ['Q', R`Q`, '系統吸收的熱', 'J', '放熱為負'], ['W', R`W`, '系統對外做的功', 'J', '被壓縮時為負']],
    idea: '能量守恆的熱力學版本：吸收的熱，一部分讓內能增加，一部分拿去對外做功。',
    derive: [R`內能是狀態函數；$Q$ 與 $W$ 都和過程路徑有關。`, R`實驗發現 $Q - W$ 只和起點、終點有關，等於內能變化。`],
    links: ['f7-5', 'f16-2', 'f18-2', 'f19-1'],
    ex: [{ ref: '補充示範', q: R`氣體吸收 500 J 的熱，同時對外做了 200 J 的功。內能變化多少？`, a: R`$\Delta E_{int} = Q - W = 500 - 200 = 300\ \text{J}$。` }] },
  { id: 'f18-2', name: '氣體做的功',
    tex: R`@{W}{W} = \int_{@{V1}{V_1}}^{@{V2}{V_2}} @{p}{p}\,d@{V}{V}`,
    sym: [['W', R`W`, '氣體對外做的功', 'J', ''], ['V1', R`V_1`, '初體積', 'm³', ''], ['V2', R`V_2`, '末體積', 'm³', ''], ['p', R`p`, '壓力', 'Pa', ''], ['V', R`V`, '體積', 'm³', '']],
    idea: '氣體做的功就是 p–V 圖曲線下的面積，所以不同路徑的功不同。',
    derive: [R`活塞面積 $A$，移動 $dx$：$dW = F\,dx = pA\,dx = p\,dV$。`, R`積分得 $W = \int p\,dV$；膨脹為正、壓縮為負。`],
    links: ['f6-2', 'f18-1', 'f18-3', 'f18-4'], sim: 'pv' },
  { id: 'f18-3', name: '等壓過程',
    tex: R`@{W}{W} = @{p}{p}\,\Delta@{V}{V},\qquad @{Q}{Q} = @{n}{n}\,@{CP}{C_P}\,\Delta@{T}{T}`,
    sym: [['W', R`W`, '功', 'J', ''], ['p', R`p`, '固定的壓力', 'Pa', ''], ['V', R`\Delta V`, '體積變化', 'm³', ''],
          ['Q', R`Q`, '吸熱', 'J', ''], ['n', R`n`, '莫耳數', 'mol', ''], ['CP', R`C_P`, '定壓莫耳比熱', 'J/(mol·K)', ''], ['T', R`\Delta T`, '溫度變化', 'K', '']],
    idea: '壓力固定，p–V 圖上是一條水平線，功就是長方形面積。',
    derive: [R`$W = \int p\,dV = p(V_2 - V_1)$。`, R`吸熱 $Q = nC_P\Delta T$，其中一部分做功、一部分變內能。`],
    links: ['f18-2', 'f18-7'], sim: 'pv',
    ex: [{ ref: '補充示範', q: R`氣體在 1.0 atm 下從 1.0 L 膨脹到 3.0 L，對外做多少功？`, a: R`$W = p\Delta V = (101.3\times10^3)(2.0\times10^{-3}) \approx 203\ \text{J}$。` }] },
  { id: 'f18-4', name: '等溫過程',
    tex: R`@{W}{W} = @{n}{n}\,@{R}{R}\,@{T}{T}\ln\frac{@{V2}{V_2}}{@{V1}{V_1}},\qquad Q = W`,
    sym: [['W', R`W`, '功', 'J', ''], ['n', R`n`, '莫耳數', 'mol', ''], ['R', R`R`, '氣體常數', 'J/(mol·K)', ''], ['T', R`T`, '固定溫度', 'K', ''],
          ['V1', R`V_1`, '初體積', 'm³', ''], ['V2', R`V_2`, '末體積', 'm³', '']],
    idea: '理想氣體的內能只看溫度，等溫時 ΔE_int = 0，吸收的熱全部拿去做功。',
    derive: [R`等溫：$p = nRT/V$。`, R`$W = \int_{V_1}^{V_2}\dfrac{nRT}V\,dV = nRT\ln\dfrac{V_2}{V_1}$。`, R`$\Delta E_{int} = 0$，所以 $Q = W$。`],
    links: ['f17-1', 'f18-2', 'f19-2'], sim: 'pv' },
  { id: 'f18-5', name: '等容過程',
    tex: R`@{W}{W} = 0,\qquad @{Q}{Q} = \Delta E_{int} = @{n}{n}\,@{CV}{C_V}\,\Delta@{T}{T}`,
    sym: [['W', R`W`, '功', 'J', '體積不變所以為零'], ['Q', R`Q`, '吸熱', 'J', ''], ['n', R`n`, '莫耳數', 'mol', ''], ['CV', R`C_V`, '定容莫耳比熱', 'J/(mol·K)', '單原子 3R/2'], ['T', R`\Delta T`, '溫度變化', 'K', '']],
    idea: '體積不變就不做功，吸收的熱全部變成內能；理想氣體任何過程都有 ΔE_int = nC_VΔT。',
    derive: [R`$dV = 0$，所以 $W = 0$，第一定律 $Q = \Delta E_{int}$。`, R`內能只看溫度，所以任何過程的 $\Delta E_{int}$ 都可以用 $nC_V\Delta T$ 算。`],
    links: ['f18-1', 'f18-7', 'f17-2'], sim: 'pv' },
  { id: 'f18-6', name: '絕熱過程',
    tex: R`@{p}{p}\,@{V}{V}^{@{g}{\gamma}} = \text{常數},\qquad @{T}{T}\,V^{\gamma - 1} = \text{常數}`,
    sym: [['p', R`p`, '壓力', 'Pa', ''], ['V', R`V`, '體積', 'm³', ''], ['g', R`\gamma`, '比熱比', '', '單原子 5/3、雙原子 7/5'], ['T', R`T`, '絕對溫度', 'K', '']],
    idea: '沒有熱交換（過程很快或隔熱），壓縮時外界做的功全部變成內能，溫度上升——柴油引擎就是這樣點火。',
    derive: [R`$Q = 0$：$nC_V\,dT = -p\,dV$。`, R`用 $pV = nRT$ 消去 $p$：$\dfrac{dT}T = -\dfrac R{C_V}\dfrac{dV}V = -(\gamma - 1)\dfrac{dV}V$。`, R`積分得 $TV^{\gamma-1}$ 為常數，再代入 $T \propto pV$ 得 $pV^\gamma$ 為常數。`],
    links: ['f18-1', 'f18-7', 'f19-2'], sim: 'pv' },
  { id: 'f18-7', name: '理想氣體的莫耳比熱',
    tex: R`@{CP}{C_P} = @{CV}{C_V} + @{R}{R},\qquad @{g}{\gamma} = \frac{C_P}{C_V}`,
    sym: [['CP', R`C_P`, '定壓莫耳比熱', 'J/(mol·K)', ''], ['CV', R`C_V`, '定容莫耳比熱', 'J/(mol·K)', ''], ['R', R`R`, '氣體常數', 'J/(mol·K)', ''], ['g', R`\gamma`, '比熱比', '', '']],
    idea: '定壓加熱時氣體還要對外做功，所以比定容多需要 R 的熱。單原子 C_V = 3R/2、雙原子 5R/2。',
    derive: [R`升溫 $\Delta T$ 時，兩種過程的 $\Delta E_{int}$ 相同，都是 $nC_V\Delta T$。`, R`定壓多做功 $p\Delta V = nR\Delta T$。`, R`$nC_P\Delta T = nC_V\Delta T + nR\Delta T$。`],
    links: ['f18-3', 'f18-5', 'f17-2'] }
], [
  { id: 'p18-1', ref: '補充題（第 18 章等溫過程）', f: ['f18-4'],
    q: R`2.00 mol 理想氣體在 300 K 下等溫膨脹，體積從 10.0 L 變成 30.0 L。氣體吸收多少熱？`,
    unit: 'J', ans: 5480,
    hints: [R`等溫時 $\Delta E_{int} = 0$，所以 $Q = W$。`, R`$W = nRT\ln(V_2/V_1)$，體積比是 3。`],
    sol: R`$Q = W = (2.00)(8.314)(300)\ln3 \approx 5.48\times10^3\ \text{J}$。`,
    sim: { id: 'pv', preset: { proc: 'iso', V1: 10, V2: 30, n: 2, T1: 300 } } },
  { id: 'p18-2', ref: '補充題（第 18 章等容過程）', f: ['f18-5', 'f18-7'],
    q: R`1.00 mol 單原子理想氣體在體積不變下，從 300 K 加熱到 400 K。需要多少熱？`,
    unit: 'J', ans: 1247.1,
    hints: [R`等容：$Q = nC_V\Delta T$。`, R`單原子 $C_V = \tfrac32R$。`],
    sol: R`$Q = (1.00)\left(\tfrac32\right)(8.314)(100) \approx 1.25\times10^3\ \text{J}$。` },
  { id: 'p18-3', ref: '補充題（第 18 章絕熱過程）', f: ['f18-6'],
    q: R`柴油引擎把 300 K 的空氣（γ = 1.40）絕熱壓縮到原來體積的 1/10。壓縮後溫度是多少 K？`,
    unit: 'K', ans: 753.6,
    hints: [R`用 $TV^{\gamma-1}$ 為常數。`, R`$T_2 = T_1\left(\dfrac{V_1}{V_2}\right)^{\gamma - 1} = 300 \times 10^{0.4}$。`],
    sol: R`$T_2 = 300 \times 10^{0.40} \approx 754\ \text{K}$（約 480°C），高到可以讓噴入的柴油自燃。`,

]);

/* ---------- Ch19（補充） ---------- */
chapter({ id: 19, exam: 3, title: '熱力學第二定律', en: 'The Second Law of Thermodynamics', supplement: true,
  blurb: '熱機不可能把熱全部變成功；卡諾效率是上限，總熵只增不減。' }, [
  { id: 'f19-1', name: '熱機效率',
    tex: R`@{e}{e} = \frac{@{W}{W}}{@{Qh}{Q_h}} = 1 - \frac{@{Qc}{Q_c}}{Q_h}`,
    sym: [['e', R`e`, '效率', '0–1', ''], ['W', R`W`, '每循環做的功', 'J', ''], ['Qh', R`Q_h`, '從高溫熱庫吸的熱', 'J', ''], ['Qc', R`Q_c`, '排到低溫熱庫的熱', 'J', '']],
    idea: '熱機從高溫吸熱、做功，而且一定要排一部分熱到低溫，所以效率不可能是 100%。',
    derive: [R`循環回到原狀態，$\Delta E_{int} = 0$。`, R`第一定律：$W = Q_h - Q_c$。`, R`$e = W/Q_h = 1 - Q_c/Q_h$。`],
    links: ['f19-2', 'f18-1'], sim: 'carnot',
    ex: [{ ref: '補充示範', q: R`熱機每循環吸熱 2000 J、排熱 1500 J。效率？`, a: R`$W = 500\ \text{J}$，$e = 500/2000 = 25\%$。` }] },
  { id: 'f19-2', name: '卡諾效率（最大效率）',
    tex: R`@{e}{e_{max}} = 1 - \frac{@{Tc}{T_c}}{@{Th}{T_h}}`,
    sym: [['e', R`e_{max}`, '卡諾效率', '0–1', ''], ['Tc', R`T_c`, '低溫熱庫溫度', 'K', ''], ['Th', R`T_h`, '高溫熱庫溫度', 'K', '']],
    idea: '在兩個溫度之間運作的熱機，可逆的卡諾熱機效率最高；溫差越大越好，溫度一定要用 K。',
    derive: [R`卡諾循環：兩段等溫加兩段絕熱。`, R`等溫段 $Q_h = nRT_h\ln\dfrac{V_b}{V_a}$、$Q_c = nRT_c\ln\dfrac{V_c}{V_d}$。`, R`絕熱段給出 $V_b/V_a = V_c/V_d$，所以 $Q_c/Q_h = T_c/T_h$。`],
    links: ['f19-1', 'f18-4', 'f18-6'], sim: 'carnot',
    ex: [{ ref: '補充示範', q: R`發電廠蒸汽 800 K、冷卻水 300 K，最大可能效率？`, a: R`$e_{max} = 1 - 300/800 = 62.5\%$；實際電廠約 35–45%。` }] },
  { id: 'f19-3', name: '冷凍機的性能係數',
    tex: R`\text{COP} = \frac{@{Qc}{Q_c}}{@{W}{W}} \le \frac{@{Tc}{T_c}}{@{Th}{T_h} - T_c}`,
    sym: [['Qc', R`Q_c`, '從低溫處移走的熱', 'J', ''], ['W', R`W`, '輸入的功', 'J', ''], ['Tc', R`T_c`, '冰箱內溫度', 'K', ''], ['Th', R`T_h`, '室溫', 'K', '']],
    idea: '冷凍機用功把熱從低溫搬到高溫；COP 可以大於 1，內外溫差越小越省電。',
    derive: [R`$W = Q_h - Q_c$。`, R`可逆時 $Q_h/Q_c = T_h/T_c$，代入得 $\text{COP}_{max} = \dfrac{T_c}{T_h - T_c}$。`],
    links: ['f19-1', 'f19-4'] },
  { id: 'f19-4', name: '熱泵的性能係數',
    tex: R`\text{COP}_{hp} = \frac{@{Qh}{Q_h}}{@{W}{W}} \le \frac{@{Th}{T_h}}{T_h - @{Tc}{T_c}}`,
    sym: [['Qh', R`Q_h`, '送進室內的熱', 'J', ''], ['W', R`W`, '輸入的功', 'J', ''], ['Th', R`T_h`, '室內溫度', 'K', ''], ['Tc', R`T_c`, '室外溫度', 'K', '']],
    idea: '熱泵送進室內的熱 = 做的功 + 從室外搬來的熱，所以比直接用電熱器省電。',
    derive: [R`$Q_h = W + Q_c$。`, R`可逆時 $\text{COP}_{hp} = \dfrac{T_h}{T_h - T_c}$。`],
    links: ['f19-3'] },
  { id: 'f19-5', name: '熵變',
    tex: R`\Delta @{S}{S} = \int \frac{d@{Q}{Q}}{@{T}{T}}\qquad\left(\text{等溫：}\ \Delta S = \frac{Q}{T}\right)`,
    sym: [['S', R`\Delta S`, '熵變', 'J/K', '狀態函數'], ['Q', R`dQ`, '可逆路徑上吸收的熱', 'J', ''], ['T', R`T`, '絕對溫度', 'K', '']],
    idea: '熵是狀態函數；計算時找一條連接起終點的可逆路徑，把每一小段 dQ/T 加起來。',
    derive: [R`可逆過程定義 $dS = dQ/T$。`, R`等溫時 $T$ 是常數：$\Delta S = Q/T$。`, R`理想氣體等溫膨脹：$\Delta S = nR\ln(V_2/V_1)$。`],
    links: ['f19-6', 'f17-4'],
    ex: [{ ref: '補充示範', q: R`1.00 mol 理想氣體等溫膨脹到兩倍體積，熵變？`, a: R`$\Delta S = nR\ln2 = (1.00)(8.314)(0.693) \approx 5.76\ \text{J/K}$。` }] },
  { id: 'f19-6', name: '熵增原理（第二定律）',
    tex: R`\Delta @{S}{S_{total}} \ge 0`,
    sym: [['S', R`\Delta S_{total}`, '孤立系統的總熵變', 'J/K', '可逆時 = 0']],
    idea: '孤立系統的總熵不會減少；熱自動由高溫流向低溫，就是因為這樣總熵會增加。',
    derive: [R`熱 $Q$ 從 $T_h$ 流到 $T_c$：$\Delta S = -\dfrac Q{T_h} + \dfrac Q{T_c}$。`, R`$T_h > T_c$ 時 $\Delta S > 0$；反方向會讓熵減少，所以不會自動發生。`],
    links: ['f19-5', 'f19-2'],
    ex: [{ ref: '補充示範', q: R`1000 J 的熱從 400 K 傳到 300 K，總熵變？`, a: R`$\Delta S = -\dfrac{1000}{400} + \dfrac{1000}{300} \approx 0.83\ \text{J/K} > 0$。` }] }
], [
  { id: 'p19-1', ref: '補充題（第 19 章熱機效率）', f: ['f19-1', 'f19-2'],

const DEFS = {
  /* Ch5 */
  'f5-1': R`[[force|合力]] 的定義是作用在物體上所有力的向量和。牛頓第二定律說：合力等於物體的[[mass]] $m$ 乘上它的[[acc]] $\vec a$。寫成分量時，x、y 方向各自成立，例如 x 方向所有力的分量加起來等於 $m a_x$。力的單位是牛頓 N，1 N = 1 kg·m/s²，也就是讓 1 kg 的物體產生 1 m/s² 加速度的力。`,
  'f5-2': R`物體沿傾角 $\theta$ 的無摩擦斜面滑動時，沿斜面的[[acc]] $a$ 等於[[g]]乘上 $\sin\theta$，單位 m/s²；斜面給的[[normal]] $n$ 等於物體重量 $mg$ 乘上 $\cos\theta$，單位 N。兩者都是把重力拆成沿斜面、垂直斜面兩個分量，再套用[[@f5-1]]得到的。`,
  'f5-3': R`靜摩擦力 $f_s$ 是兩個接觸面還沒有相對滑動時，沿接觸面阻止滑動的力，單位 N。它的大小會配合外力改變，但最大不會超過靜[[mu|摩擦係數]] $\mu_s$（無單位）乘上[[normal]] $n$；超過就開始滑動。`,
  'f5-4': R`動摩擦力 $f_k$ 是兩個接觸面已經相對滑動時，接觸面施加、方向與滑動方向相反的力，單位 N。它等於動[[mu|摩擦係數]] $\mu_k$（無單位）乘上[[normal]] $n$，大小和滑動速度無關。`,
  'f5-5': R`物體以速率 $v$ 沿半徑 $r$ 的圓等速運動時，速度方向一直在變，產生指向圓心、大小 $v^2/r$ 的[[acent]]（m/s²）。依[[@f5-1]]，指向圓心的合力 $\sum F_r$ 必須等於[[mass]] $m$ 乘上 $v^2/r$，單位 N。這個合力稱為向心力，由張力、重力、摩擦力等真實的力提供。`,
  'f5-6': R`彎道路面傾斜 $\theta$（°）時，車子以速率 $v$（m/s）在半徑 $r$（m）的彎道上不靠摩擦轉彎，需要 $\tan\theta = v^2/(rg)$。原因是[[normal]]的水平分量剛好提供[[acent|向心力]]，垂直分量撐住重量 $mg$。`,
  /* Ch6 */
  'f6-1': R`[[work]] $W$ 的定義是定力 $\vec F$ 與物體[[disp]] $\Delta\vec r$ 的內積，等於力的大小 × 位移大小 × 兩者夾角 $\theta$ 的餘弦。單位是焦耳 J，1 J = 1 N·m，也就是 1 N 的力沿力的方向推動物體 1 m 所做的功。功是純量，夾角超過 90° 時為負。`,
  'f6-2': R`當[[force|力]]隨位置 $x$ 改變時，物體從 $x_1$ 移到 $x_2$ 所受的[[work]]定義為 $F(x)$ 對 $x$ 的積分，也就是 F–x 圖曲線下的面積，單位 J。它是[[@f6-1]]的推廣：把路徑切成很多小段，每段當作定力再加總。`,
  'f6-3': R`把[[k]] $k$（N/m）的彈簧從自然長度拉長或壓縮 $x$（m），外力對彈簧做的[[work]]是 $\tfrac12 kx^2$，單位 J。這是把虎克定律 $F = kx$ 代入[[@f6-2]]的結果，也就是 F–x 圖上三角形的面積。`,
  'f6-4': R`[[ke]] $K$ 的定義是[[mass]] $m$ 的物體以速率 $v$ 運動時所具有的能量，等於 $\tfrac12 mv^2$，單位 J（= kg·m²/s²）。動能是純量，永遠不會是負的。`,
  'f6-5': R`功能定理：作用在物體上的[[force|合力]]所做的淨[[work]] $W_{net}$，等於物體[[ke]]的變化 $\Delta K = K_2 - K_1$，單位都是 J。淨功為正，物體變快；淨功為負，物體變慢。`,
  'f6-6': R`[[power]] $P$ 的定義是單位時間內做的[[work]]，$P = dW/dt$，單位瓦特 W（1 W = 1 J/s）。力 $\vec F$ 作用在以[[vel|速度]] $\vec v$ 運動的物體上時，功率就是兩者的內積 $\vec F\cdot\vec v$。`,
  /* Ch7 */
  'f7-1': R`[[pe]]的變化 $\Delta U$ 定義為[[cons]]把物體從 A 移到 B 所做[[work]] $W_c$ 的負值，單位 J。只有保守力（例如重力、彈力）才能定義位能；位能的零點可以自己選，只有位能差有意義。`,
  'f7-2': R`地表附近，[[mass]] $m$ 的物體在高度 $y$（相對你選的零點）時的重力[[pe]]是 $mgy$，單位 J，其中[[g]] $g \approx 9.8$ m/s²。它是把定力 $-mg$ 代入[[@f7-1]]得到的。`,
  'f7-3': R`[[k]] $k$（N/m）的彈簧偏離平衡位置 $x$（m）時，儲存的彈性[[pe]]是 $\tfrac12 kx^2$，單位 J；不論拉長或壓縮都是正的。它和[[@f6-3]]的數值相同，因為拉彈簧做的功全部存成了位能。`,
  'f7-4': R`[[mech]] $E$ 的定義是[[ke]] $K$ 加上[[pe]] $U$，單位 J。當只有[[cons]]做功時，機械能守恆：任意兩個狀態 1、2 的 $K + U$ 都相等。它是把 $W_c = -\Delta U$ 代入[[@f6-5]]得到的。`,
  'f7-5': R`[[noncons]]（例如摩擦力）做的[[work]] $W_{nc}$，等於[[mech]]的變化 $\Delta E = \Delta K + \Delta U$，單位 J。摩擦力的 $W_{nc}$ 是負的，所以機械能減少，少掉的部分變成熱。$W_{nc} = 0$ 時就回到[[@f7-4]]。`,
  'f7-6': R`一維[[cons]] $F_x$ 等於[[pe]] $U(x)$ 對位置 $x$ 的導數再取負號，單位 N（= J/m）。也就是說，力的大小是位能曲線的斜率，方向指向位能降低的那一側。`,
  /* Ch8 */
  'f8-1': R`萬有引力定律：任兩個質量 $m_1$、$m_2$（kg）相距 $r$（m，從質心算）時，彼此吸引的力大小等於[[G]] $G$ 乘上兩質量的乘積，再除以距離的平方，單位 N。`,
  'f8-2': R`[[g]] $g$ 的定義是只受重力時物體的[[acc]]，單位 m/s²（也等於 N/kg）。離質量 $M$ 的星球中心 $r$ 處，$g = GM/r^2$；在地表 $r = R_E$ 時約 9.8 m/s²。它是由[[@f8-1]]令 $mg = GMm/r^2$ 得到的。`,
  'f8-3': R`衛星在半徑 $r$（從星球中心算，m）的圓軌道上運行所需的速率 $v = \sqrt{GM/r}$，單位 m/s，$M$ 是中心天體的質量。這是令萬有引力等於[[acent|向心力]] $mv^2/r$ 得到的。`,
  'f8-4': R`[[period|軌道週期]] $T$（繞一圈的時間，s）的平方，正比於軌道半徑 $r$（橢圓軌道用半長軸，m）的立方，比例常數是 $4\pi^2/(GM)$。由[[@f8-3]]和 $T = 2\pi r/v$ 推得。`,
  'f8-5': R`質量 $m$ 與質量 $M$ 相距 $r$ 時的重力[[pe]]是 $-GMm/r$，單位 J。取兩者相距無限遠時位能為零，所以距離有限時位能都是負的。它是把[[@f8-1]]代入[[@f7-1]]積分得到的。`,
  'f8-6': R`脫離速度 $v_{esc}$ 是物體從離中心 $R$ 處出發、不再推進就能飛到無限遠所需的最小速率，單位 m/s。它來自[[mech]]守恆：$\tfrac12 mv^2 - GMm/R = 0$。地表約 11.2 km/s。`,
  /* Ch9 */
  'f9-1': R`[[cm]] $\vec r_{cm}$ 的定義是系統中各質點位置以質量為權重的平均，單位 m：每個位置 $\vec r_i$ 乘上質量 $m_i$ 加總後，再除以總質量 $M$。`,
  'f9-2': R`系統受到的外力合力 $\vec F_{ext}$（N）等於總質量 $M$（kg）乘上[[cm]]的[[acc]] $\vec a_{cm}$（m/s²）。系統內部的力成對抵消，所以不影響質心的運動。這是[[@f5-1]]用在多質點系統的版本。`,
  'f9-3': R`[[mom]] 的定義是質量乘[[vel|速度]]，$\vec p = m\vec v$，單位 kg·m/s；系統的總動量 $\vec P$ 是每個質點動量的向量和。牛頓第二定律的一般形式是：外力合力等於總動量對時間的變化率 $d\vec P/dt$。`,
  'f9-4': R`系統所受外力合力為零時，總[[mom]] $\sum m_i\vec v_i$ 不會改變：之前（$\vec v_i$）與之後（$\vec v_i'$）的總動量相等，單位 kg·m/s。它是由[[@f9-3]]令 $\vec F_{ext} = 0$ 得到的，而且每個分量各自守恆。`,
  'f9-5': R`完全非彈性碰撞的定義：兩物體碰撞後黏在一起，以共同速度 $v_f$（m/s）運動。由[[@f9-4]]，$v_f$ 等於碰撞前的總[[mom]]除以總質量 $m_1 + m_2$。這種碰撞損失的[[ke]]最多。`,
  'f9-6': R`[[elastic]]的定義是碰撞前後總[[ke]]不變的碰撞。質量 $m_1$、速度 $v_{1i}$ 的物體正面撞上靜止的 $m_2$ 時，同時用[[@f9-4]]和動能守恆，就能解出兩者碰後的速度 $v_{1f}$、$v_{2f}$（m/s）。`,
  /* Ch10 */
  'f10-1': R`[[omega]] $\omega$ 的定義是[[theta]] $\theta$ 對時間的變化率，單位 rad/s。剛體上離轉軸 $r$（m）的點，沿圓周移動的線速率是 $v = \omega r$（m/s）；這裡的 $\theta$ 必須用弧度。`,
  'f10-2': R`[[alpha]] $\alpha$ 固定時，末[[omega]] $\omega$ 的平方等於初角速度 $\omega_0$ 的平方加上 $2\alpha\Delta\theta$。單位：$\omega$ 是 rad/s、$\alpha$ 是 rad/s²、角位移 $\Delta\theta$ 是 rad。它和直線運動的 $v^2 = v_0^2 + 2a\Delta x$ 完全對應。`,
  'f10-3': R`[[torque]] $\tau$ 的定義是力 $F$ 讓物體繞轉軸轉動的效果，等於轉軸到施力點的距離 $r$ 乘上力的大小 $F$，再乘上兩者夾角的正弦 $\sin\theta$，單位 N·m。也可以看成力乘上力臂 $r\sin\theta$。`,
  'f10-4': R`作用在剛體上的合[[torque]] $\tau_{net}$（N·m）等於[[inertia]] $I$（kg·m²）乘上[[alpha]] $\alpha$（rad/s²）。它是[[@f5-1]]的轉動版：力對應力矩、質量對應轉動慣量、加速度對應角加速度。`,
  'f10-5': R`[[inertia]] $I$ 的定義是物體每一部分的質量 $m_i$ 乘上它到轉軸垂直距離 $r_i$ 的平方再加總，連續物體寫成積分，單位 kg·m²。它描述物體「多難轉動」，取決於質量怎麼分布、轉軸在哪裡。`,
  'f10-6': R`[[krot]] $K_{rot}$ 的定義是剛體繞固定軸轉動時，所有部分[[ke]]的總和，等於 $\tfrac12 I\omega^2$，單位 J；$I$ 是[[inertia]]，$\omega$ 是[[omega]]。`,
  'f10-7': R`滾動物體的總[[ke]] $K$ 等於質心的平移動能 $\tfrac12 Mv_{cm}^2$ 加上繞質心的[[krot]] $\tfrac12 I_{cm}\omega^2$，單位 J。不打滑時，質心速率和角速度滿足 $v_{cm} = \omega R$（$R$ 是半徑）。`,
  /* Ch11 */
  'f11-1': R`[[torque]]向量 $\vec\tau$ 的定義是位置向量 $\vec r$ 與力 $\vec F$ 的外積，大小 $rF\sin\theta$，單位 N·m，方向由右手定則決定、沿著轉軸。它是[[@f10-3]]的向量版。`,
  'f11-2': R`質點的[[angmom]] $\vec L$ 的定義是它相對參考點的位置向量 $\vec r$ 與[[mom]] $\vec p$ 的外積，單位 kg·m²/s。做圓周運動時，大小就是 $mrv$。`,
  'f11-3': R`繞對稱軸轉動的剛體，[[angmom]] $L$ 等於[[inertia]] $I$（kg·m²）乘上[[omega]] $\omega$（rad/s），單位 kg·m²/s，方向沿轉軸。`,
  'f11-4': R`外力的合[[torque]] $\vec\tau_{net}$（N·m）等於[[angmom]] $\vec L$ 對時間的變化率。它是 $\vec F = d\vec P/dt$（[[@f9-3]]）的轉動版。`,
  'f11-5': R`沒有外力矩時，系統的[[angmom]]不變：轉動慣量與角速度的乘積前後相等，$I_1\omega_1 = I_2\omega_2$，單位 kg·m²/s。它是由[[@f11-4]]令 $\tau_{net} = 0$ 得到的。`,
  'f11-6': R`陀螺儀受到重力[[torque]] $\tau = Mgr$ 時，自轉軸會在水平面上繞圈，這個繞圈的角速度稱為進動角速度 $\Omega$（rad/s），等於力矩除以自轉的[[angmom]] $L = I\omega$。`,
  /* Ch12 */
  'f12-1': R`[[equil]]的第一個條件：作用在物體上所有外力的向量和為零（單位 N），x、y 分量各自為零。這是[[@f5-1]]在加速度為零時的特例。`,
  'f12-2': R`[[equil]]的第二個條件：所有外力對任意一點的[[torque]]總和為零（單位 N·m），物體就不會開始轉動。`,
  'f12-3': R`[[cg]] $x_{cg}$ 的定義是全部重量的等效作用點，位置是各部分以質量為權重的平均，單位 m。重力場均勻時，重心就是[[cm]]。`,
  'f12-4': R`靠在無摩擦牆上的均勻梯子，和地面夾角 $\theta$ 的正切至少要等於 $1/(2\mu)$ 才不會滑倒，$\mu$ 是地面的靜[[mu|摩擦係數]]（無單位）。它來自[[@f12-1]]與[[@f12-2]]兩個條件聯立。`,
  'f12-5': R`平衡點是[[pe]] $U(x)$ 斜率為零（$dU/dx = 0$，也就是力為零）的位置。若二階導數 $d^2U/dx^2 > 0$（位能的谷底），稍微偏離後力會把物體拉回來，稱為穩定平衡；若小於零（峰頂），則是不穩定平衡。`,
  /* Ch13 */
  'f13-1': R`[[period]] $T$ 的定義是完成一次完整振動所需的時間，單位 s。[[freq]] $f$ 是每秒振動的次數，$f = 1/T$，單位赫茲 Hz（= 1/s）。[[angfreq]] $\omega = 2\pi f$，單位 rad/s。`,
  'f13-2': R`[[shm]]的定義是位移隨時間以餘弦函數變化的運動 $x(t) = A\cos(\omega t + \phi)$：$A$ 是[[amp]]（m），$\omega$ 是[[angfreq]]（rad/s），$\phi$ 是相位常數（rad）。只要回復力和位移成正比（$F = -kx$），就會產生簡諧運動。`,
  'f13-3': R`質量 $m$（kg）接在[[k]] $k$（N/m）的彈簧上做[[shm]]時，[[angfreq]] $\omega = \sqrt{k/m}$（rad/s），[[period]] $T = 2\pi\sqrt{m/k}$（s），和振幅大小無關。`,
  'f13-4': R`擺長 $L$（m）的單擺小角度擺動時近似[[shm]]，[[period]] $T = 2\pi\sqrt{L/g}$（s），和擺錘質量、振幅都無關；$g$ 是[[g]]。`,
  'f13-5': R`繞支點擺動的剛體稱為物理擺，小角度擺動時[[period]] $T = 2\pi\sqrt{I/(mgd)}$（s）；$I$ 是對支點的[[inertia]]，$d$ 是支點到[[cm]]的距離（m）。`,
  'f13-6': R`做[[shm]]的彈簧振子，總能量 $E$ 等於[[ke]] $\tfrac12 mv^2$ 加彈性[[pe]] $\tfrac12 kx^2$，單位 J，而且永遠等於 $\tfrac12 kA^2$（$A$ 是[[amp]]）。`,
  'f13-7': R`受到和速度成正比的阻力 $-bv$ 時，振動的[[amp]]會隨時間以 $e^{-bt/2m}$ 指數衰減，這種運動稱為阻尼振盪；$b$ 是阻尼常數（kg/s），$m$ 是質量（kg）。`,
  /* Ch14 */
  'f14-1': R`[[wavespeed]] $v$ 的定義是波形前進的速率，單位 m/s。它等於[[lambda]] $\lambda$（相鄰兩個波峰的距離，m）乘上[[freq]] $f$（Hz），也等於 $\lambda/T$。`,
  'f14-2': R`簡諧波描述介質在位置 $x$、時間 $t$ 的位移 $y$（m）：$y = A\cos(kx - \omega t)$。$A$ 是[[amp]]，$k = 2\pi/\lambda$ 是[[wavenum]]（rad/m），$\omega$ 是[[angfreq]]（rad/s）。`,
  'f14-3': R`張力 $F$（N）、[[linden]] $\mu$（kg/m）的弦上，橫波的[[wavespeed]] $v = \sqrt{F/\mu}$，單位 m/s。`,
  'f14-4': R`[[intensity]] $I$ 的定義是單位時間通過單位面積的能量，單位 W/m²。功率 $P$（W）的點波源均勻向四周發射時，距離 $r$ 處的強度是 $P/(4\pi r^2)$。`,
  'f14-5': R`聲強級 $\beta$ 的定義：聲音的[[intensity]] $I$ 除以聽覺閾值 $I_0 = 10^{-12}$ W/m²，取以 10 為底的對數再乘 10，單位分貝 dB。`,
  'f14-6': R`駐波是兩列反向傳播的波疊加後，形成位置固定的節點與腹點的振動。兩端固定（或兩端開口）、長度 $L$ 時，第 $n$ 個諧音的[[lambda]] $\lambda_n = 2L/n$，頻率 $f_n = nv/(2L)$（Hz），$v$ 是[[wavespeed]]。`,
  'f14-7': R`都卜勒效應的定義：波源或觀察者在移動時，觀察者測到的頻率 $f'$ 和波源發出的頻率 $f$ 不同。波源以速率 $u$ 靠近時 $f' = f/(1 - u/v)$，遠離時分母改成 $1 + u/v$；$v$ 是聲音的[[wavespeed]]。`,
  /* Ch32 */
  'f32-1': R`兩個同相波源傳到某一點的[[pathdiff]] $\Delta r$（m）若是[[lambda]]的整數倍 $m\lambda$，兩波同相疊加而加強，稱為建設性干涉；若是 $(m + \tfrac12)\lambda$，兩波互相抵消，稱為破壞性干涉。`,
  'f32-2': R`間距 $d$ 的雙狹縫，在角度 $\theta$ 方向出現亮紋的條件是 $d\sin\theta = m\lambda$；離狹縫 $L$ 的屏幕上，第 $m$ 條亮紋到中央的距離 $y_m \approx m\lambda L/d$（m）。它是把[[pathdiff]] $d\sin\theta$ 代入[[@f32-1]]的結果。`,
  'f32-3': R`繞射光柵是很多條等距（間距 $d$）的狹縫，亮紋條件和雙狹縫相同，$d\sin\theta = m\lambda$，但亮紋更尖銳。解析度 $\lambda/\Delta\lambda$（無單位）等於級數 $m$ 乘上被照到的刻線數 $N$，代表分開兩個相近波長的能力。`,
  'f32-4': R`厚度 $d$、折射率 $n$ 的薄膜，上下表面反射的兩道光光程差是 $2nd$。若只有一次反射有半個波長的相位反轉（例如肥皂膜），當 $2nd = (m + \tfrac12)\lambda$ 時反射光加強，看到亮色。判斷方式來自[[@f32-1]]。`,
  'f32-5': R`寬度 $a$ 的單狹縫，在 $a\sin\theta = m\lambda$（$m = \pm1, \pm2, \dots$）的方向出現暗紋；中央亮紋的寬度是其他亮紋的兩倍。`,
  'f32-6': R`直徑 $D$ 的圓形孔徑（例如望遠鏡的鏡面）能分辨的最小角度 $\theta_{min} = 1.22\lambda/D$（rad），這是繞射造成的極限，和鏡片做得多好無關。`,
  /* Ch15 */
  'f15-1': R`[[rho]] $\rho$ 的定義是單位體積的質量 $m/V$，單位 kg/m³。[[pressure]] $p$ 的定義是垂直作用在單位面積上的力 $F/A$，單位帕斯卡 Pa（= N/m²）；1 atm ≈ 101.3 kPa。`,
  'f15-2': R`[[rho|密度]] $\rho$ 的靜止液體中，深度 $h$（m）處的[[pressure]] $p$ 等於液面上的壓力 $p_0$ 加上 $\rho gh$，單位 Pa。$\rho gh$ 就是上方液柱每單位面積的重量。`,
  'f15-3': R`帕斯卡原理：對封閉液體某處加的[[pressure]]，會不減弱地傳到液體每一處。所以液壓機兩個活塞上的力與面積成正比，$F_1/A_1 = F_2/A_2$，兩邊都是同一個壓力（Pa）。`,
  'f15-4': R`[[buoy]] $F_b$ 的定義是流體對浸在其中的物體向上的合力，單位 N。阿基米德原理說，它等於被排開流體的重量：流體[[rho|密度]] $\rho_f$ × 排開的體積 $V_{sub}$ × [[g]] $g$。`,
  'f15-5': R`不可壓縮的流體穩定流動時，每秒流過任一截面的體積（體積流率，m³/s）都相同：截面積 $A$（m²）乘上流速 $v$（m/s）是常數。`,
  'f15-6': R`白努利方程：沿著同一條流線，[[pressure]] $p$、每單位體積的動能 $\tfrac12\rho v^2$、每單位體積的重力位能 $\rho gy$ 三者之和保持不變，每一項的單位都是 Pa（= J/m³）。它是[[@f7-4]]用在流體上的版本。`,
  'f15-7': R`托里切利定理：液面下深度 $h$（m）的小孔，流出的速率 $v = \sqrt{2gh}$（m/s），和從高度 $h$ 自由落下的速率相同。它是由[[@f15-6]]化簡得到的。`,
  /* Ch16 */
  'f16-1': R`[[temp]]的三種溫標：克氏溫度 $T_K$（K）以絕對零度為 0；攝氏 $T_C$（°C）以水的冰點為 0。兩者的刻度一樣大，只差 273.15。華氏 $T_F$（°F）$= \tfrac95 T_C + 32$。`,
  'f16-2': R`[[heat]] $Q$ 的定義是因為溫差而傳遞的能量，單位 J。[[c]] $c$ 的定義是讓 1 kg 物質升高 1 K 所需的熱量，單位 J/(kg·K)。所以質量 $m$ 的物體溫度改變 $\Delta T$ 時，吸收的熱 $Q = mc\Delta T$。`,
  'f16-3': R`兩個物體接觸、和外界隔熱時，熱從高溫流到低溫，直到溫度相同，這個最後的溫度 $T$ 稱為平衡溫度。因為一方放出的[[heat]]等於另一方吸收的，$T$ 就是以 $mc$ 為權重的兩個初溫平均。用到[[@f16-2]]。`,
  'f16-4': R`[[H]] $H$ 的定義是每秒傳過某截面的熱量，單位 W（J/s）。傳導時，$H$ 等於熱導率 $k$（W/(m·K)）× 截面積 $A$ × 溫度梯度 $dT/dx$；負號表示熱往低溫的方向流。`,
  'f16-5': R`熱阻 $R$ 的定義是材料厚度 $\Delta x$ 除以熱導率 $k$，單位 m²·K/W；$R$ 越大越隔熱。用熱阻表示時，[[H]] $H = A\Delta T/R$。它是[[@f16-4]]改寫而來的。`,
  'f16-6': R`物體表面每秒以電磁波輻射出去的能量（輻射功率 $P$，W）等於放射率 $e$（0–1）× 史蒂芬－波茲曼常數 $\sigma = 5.67\times10^{-8}$ W/(m²·K⁴) × 表面積 $A$ × 絕對[[temp]] $T$ 的四次方。`,
  /* Ch17 */
  'f17-1': R`理想氣體的[[pressure]] $p$（Pa）乘上體積 $V$（m³），等於[[mole]] $n$（mol）× [[R]] $R$ × 絕對[[temp]] $T$（K）；也等於分子數 $N$ × [[kB]] $k$ × $T$。`,
  'f17-2': R`氣體分子的平均平移[[ke]] $\overline K$ 等於 $\tfrac32 kT$，單位 J；$k$ 是[[kB]]，$T$ 是絕對[[temp]]。這就是溫度的微觀意義。`,
  'f17-3': R`方均根速率 $v_{rms}$ 的定義是分子速率平方的平均值再開根號，單位 m/s。由[[@f17-2]]得到 $v_{rms} = \sqrt{3kT/m}$，$m$ 是一個分子的質量（kg）。`,
  'f17-4': R`[[latent]] $L$ 的定義是 1 kg 物質在相變（熔化、汽化等）時吸收或放出的[[heat]]，單位 J/kg。質量 $m$ 的物質完成相變需要 $Q = Lm$，過程中溫度不變。`,
  'f17-5': R`線膨脹係數 $\alpha$ 的定義是溫度每升高 1 K 時長度增加的比例，單位 1/K。長度 $L$ 的物體升溫 $\Delta T$ 時伸長 $\Delta L = \alpha L\Delta T$（m）。`,
  'f17-6': R`體膨脹係數 $\beta$ 的定義是溫度每升高 1 K 時體積增加的比例，單位 1/K。體積 $V$ 升溫 $\Delta T$ 時增加 $\Delta V = \beta V\Delta T$；固體的 $\beta \approx 3\alpha$（見[[@f17-5]]）。`,
  /* Ch18 */
  'f18-1': R`[[eint]] $E_{int}$ 是系統內所有分子能量的總和，單位 J。熱力學第一定律：內能的變化等於系統吸收的[[heat]] $Q$ 減去系統對外做的[[work]] $W$。它是把能量守恆擴大到熱的版本（參考[[@f7-5]]）。`,
  'f18-2': R`氣體體積從 $V_1$ 變到 $V_2$ 時對外做的[[work]]，是[[pressure]] $p$ 對體積 $V$ 的積分，單位 J（= Pa·m³）；在 p–V 圖上就是曲線下的面積。它和[[@f6-2]]是同一個想法。`,
  'f18-3': R`等壓過程的定義是[[pressure]]保持不變的過程。氣體做的[[work]] $W = p\Delta V$（J），吸收的[[heat]] $Q = nC_P\Delta T$，其中 $C_P$ 是定壓[[molarc]]。`,
  'f18-4': R`等溫過程的定義是[[temp]]保持不變的過程。理想氣體從 $V_1$ 變到 $V_2$ 做的[[work]] $W = nRT\ln(V_2/V_1)$（J）；因為[[eint]]不變，吸收的熱 $Q = W$。`,
  'f18-5': R`等容過程的定義是體積保持不變的過程。體積沒變，氣體不做功（$W = 0$），吸收的[[heat]]全部變成[[eint]]：$Q = nC_V\Delta T$，$C_V$ 是定容[[molarc]]。`,
  'f18-6': R`絕熱過程的定義是系統和外界沒有[[heat]]交換（$Q = 0$）的過程。理想氣體絕熱時 $pV^\gamma$ 保持不變，$\gamma$ 是[[gammaratio]]；被壓縮時溫度上升，膨脹時溫度下降。`,
  'f18-7': R`[[molarc]]的定義是 1 mol 物質升高 1 K 所需的熱，單位 J/(mol·K)，分成定容 $C_V$ 與定壓 $C_P$ 兩種。理想氣體 $C_P = C_V + R$（$R$ 是[[R]]），兩者的比值是[[gammaratio]] $\gamma$。`,
  /* Ch19 */
  'f19-1': R`熱機[[eff]] $e$ 的定義是每個循環對外做的[[work]] $W$ 除以從高溫熱源吸收的[[heat]] $Q_h$（無單位，常寫成 %）。因為熱機一定要排出熱 $Q_c$ 到低溫處，$e = 1 - Q_c/Q_h$ 一定小於 1。`,
  'f19-2': R`在高溫 $T_h$、低溫 $T_c$（都用 K）兩個熱源之間運作的熱機，最高可能的[[eff]]是 $1 - T_c/T_h$，由可逆的卡諾循環達到。`,
  'f19-3': R`冷凍機性能係數 COP 的定義是從低溫處移走的熱 $Q_c$ 除以輸入的[[work]] $W$（無單位）。在 $T_c$ 與 $T_h$ 之間運作時，最大值是 $T_c/(T_h - T_c)$。`,
  'f19-4': R`熱泵性能係數 $\text{COP}_{hp}$ 的定義是送進室內的熱 $Q_h$ 除以輸入的[[work]] $W$（無單位），最大值是 $T_h/(T_h - T_c)$。和[[@f19-3]]比較，同一台機器 $\text{COP}_{hp} = \text{COP} + 1$。`,
  'f19-5': R`[[entropy]] $S$ 是系統的狀態函數，單位 J/K。熵變 $\Delta S$ 的定義是沿一條可逆路徑，把每一小段吸收的[[heat]] $dQ$ 除以當時的絕對[[temp]] $T$ 再加總；溫度固定時 $\Delta S = Q/T$。`,
  'f19-6': R`熱力學第二定律（熵的說法）：孤立系統的總[[entropy]]變化 $\Delta S_{total}$ 不會小於零；可逆過程等於零，不可逆過程大於零。`
};

/* ===== 模擬動畫 ===== */
const G9 = 9.8;
const SIMS = {};

/* ---------- 繪圖小工具 ---------- */
const D = {
  font(ctx, size, weight) { ctx.font = `${weight || 400} ${size}px "Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif`; },
  text(ctx, s, x, y, color, size, align, weight) {
    D.font(ctx, size || 12, weight); ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
  },
  arrow(ctx, x1, y1, x2, y2, color, label, lw) {
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
    if (len < 2) return;
    const ux = dx / len, uy = dy / len, hs = Math.min(9, len * 0.45);
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw || 2;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * hs * 0.8, y2 - uy * hs * 0.8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - ux * hs - uy * hs * 0.5, y2 - uy * hs + ux * hs * 0.5);
    ctx.lineTo(x2 - ux * hs + uy * hs * 0.5, y2 - uy * hs - ux * hs * 0.5); ctx.closePath(); ctx.fill();
    if (label) D.text(ctx, label, x2 + ux * 12 + (Math.abs(uy) > 0.7 ? 10 : 0), y2 + uy * 12, color, 12, 'left', 600);
  },
  line(ctx, pts, color, lw, dash) {
    ctx.strokeStyle = color; ctx.lineWidth = lw || 1; ctx.setLineDash(dash || []);
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.setLineDash([]);
  },
  bars(ctx, x, y, h, items, max, C) { // 能量長條：items = [[label, value, color]]
    const bw = 22, gap = 12;
    items.forEach((it, i) => {
      const bx = x + i * (bw + gap), v = Math.max(0, it[1]), bh = max > 0 ? Math.min(1, v / max) * h : 0;
      ctx.fillStyle = C.grid; ctx.fillRect(bx, y - h, bw, h);
      ctx.fillStyle = it[2]; ctx.fillRect(bx, y - bh, bw, bh);
      D.text(ctx, it[0], bx + bw / 2, y + 12, C.muted, 11, 'center');
    });
  },
  fmt(v, d) {
    if (!isFinite(v)) return '—';
    const a = Math.abs(v);
    if (a !== 0 && (a >= 1e5 || a < 1e-3)) { const e = Math.floor(Math.log10(a)); return (v / 10 ** e).toFixed(2) + ' × 10' + sup(e); }
    return v.toFixed(d === undefined ? (a >= 100 ? 0 : a >= 10 ? 1 : 2) : d);
  },
  spring(ctx, x1, y, x2, coils, amp, color) {
    const n = coils * 2, L = x2 - x1;
    ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(x1, y);
    const lead = Math.min(10, L * 0.1);
    ctx.lineTo(x1 + lead, y);
    for (let i = 1; i <= n; i++) ctx.lineTo(x1 + lead + (L - 2 * lead) * (i - 0.5) / n, y + (i % 2 ? -amp : amp));
    ctx.lineTo(x2 - lead, y); ctx.lineTo(x2, y); ctx.stroke();
  }
};
function sup(e) { const m = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' }; return String(e).split('').map(c => m[c]).join(''); }
function F(v, d) { return D.fmt(v, d); }

/* ---------- Ch5 斜面與摩擦 ---------- */
SIMS.incline = {
  title: '斜面上的木塊',
  params: [
    { k: 'th', label: '斜面傾角 θ', min: 0, max: 60, step: 1, val: 30, unit: '°' },
    { k: 'mus', label: '靜摩擦係數 μs', min: 0, max: 1, step: 0.01, val: 0.5 },
    { k: 'muk', label: '動摩擦係數 μk', min: 0, max: 1, step: 0.01, val: 0.3 },
    { k: 'm', label: '質量 m', min: 1, max: 20, step: 0.5, val: 5, unit: 'kg' }],
  reset(s) { s.x = 0; s.v = 0; s.moving = false; s.wait = 0; },
  step(s, p, dt) {
    const th = p.th * Math.PI / 180, sn = Math.sin(th), cs = Math.cos(th), Lm = 4;
    if (!s.moving) {
      if (Math.tan(th) > p.mus + 1e-9) s.moving = true; else { s.a = 0; s.f = G9 * p.m * sn; s.kind = '靜摩擦'; return; }
    }
    s.a = G9 * (sn - p.muk * cs); s.f = p.muk * p.m * G9 * cs; s.kind = '動摩擦';
    s.v += s.a * dt;
    if (s.v <= 0 && s.a <= 0) { s.v = 0; s.moving = Math.tan(th) > p.mus; if (!s.moving) { s.f = p.m * G9 * sn; s.kind = '靜摩擦'; } }
    s.x += s.v * dt;
    if (s.x > Lm) { s.x = Lm; s.wait += dt; if (s.wait > 1) this.reset(s); }
  },
  draw(ctx, W, H, s, p, C) {
    const th = p.th * Math.PI / 180, base = Math.min(W * 0.72, (H - 40) / Math.max(Math.tan(th), 0.35));
    const x0 = 30, y0 = H - 26, x1 = x0 + base, yTop = y0 - base * Math.tan(th);
    ctx.fillStyle = C.panel2; ctx.strokeStyle = C.line; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.lineTo(x0, yTop); ctx.closePath(); ctx.fill(); ctx.stroke();
    D.line(ctx, [[x0 - 10, y0], [W - 10, y0]], C.line, 1);
    // 木塊位置（沿斜面，自頂端起算）
    const slope = Math.hypot(base, base * Math.tan(th)), frac = s.x / 4, d = 26 + frac * (slope - 70);
    const ux = Math.cos(th), uy = Math.sin(th), nx = -uy, ny = -ux; // 沿斜面向下 (ux,uy)，法向朝上 (nx,ny)
    const bx = x0 + ux * d, by = yTop + uy * d, size = 30;
    ctx.save(); ctx.translate(bx + nx * size / 2, by + ny * size / 2); ctx.rotate(th);
    ctx.fillStyle = C.accent; ctx.globalAlpha = 0.85; ctx.fillRect(-size / 2, -size / 2, size, size); ctx.globalAlpha = 1; ctx.restore();
    const cx = bx + nx * size / 2, cy = by + ny * size / 2, sc = 3.2 / Math.max(1, p.m * 0.6) * 1.0, k = 34 / (p.m * G9) * 1.6;
    const mg = p.m * G9, n = mg * Math.cos(th);
    D.arrow(ctx, cx, cy, cx, cy + mg * k, C.ink, 'mg');
    D.arrow(ctx, cx, cy, cx + nx * n * k, cy + ny * n * k, C.cool, 'n');
    if (s.f > 0.01) D.arrow(ctx, cx, cy, cx - ux * s.f * k, cy - uy * s.f * k, C.warm, 'f');
    D.text(ctx, `θ = ${p.th}°`, x1 - 60, y0 - 12, C.muted, 12);
    D.text(ctx, s.moving ? '滑動中' : '靜止（靜摩擦撐住）', W - 14, 18, s.moving ? C.warm : C.ok, 13, 'right', 600);
  },
  readout(s, p) {
    const th = p.th * Math.PI / 180, mg = p.m * G9;
    return [['正向力 n = mg cosθ', F(mg * Math.cos(th)) + ' N'], ['沿斜面重力 mg sinθ', F(mg * Math.sin(th)) + ' N'],
      ['摩擦力 f（' + (s.kind || '靜摩擦') + '）', F(s.f || 0) + ' N'], ['加速度 a', F(s.moving ? Math.max(s.a, 0) : 0) + ' m/s²'],
      ['臨界角 tan⁻¹ μs', F(Math.atan(p.mus) * 180 / Math.PI, 1) + '°']];
  }
};

/* ---------- Ch6 F–x 圖 ---------- */
SIMS.fxarea = {
  title: 'F–x 圖下的面積',
  params: [
    { k: 'k', label: '彈力常數 k', min: 50, max: 500, step: 10, val: 250, unit: 'N/m' },
    { k: 'from', label: '起點 x₁', min: 0, max: 12, step: 0.5, val: 0, unit: 'm' },
    { k: 'x', label: '終點 x₂', min: 0, max: 12, step: 0.5, val: 6, unit: 'm' }],
  reset() {}, step(s, p, dt) { s.t = (s.t || 0) + dt; },
  draw(ctx, W, H, s, p, C) {
    const x1 = Math.min(p.from, p.x), x2 = Math.max(p.from, p.x);
    const L = 46, B = H - 30, T = 52, Rr = W - 20, Xmax = 12, Fmax = p.k * Xmax;
    const X = x => L + (x / Xmax) * (Rr - L), Y = f => B - (f / Fmax) * (B - T);
    // 彈簧示意
    const sy = 22, wallX = 14, endX = 60 + (x2 / Xmax) * (W - 130);
    ctx.fillStyle = C.line; ctx.fillRect(wallX, sy - 12, 4, 24);
    D.spring(ctx, wallX + 4, sy, endX, 10, 6, C.muted);
    ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(endX + 6, sy, 6, 0, 7); ctx.fill();
    D.arrow(ctx, endX + 12, sy, endX + 40, sy, C.warm, 'F = kx');
    // 軸
    D.line(ctx, [[L, T - 6], [L, B], [Rr, B]], C.line, 1);
    for (let x = 0; x <= Xmax; x += 2) { D.line(ctx, [[X(x), B], [X(x), B + 4]], C.line, 1); D.text(ctx, String(x), X(x), B + 13, C.muted, 10, 'center'); }
    D.text(ctx, 'x (m)', Rr, B - 10, C.muted, 11, 'right'); D.text(ctx, 'F (N)', L + 6, T - 2, C.muted, 11);
    D.text(ctx, F(Fmax, 0), L - 4, T, C.muted, 10, 'right');
    // 面積
    ctx.fillStyle = C.accent; ctx.globalAlpha = 0.28;
    ctx.beginPath(); ctx.moveTo(X(x1), B); ctx.lineTo(X(x1), Y(p.k * x1)); ctx.lineTo(X(x2), Y(p.k * x2)); ctx.lineTo(X(x2), B); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
    D.line(ctx, [[X(0), Y(0)], [X(Xmax), Y(Fmax)]], C.accent, 2);
    const W12 = 0.5 * p.k * (x2 * x2 - x1 * x1);
    D.text(ctx, `面積 = W = ${F(W12)} J`, X((x1 + x2) / 2), B - 14, C.ink, 12, 'center', 600);
  },
  readout(s, p) {
    const x1 = Math.min(p.from, p.x), x2 = Math.max(p.from, p.x);
    return [['力 F(x₂) = kx₂', F(p.k * x2) + ' N'], ['功 W = ½k(x₂² − x₁²)', F(0.5 * p.k * (x2 * x2 - x1 * x1)) + ' J'], ['從 0 拉到 x₂ 的功', F(0.5 * p.k * x2 * x2) + ' J']];
  }
};

/* ---------- Ch7 雲霄飛車 ---------- */
const COASTER = [[0, 12], [12, 12], [28, 2], [50, 20], [72, 4], [92, 9], [108, 3], [120, 3]];
function coasterY(x) {
  for (let i = 0; i < COASTER.length - 1; i++) {
    const [xa, ya] = COASTER[i], [xb, yb] = COASTER[i + 1];
    if (x <= xb) { const t = (x - xa) / (xb - xa); return ya + (yb - ya) * (1 - Math.cos(Math.PI * t)) / 2; }
  }
  return COASTER[COASTER.length - 1][1];
}
SIMS.coaster = {
  title: '雲霄飛車的能量',
  params: [
    { k: 'v0', label: 'A 點初速 v₀', min: 0, max: 20, step: 0.1, val: 10, unit: 'm/s', reset: true },
    { k: 'mu', label: '摩擦（等效係數）μ', min: 0, max: 0.08, step: 0.002, val: 0, reset: true },
    { k: 'm', label: '車重 m', min: 100, max: 1000, step: 50, val: 500, unit: 'kg', reset: true }],
  reset(s, p) { s.x = 6; s.v = p.v0; s.dir = 1; s.Eth = 0; s.maxX = 6; s.msg = p.v0 < 0.01 ? '平台上靜止不動' : ''; s.done = 0; s.T = 0; },
  step(s, p, dt) {
    if (s.done) { s.done += dt; if (s.done > 1.8) this.reset(s, p); return; }
    s.T += dt; if (s.T > 30) { s.done = 0.01; s.msg = '摩擦耗盡能量，停在谷底'; return; }
    const sub = 40, h = dt * 1.6 / sub;
    for (let i = 0; i < sub; i++) {
      const y0 = coasterY(s.x), slope = (coasterY(s.x + 0.05) - coasterY(s.x - 0.05)) / 0.1;
      if (s.v < 1e-4) { if (Math.abs(slope) < 1e-3) return; s.dir = slope > 0 ? -1 : 1; }
      const dx = s.dir * Math.max(s.v, 0.3) * h, ds = Math.abs(dx);
      const x1 = s.x + dx, y1 = coasterY(x1), dy = y1 - y0, seg = Math.hypot(ds, dy); if (seg <= 0) continue; const cosA = ds / seg;
      const loss = p.mu * G9 * cosA * seg;
      const v2 = s.v * s.v - 2 * G9 * dy - 2 * loss;
      if (v2 < 0) { s.dir *= -1; s.v = 0; s.msg = `在 x ≈ ${F(s.x, 0)} m 折返`; continue; }
      s.Eth += p.m * loss; s.v = Math.sqrt(v2); s.x = x1;
      s.maxX = Math.max(s.maxX, s.x);
      if (s.x >= 118 || s.x <= 0.5) { s.done = 0.01; s.msg = s.x >= 118 ? '衝過終點' : '退回起點'; break; }
    }
  },
  draw(ctx, W, H, s, p, C) {
    const L = 14, Rr = W - 130, B = H - 24, T = 26, X = x => L + x / 120 * (Rr - L), Y = y => B - y / 22 * (B - T);
    ctx.beginPath(); ctx.moveTo(X(0), B);
    for (let x = 0; x <= 120; x += 1) ctx.lineTo(X(x), Y(coasterY(x)));
    ctx.lineTo(X(120), B); ctx.closePath(); ctx.fillStyle = C.panel2; ctx.fill();
    const pts = []; for (let x = 0; x <= 120; x += 1) pts.push([X(x), Y(coasterY(x))]);
    D.line(ctx, pts, C.line, 2);
