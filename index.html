function fmtAns(v) { const a = Math.abs(v); if (a >= 1e5 || (a > 0 && a < 1e-3)) { const e = Math.floor(Math.log10(a)); return (v / 10 ** e).toFixed(2) + ' × 10' + sup(e); } return Number(v.toPrecision(4)).toString(); }
function bindProblem(li, p, c) {
  const fb = li.querySelector('.feedback'), input = li.querySelector('input'), hints = li.querySelector('.hints'), hb = li.querySelector('.hint-btn'), sol = li.querySelector('.solution');
  let shown = 0;
  li.querySelector('form').addEventListener('submit', e => {
    e.preventDefault(); const v = parseAnswer(input.value);
    if (isNaN(v)) { fb.className = 'feedback warn'; fb.textContent = '請輸入一個數字，例如 12.3 或 3.2e7。'; return; }
    const st = PROG.solved[p.id] || { tries: 0, ok: false }; st.tries++;
    const rel = (v - p.ans) / Math.abs(p.ans), tol = p.tol || 0.02;
    if (Math.abs(rel) <= tol) {
      st.ok = true; fb.className = 'feedback good'; fb.textContent = `答對了！正確值約 ${fmtAns(p.ans)} ${p.unit}${Math.abs(rel) > 0.001 ? `，你的誤差 ${(Math.abs(rel) * 100).toFixed(1)}%` : ''}。`;
      li.classList.add('ok'); li.querySelector('.badge').textContent = '已答對'; sol.hidden = false;
    } else {
      const ratio = v / p.ans, k = Math.round(Math.log10(Math.abs(ratio)));
      let msg = rel > 0 ? '還不對，你的答案偏大。' : '還不對，你的答案偏小。';
      if (ratio < 0) msg = '還不對，正負號相反了，檢查一下方向。';
      else if (k !== 0 && Math.abs(ratio / 10 ** k - 1) < 0.03) msg = `差了 10${sup(k)} 倍，檢查一下單位換算。`;
      fb.className = 'feedback bad'; fb.textContent = msg + (shown < p.hints.length ? '可以看看提示。' : '');
    }
    PROG.solved[p.id] = st; saveProg(); renderChapterCard();
  });
  hb.addEventListener('click', () => {
    if (shown >= p.hints.length) return;
    const h = document.createElement('li'); h.innerHTML = rich(p.hints[shown]); hints.appendChild(h); shown++;
    hb.textContent = shown >= p.hints.length ? '提示都看完了' : `再給一個提示（${shown + 1}/${p.hints.length}）`; hb.disabled = shown >= p.hints.length;
  });
  li.querySelector('.sol-btn').addEventListener('click', e => { sol.hidden = !sol.hidden; e.currentTarget.textContent = sol.hidden ? '看完整詳解' : '收起詳解'; });
  const tg = li.querySelector('.sim-toggle');
  if (tg) {
    let m = null; const host = tg.nextElementSibling;
    tg.addEventListener('click', () => {
      const open = host.hidden; host.hidden = !open; tg.setAttribute('aria-expanded', open); tg.textContent = open ? '收起情境模擬' : '打開情境模擬';
      if (open && !m) { m = mountSim(host, p.sim.id, p.sim.preset, examColor(c.id)); mountedSims.push(m); }
    });
  }
}

/* ---------- 模擬容器 ---------- */
function mountSim(host, id, preset, accent) {

  const C = { bg: '#0A0F2A', panel2: '#1A2250', line: '#4A5690', grid: '#1E2650', ink: '#E9ECFF', muted: '#9AA4D1', accent, warm: '#FF9466', cool: '#5FD8C8', ok: '#6FE3A6', bad: '#FF7A8A' };
  const uid = 's' + Math.random().toString(36).slice(2, 8);

    <div class="sim-controls">${def.params.map(q => {
      if (q.type === 'select') return `<label class="ctl" data-k="${q.k}" ${q.when ? `data-when="${q.when}"` : ''}><span class="ctl-l">${esc(q.label)}</span><select data-k="${q.k}">${q.options.map(o => `<option value="${o[0]}" ${String(p[q.k]) === o[0] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
      const u = q.log ? Math.round(1000 * Math.log(p[q.k] / q.min) / Math.log(q.max / q.min)) : p[q.k];
      return `<label class="ctl" data-k="${q.k}" ${q.when ? `data-when="${q.when}"` : ''}><span class="ctl-l">${esc(q.label)}<output id="${uid}-${q.k}"></output></span>
        <input type="range" data-k="${q.k}" min="${q.log ? 0 : q.min}" max="${q.log ? 1000 : q.max}" step="${q.log ? 1 : q.step}" value="${u}"></label>`;
    }).join('')}</div>
    <dl class="sim-readout"></dl>
    <div class="sim-actions"><button type="button" class="btn-ghost" data-act="reset">重新開始</button><button type="button" class="btn-ghost" data-act="pause">暫停</button></div></div>`;
  const cv = host.querySelector('canvas'), cx2 = cv.getContext('2d'), ro = host.querySelector('.sim-readout');

  const showWhen = () => host.querySelectorAll('.ctl[data-when]').forEach(el => { const cur = p.mode || p.proc; el.hidden = !el.dataset.when.split('|').includes(cur); });
  def.params.forEach(q => { if (q.type !== 'select') host.querySelector(`#${uid}-${q.k}`).textContent = fmtVal(q, p[q.k]); });

  host.querySelector('[data-act="reset"]').addEventListener('click', () => { def.reset(s, p); paint(true); });
  const pb = host.querySelector('[data-act="pause"]'); pb.addEventListener('click', () => { paused = !paused; pb.textContent = paused ? '繼續' : '暫停'; });
  let W = 0, H = 0;
  function size() { const w = host.clientWidth || 400; W = w; H = Math.round(Math.max(200, Math.min(340, w * 0.6))); const d = Math.min(window.devicePixelRatio || 1, 2); cv.width = W * d; cv.height = H * d; cv.style.height = H + 'px'; cx2.setTransform(d, 0, 0, d, 0, 0); }
  function paint(forceReadout) {
    cx2.fillStyle = C.bg; cx2.fillRect(0, 0, W, H);
    try { def.draw(cx2, W, H, s, p, C); } catch (e) { console.error(e); }
    if (forceReadout || frames % 8 === 0) ro.innerHTML = def.readout(s, p).map(r => `<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join('');
  }
  function loop(now) {
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now; frames++;
    if (visible) { if (!paused && dt > 0) def.step(s, p, dt); paint(false); }
    raf = requestAnimationFrame(loop);
  }
  size(); paint(true); raf = requestAnimationFrame(loop);
  const rs = new ResizeObserver(() => { size(); paint(true); }); rs.observe(host);
  const io = new IntersectionObserver(es => { visible = es[0].isIntersecting; }); io.observe(cv);
  return { destroy() { cancelAnimationFrame(raf); rs.disconnect(); io.disconnect(); } };
}

/* ---------- 路由 ---------- */
let route = { view: 'home', exam: 0 };
function parseHash() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'exam' && EXAMS[+parts[1]]) return { view: 'home', exam: +parts[1] };
  if (parts[0] === 'ch' && CH[+parts[1]]) {
    const ch = +parts[1];
    if (parts[2] === 'practice') return { view: 'chapter', ch, panel: 'practice' };
    if (parts[2] && FM[parts[2]] && FM[parts[2]].ch === ch) return { view: 'chapter', ch, panel: 'formula', f: parts[2] };
    return { view: 'chapter', ch };
  }
  return { view: 'home', exam: 0 };
}
function applyRoute() {
  const prev = route; route = parseHash();
  document.body.dataset.view = route.view;
  document.querySelectorAll('.exam-filter button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.exam === (route.view === 'home' ? route.exam : -1))));
  if (route.view === 'chapter') {
    if (prev.view !== 'chapter' || prev.ch !== route.ch) S.chapterReveal = 0;
    renderChapterCard(); $('#chapter-card').hidden = false;
    document.title = `第 ${route.ch} 章 ${CH[route.ch].title}｜物理公式星系`;
    if (route.panel) openPanel(route); else closePanel();
  } else {
    $('#chapter-card').hidden = true; closePanel(); renderLegend();
    document.title = '物理公式星系';
  }
  S.hover = null; showTip(null);
  if (route.view === 'chapter' && prev.view === 'chapter' && prev.ch === route.ch) return; // 同章內只換面板，畫面跟著 targetCamera 平移
  requestAnimationFrame(() => flyTo(false));
}
document.querySelectorAll('.exam-filter button').forEach(b => b.addEventListener('click', () => { location.hash = +b.dataset.exam ? '#/exam/' + b.dataset.exam : '#/'; }));
window.addEventListener('hashchange', applyRoute);
window.addEventListener('resize', () => { resize(); renderChapterCard(); });

function init() {
  updateSummary(); renderLegend();
  route = parseHash(); resize(); applyRoute(); flyTo(true);
  requestAnimationFrame(draw);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
window.__PFG = { S, route: () => route, CH, FM, PB };
})();


</script>
