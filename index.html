<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物理公式星系</title>
<meta name="description" content="大學普通物理 100 條公式的關係圖：每章公式的定義與用法，以及它和其他章公式怎麼連在一起，附互動模擬與練習題。">
<meta name="theme-color" content="#070A1F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23070A1F'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='6' fill='none' stroke='%237CC8FF' stroke-width='1.5' transform='rotate(-25 16 16)'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23FFB35C'/%3E%3Ccircle cx='25' cy='12' r='2' fill='%23C4A3FF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --space: #070A1F; --panel: #0E1433; --panel-2: #151C42; --line: #2A3566;
  --ink: #E9ECFF; --ink-2: #C9CFF0; --muted: #9AA4D1;
  --ex1: #7CC8FF; --ex2: #C4A3FF; --ex3: #FFB35C; --ok: #6FE3A6; --bad: #FF7A8A; --warn: #FFD27A;
  --accent: var(--ex1);
  --sans: "Noto Sans TC", "Noto Sans CJK TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --serif: "Noto Serif TC", "Noto Serif CJK TC", "Songti TC", "PMingLiU", serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--space); color: var(--ink); font: 15px/1.7 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
#sky { position: fixed; inset: 0; display: block; z-index: 0; touch-action: manipulation; }
a { color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; flex: none; }
.tex-fallback { font-family: ui-monospace, monospace; color: var(--muted); font-size: .9em; }

/* 按鈕 */
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font: 500 14.5px/1.4 var(--sans); text-decoration: none; cursor: pointer; }
.btn-primary { background: var(--accent); color: #0B1030; border-color: transparent; font-weight: 700; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 6px 12px; border-radius: 8px; font: 500 13.5px/1.4 var(--sans); cursor: pointer; }
.btn-ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
.btn-ghost:disabled { opacity: .5; cursor: default; }
.btn-ghost.small { padding: 3px 10px; font-size: 12.5px; }
.btn-ghost.armed { color: var(--bad); border-color: var(--bad); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; background: transparent; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); cursor: pointer; flex: none; }
.icon-btn:hover { color: var(--ink); border-color: var(--muted); }
.icon-btn svg, .back svg, .f-nav svg { width: 16px; height: 16px; }

/* 頂欄 */
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; gap: 24px; padding: 14px 24px 22px; pointer-events: none;
  background: linear-gradient(to bottom, rgba(7,10,31,.92) 40%, rgba(7,10,31,0)); }
.topbar > * { pointer-events: auto; }
.brand { display: flex; flex-direction: column; text-decoration: none; line-height: 1.25; }
.brand-name { font: 700 22px/1.2 var(--serif); letter-spacing: .06em; }
.brand-sub { font-size: 12.5px; color: var(--muted); }
.exam-filter { display: flex; gap: 2px; margin: 0 auto; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: rgba(14,20,51,.75); }
.exam-filter button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; background: none; color: var(--muted); padding: 6px 14px; border-radius: 999px; font: 500 14px/1.3 var(--sans); cursor: pointer; }
.exam-filter button:hover { color: var(--ink); }
.exam-filter button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); border-color: var(--line); }
.summary { display: flex; align-items: center; gap: 14px; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.summary b { color: var(--ink); font-variant-numeric: tabular-nums; }

.hint { position: fixed; top: 86px; left: 50%; transform: translateX(-50%); margin: 0; z-index: 4; color: var(--muted); font-size: 14px; pointer-events: none; transition: opacity .8s; white-space: nowrap; }
.hint.gone, body[data-view="chapter"] .hint { opacity: 0; }

/* 圖例（章節列表） */
.legend { position: fixed; left: 24px; bottom: 20px; z-index: 5; max-width: min(820px, calc(100vw - 48px)); padding: 14px 18px 10px; border: 1px solid var(--line); border-radius: 14px;
  background: rgba(14,20,51,.82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
body[data-view="chapter"] .legend { display: none; }
.legend-groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
.lg-group { min-width: 0; }
.lg-exam { display: flex; align-items: center; gap: 8px; color: var(--accent); text-decoration: none; font: 700 14px/1.4 var(--sans); margin-bottom: 6px; }
.lg-range { color: var(--muted); font-weight: 400; font-size: 12px; }
.lg-group ul { list-style: none; margin: 0; padding: 0; }
.lg-group li a { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; padding: 2px 6px; border-radius: 6px; text-decoration: none; color: var(--ink-2); font-size: 13.5px; line-height: 1.5; }
.lg-group li a:hover { background: rgba(255,255,255,.06); color: var(--ink); }
.lg-no { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.lg-n { color: var(--muted); font-size: 11.5px; padding-left: 8px; }
.lg-bar { grid-column: 2 / 4; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 1px 0 2px; }
.lg-bar i { display: block; height: 100%; background: var(--accent); }
.credit { margin: 10px 0 0; font-size: 11.5px; color: var(--muted); }
.legend-toggle { display: none; position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 6; }

/* 章節頁 */
body[data-view="chapter"] .topbar { background: rgba(7,10,31,.97); border-bottom: 1px solid var(--line); padding-bottom: 14px; }
.chview { position: fixed; inset: 0; z-index: 3; overflow-y: auto; padding: 84px 32px 72px; background: var(--space); container-type: inline-size; }
@media (min-width: 1100px) { body.panel-on .chview { padding-right: calc(min(520px, 100vw) + 28px); } }
.ch-head, .relmap { max-width: 1420px; margin: 0 auto; }
.ch-switch { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; font-size: 13px; }
.sw-group { display: flex; align-items: center; gap: 4px; }
.sw-exam { margin-right: 4px; color: var(--accent); font-weight: 600; white-space: nowrap; }
.ch-switch a { min-width: 32px; height: 28px; padding: 0 6px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); text-decoration: none; font-variant-numeric: tabular-nums; }
.ch-switch a:hover { color: var(--ink); border-color: var(--accent); }
.ch-switch a.cur { background: var(--accent); border-color: transparent; color: #0B1030; font-weight: 700; }
.ch-title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-top: 20px; }
.ch-exam { display: flex; align-items: center; gap: 8px; margin: 0; color: var(--accent); font: 600 13px/1.4 var(--sans); }
.tag-sup { margin-left: 4px; padding: 0 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 11.5px; font-weight: 400; }
.ch-title { margin: 4px 0 4px; font: 700 30px/1.3 var(--serif); }
.ch-en { margin-left: 14px; color: var(--muted); font: 400 14px/1 var(--sans); }
.ch-blurb { margin: 0; color: var(--ink-2); font-size: 15px; }
.ch-actions { flex: none; text-align: right; }
.ch-stats { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
.ch-key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 16px 0 22px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; }
.ch-key-note { margin-left: 6px; }

/* 關係類型標籤 */
.rtag { display: inline-flex; align-items: center; padding: 0 7px; border: 1px solid rgba(233,236,255,.4); border-radius: 6px; color: var(--ink); font: 600 12px/1.6 var(--sans); white-space: nowrap; }
.rtag.t-spe { border-color: rgba(233,236,255,.4); background: rgba(233,236,255,.06); }
.rtag.t-app { background: rgba(233,236,255,.1); }
.rtag.t-ana, .rtag.t-pai, .rtag.t-cmp { border-style: dashed; border-color: rgba(154,164,209,.6); color: var(--muted); }

/* 三欄關係圖 */
.relmap { position: relative; display: grid; grid-template-columns: minmax(230px, 290px) minmax(0, 1fr) minmax(230px, 290px); column-gap: 88px; align-items: start; }
.col { position: relative; z-index: 1; min-width: 0; }
.col-h { margin: 0 0 10px; color: var(--muted); font: 600 13px/1.4 var(--sans); }
.col-empty { margin: 0; padding: 12px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; }
svg.links { position: absolute; inset: 0; z-index: 0; overflow: visible; pointer-events: none; }
svg.links path { fill: none; stroke-width: 1.3; stroke-opacity: .4; transition: stroke-opacity .15s; }
svg.links path.t-ana, svg.links path.t-pai, svg.links path.t-cmp { stroke-dasharray: 5 4; }
.relmap.focusing svg.links path { stroke-opacity: .07; }
.relmap.focusing svg.links path.lit { stroke-opacity: 1; stroke-width: 2; }

.scard { margin-bottom: 12px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 10px; background: var(--panel); outline: none; transition: opacity .15s, border-color .15s; }
.scard-head { display: flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font: 600 14px/1.4 var(--sans); }
.scard-head:hover { text-decoration: underline; }
.chtag { flex: none; padding: 0 6px; border-radius: 5px; background: var(--c); color: #0B1030; font: 700 11px/1.6 var(--sans); }
.scard-tex { margin: 6px 0 2px; overflow-x: auto; overflow-y: hidden; }
.scard-tex .katex { font-size: 1.04em; }
.rel-list { margin: 6px 0 0; padding: 0; list-style: none; }
.rel { margin: 5px 0; font-size: 13.5px; line-height: 1.55; }
.rel-name { margin-left: 6px; color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--muted); }
.rel-name:hover { color: #fff; border-bottom-color: var(--ink); }
.rel-name .chtag { margin-right: 6px; }
.rtext { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; }
.scard .rtext { display: none; }
.scard .rel.lit .rtext { display: block; }
.scard.lit { border-color: var(--c); }

.fcard { margin-bottom: 16px; padding: 16px 18px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); outline: none; scroll-margin: 90px; transition: opacity .15s, border-color .15s, box-shadow .15s; }
.fcard-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.fcard-top h3 { margin: 0; font: 700 18px/1.4 var(--sans); }
.fcard-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.tag { padding: 0 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.tag-seen { color: var(--ok); border-color: rgba(111,227,166,.4); }
.fcard-tex { margin: 8px 0 6px; padding: 4px 2px; overflow-x: auto; overflow-y: hidden; }
.fcard-tex .katex-display { margin: .3em 0; }
.fcard-tex .katex { font-size: 1.32em; }
.fcard-sym { display: flex; flex-wrap: wrap; gap: 2px 20px; margin: 0 0 8px; font-size: 13.5px; }
.fcard-sym div { display: flex; align-items: baseline; gap: 6px; }
.fcard-sym dt { color: var(--ink); }
.fcard-sym dd { margin: 0; color: var(--ink-2); }
.fcard-sym .u { margin-left: 5px; color: var(--muted); font-size: 12.5px; }
.fcard-idea { margin: 0 0 6px; color: #DDE2FF; font-size: 14.5px; }
.fcard-rel h4 { margin: 12px 0 2px; color: var(--muted); font: 600 12.5px/1.4 var(--sans); }
.fcard-cross { display: none; }
.fcard-more { display: inline-block; margin-top: 10px; color: var(--accent); font-size: 13.5px; font-weight: 600; text-decoration: none; }
.fcard-more:hover { text-decoration: underline; }
.fcard.lit { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.fcard.lit-soft { border-color: rgba(233,236,255,.35); }
.relmap.focusing .fcard:not(.lit):not(.lit-soft), .relmap.focusing .scard:not(.lit) { opacity: .42; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.fcard.flash { animation: flash 1.3s ease-out; }
.rel-h { margin: 14px 0 2px; color: var(--muted); font: 600 13px/1.4 var(--sans); }

@container (max-width: 1179px) {
  .relmap { grid-template-columns: minmax(0, 1fr); max-width: 820px; }
  .col-left, .col-right, svg.links { display: none; }
  .fcard-cross { display: block; }
  .ch-head { max-width: 820px; }
}

/* 面板 */
.panel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 20; width: min(520px, 100vw); display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line);
  transform: translateX(102%); transition: transform .38s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
.panel.open { transform: none; visibility: visible; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px 12px 24px; border-bottom: 1px solid var(--line); }
.ph-ch { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); text-decoration: none; font: 600 14px/1.4 var(--sans); }
.panel-body { flex: 1; overflow: auto; padding: 4px 24px 48px; overscroll-behavior: contain; }
.f-nav { display: flex; align-items: center; gap: 10px; margin-top: 14px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.f-nav a { width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
.f-nav a:hover { color: var(--ink); border-color: var(--muted); }
.f-name { margin: 10px 0 12px; font: 700 26px/1.3 var(--serif); }
.f-display { padding: 16px 12px; border: 1px solid var(--line); border-radius: 14px; background: #0A0F2A; overflow-x: auto; }
.f-display .katex-display { margin: .2em 0; }
.f-display .katex { font-size: 1.4em; }
.f-display [data-sym] { cursor: help; border-radius: 3px; transition: color .15s, text-shadow .15s; }
.f-display [data-sym].hi, .f-display [data-sym]:hover { color: var(--accent); text-shadow: 0 0 12px var(--accent); }
.f-idea { margin: 14px 0 4px; color: #DDE2FF; font-size: 15.5px; }
.sec h3 { margin: 28px 0 8px; font: 700 15.5px/1.4 var(--sans); }
.sec-note { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
.sym-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.sym-table th { padding: 6px 8px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 500; text-align: left; }
.sym-table td { padding: 8px; border-bottom: 1px solid rgba(42,53,102,.6); vertical-align: top; }
.sym-table tr { transition: background .15s; }
.sym-table tr.hi td { background: rgba(255,255,255,.05); }
.sym-table tr.hi .sym-s { color: var(--accent); }
.sym-s { width: 72px; font-size: 1.05em; }
.sym-u { color: var(--muted); font-size: 13px; white-space: nowrap; }
.sym-d { display: block; color: var(--muted); font-size: 12.5px; }
.derive { margin: 0; padding-left: 1.4em; }
.derive li { margin: 6px 0; }
.derive li::marker { color: var(--accent); font-weight: 700; }
.ex { margin: 10px 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,.02); }
.ex-ref { margin: 0 0 4px; color: var(--accent); font-size: 12.5px; font-weight: 600; }
.ex-q { margin: 0 0 6px; }
details summary { color: var(--muted); font-size: 13.5px; cursor: pointer; }
details summary:hover { color: var(--ink); }
.ex-a { margin-top: 6px; padding-left: 12px; border-left: 2px solid var(--accent); color: #DDE2FF; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.fchip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 11px 4px 5px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.02); color: #DDE2FF; text-decoration: none; font-size: 13.5px; line-height: 1.5; }
.fchip:hover { border-color: var(--c); color: #fff; }
.fchip-ch { padding: 0 7px; border-radius: 999px; background: var(--c); color: #0B1030; font-size: 11px; font-weight: 700; }
.panel-foot { margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }
.foot-note { margin: 10px 0 0; color: var(--muted); font-size: 13px; }

/* 模擬 */
.sim canvas { display: block; width: 100%; border: 1px solid var(--line); border-radius: 12px; background: #0A0F2A; }
.sim-controls { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 18px; margin: 12px 0 6px; }
.ctl { display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-size: 13px; }
.ctl-l { display: flex; justify-content: space-between; gap: 8px; }
.ctl output { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ctl input[type=range] { width: 100%; margin: 4px 0; accent-color: var(--accent); }
.ctl select, .answer input { background: #0A0F2A; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; font: 14px/1.4 var(--sans); }
.ctl select { padding: 6px 8px; margin-top: 2px; }
.sim-readout { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 18px; margin: 8px 0; padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,.03); }
.sim-readout div { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.sim-readout dt { color: var(--muted); }
.sim-readout dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.sim-actions { display: flex; gap: 8px; }

/* 練習題 */
.probs { list-style: none; margin: 12px 0 0; padding: 0; }
.prob { margin: 14px 0; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.02); }
.prob.ok { border-color: rgba(111,227,166,.55); }
.prob-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
.prob-no { color: var(--accent); font-weight: 700; font-size: 14px; }
.prob-ref { color: var(--muted); font-size: 12.5px; }
.badge { margin-left: auto; color: var(--ok); font-size: 12.5px; font-weight: 600; }
.prob-q { margin: 8px 0 10px; font-size: 15px; }
.prob-f { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; color: var(--muted); font-size: 12.5px; }
.prob-f .fchip { font-size: 12.5px; }
.sim-toggle { margin-bottom: 10px; }
.prob .sim-host { margin-bottom: 12px; }
.answer label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12.5px; }
.answer-row { display: flex; align-items: center; gap: 8px; }
.answer input { flex: 1; min-width: 0; padding: 9px 12px; font-size: 15px; font-variant-numeric: tabular-nums; }
.answer input:focus { border-color: var(--accent); outline: none; }
.unit { min-width: 2em; color: var(--muted); font-size: 14px; white-space: nowrap; }
.feedback { min-height: 1.4em; margin: 8px 0; font-size: 14px; }
.feedback.good { color: var(--ok); } .feedback.bad { color: var(--bad); } .feedback.warn { color: var(--warn); }
.hints { margin: 0 0 8px; padding-left: 1.3em; color: #DDE2FF; font-size: 14px; }
.hints li { margin: 4px 0; }
.hints li::marker { color: var(--accent); }
.prob-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.solution { margin-top: 12px; padding: 4px 0 4px 12px; border-left: 2px solid var(--ok); }
.solution p { margin: 4px 0; }
.sol-ans { color: var(--ok); }

/* 定義與名詞說明 */

<script>
/* ===== 第一次段考：Ch5–9 ===== */
const R = String.raw;
const CHAPTERS = [];
const FORMULAS = [];
const PROBLEMS = [];
function chapter(c, formulas, problems) {
  CHAPTERS.push(c);
  formulas.forEach(f => { f.ch = c.id; FORMULAS.push(f); });

/* ---------- Ch5 ---------- */
chapter({ id: 5, exam: 1, title: '牛頓定律的應用', en: "Using Newton's Laws",
  blurb: '畫自由體圖、拆分量，再處理摩擦力與圓周運動。' }, [
  { id: 'f5-1', name: '牛頓第二定律（分量式）',
    tex: R`\sum @{F}{F_x} = @{m}{m}\,@{a}{a_x},\qquad \sum @{F}{F_y} = m\,@{a}{a_y}`,
    sym: [['F', R`F_x,\,F_y`, '合力的分量', 'N', '把每個作用力投影到 x、y 軸後相加'],
          ['m', R`m`, '質量', 'kg', '物體的慣性大小'],
          ['a', R`a_x,\,a_y`, '加速度分量', 'm/s²', '和合力分量方向相同']],
    idea: '先畫自由體圖，把每個力拆成分量，再對每個方向各寫一條 F = ma。',
    derive: [R`向量形式：$\vec F_{net} = \sum \vec F_i = m\vec a$。`,
             R`選座標：讓一軸沿著加速度方向，斜面問題就選「沿斜面」為 x 軸。`,
             R`把每個力寫成分量，例如斜面上的重力 $\vec F_g = mg(\sin\theta,\,-\cos\theta)$。`,
             R`兩向量相等代表各分量相等，於是得到兩條純量方程式。`],
    links: ['f5-2', 'f9-2', 'f10-4', 'f12-1'],
    ex: [{ ref: '例題 5.2 防熊背包', q: R`一個 17 kg 的背包掛在繩子正中央，兩段繩子都與水平成 22°。每段繩子的張力是多少？`,
           a: R`背包靜止，$\vec a = 0$。x 方向：$T_1\cos\theta = T_2\cos\theta$，所以 $T_1 = T_2 = T$。y 方向：$2T\sin\theta - mg = 0$，得 $T = \dfrac{mg}{2\sin\theta} = \dfrac{(17)(9.8)}{2\sin 22^\circ} \approx 220\ \text{N}$。` }] },
  { id: 'f5-2', name: '無摩擦斜面',
    tex: R`@{a}{a} = @{g}{g}\sin@{th}{\theta},\qquad @{n}{n} = @{m}{m}\,g\cos\theta`,
    sym: [['a', R`a`, '沿斜面的加速度', 'm/s²', '方向沿斜面向下'],
          ['g', R`g`, '重力加速度', 'm/s²', '地表約 9.8 m/s²'],
          ['th', R`\theta`, '斜面傾角', '°', '斜面與水平的夾角'],
          ['n', R`n`, '正向力', 'N', '斜面垂直推物體的力'],
          ['m', R`m`, '質量', 'kg', '']],
    idea: '重力沿斜面的分量 mg sinθ 讓物體加速，垂直斜面的分量被正向力抵消；加速度和質量無關。',
    derive: [R`取 x 軸沿斜面向下、y 軸垂直斜面。`,
             R`x 方向：$mg\sin\theta = ma$，所以 $a = g\sin\theta$。`,
             R`y 方向：$n - mg\cos\theta = 0$，所以 $n = mg\cos\theta$。`],
    links: ['f5-1', 'f5-3', 'f7-4'], sim: 'incline',
    ex: [{ ref: '例題 5.1 滑雪', q: R`質量 65 kg 的滑雪者沿 32° 的無摩擦山坡滑下。求 (a) 加速度 (b) 雪面施給他的力。`,
           a: R`(a) $a = g\sin\theta = (9.8)\sin 32^\circ \approx 5.2\ \text{m/s}^2$。(b) $n = mg\cos\theta = (65)(9.8)\cos 32^\circ \approx 540\ \text{N}$。` }] },
  { id: 'f5-3', name: '靜摩擦力',
    tex: R`@{fs}{f_s} \le @{mu}{\mu_s}\,@{n}{n}`,
    sym: [['fs', R`f_s`, '靜摩擦力', 'N', '物體沒滑動時，大小剛好抵消其他力'],
          ['mu', R`\mu_s`, '靜摩擦係數', '無單位', '由兩接觸面的材質決定'],
          ['n', R`n`, '正向力', 'N', '']],
    idea: '靜摩擦是「需要多少給多少」，上限是 μs n；超過上限物體就開始滑。',
    derive: [R`物體靜止時合力為零，摩擦力的大小由其他力決定。`,
             R`實驗發現最大靜摩擦力正比於正向力：$f_{s,max} = \mu_s n$。`,
             R`斜面上剛好要滑時 $mg\sin\theta = \mu_s mg\cos\theta$，所以臨界角滿足 $\tan\theta_{max} = \mu_s$。`],
    links: ['f5-4', 'f5-6', 'f12-4'], sim: 'incline',
    ex: [{ ref: '例題 5.10 雪崩', q: R`新雪和舊雪之間的靜摩擦係數是 0.46。新雪能附著在多陡的坡上？`,
           a: R`剛好不滑時 $\tan\theta = \mu_s$，所以 $\theta = \tan^{-1}0.46 \approx 25^\circ$。` }] },
  { id: 'f5-4', name: '動摩擦力',
    tex: R`@{fk}{f_k} = @{mu}{\mu_k}\,@{n}{n}`,
    sym: [['fk', R`f_k`, '動摩擦力', 'N', '方向與相對滑動方向相反'],
          ['mu', R`\mu_k`, '動摩擦係數', '無單位', '通常比 μs 小'],
          ['n', R`n`, '正向力', 'N', '']],
    idea: '一旦滑動，摩擦力變成固定值 μk n，通常比最大靜摩擦小——所以輪子鎖死時煞車距離反而變長。',
    derive: [R`滑動時摩擦力大致與速度無關。`,
             R`水平面上 $n = mg$，減速度大小 $a = \mu_k g$。`,
             R`代入 $v^2 = v_0^2 + 2a\Delta x$，得煞車距離 $\Delta x = \dfrac{v_0^2}{2\mu_k g}$。`],
    links: ['f5-3', 'f7-5', 'f6-1'], sim: 'incline',
    ex: [{ ref: '例題 5.8 停車', q: R`輪胎在乾燥路面上 $\mu_k = 0.61$、$\mu_s = 0.89$。車速 25 m/s 時，(a) 最短停車距離 (b) 輪子鎖死打滑時的停車距離各是多少？`,
           a: R`(a) 輪子不打滑時是靜摩擦：$\Delta x = \dfrac{v_0^2}{2\mu_s g} = \dfrac{25^2}{2(0.89)(9.8)} \approx 36\ \text{m}$。(b) 打滑是動摩擦：$\dfrac{25^2}{2(0.61)(9.8)} \approx 52\ \text{m}$。這就是 ABS 防鎖死煞車的原理。` }] },
  { id: 'f5-5', name: '等速圓周運動（向心力）',
    tex: R`\sum @{F}{F_r} = @{m}{m}\,\frac{@{v}{v}^2}{@{r}{r}}`,
    sym: [['F', R`F_r`, '指向圓心的合力', 'N', '由張力、重力、摩擦力等提供'],
          ['m', R`m`, '質量', 'kg', ''],
          ['v', R`v`, '速率', 'm/s', ''],
          ['r', R`r`, '圓周半徑', 'm', '']],
    idea: '向心力不是一種新的力，而是「合力指向圓心的那一部分」。',
    derive: [R`等速圓周運動的加速度大小 $a = v^2/r$，方向指向圓心。`,
             R`代入牛頓第二定律 $F_{net} = ma$。`,
             R`雲霄飛車在環頂：$n + mg = mv^2/r$；剛好不掉下來時 $n = 0$，得 $v_{min} = \sqrt{gr}$。`],
    links: ['f5-6', 'f8-3', 'f10-1'],
    ex: [{ ref: '例題 5.7 翻筋斗', q: R`雲霄飛車環形軌道頂端的半徑是 6.3 m，車子要留在軌道上，頂端的最低速率是多少？`,
           a: R`最低速率時座椅不施力，$n = 0$：$mg = mv^2/r$，$v = \sqrt{gr} = \sqrt{(9.8)(6.3)} \approx 7.9\ \text{m/s}$。` }] },
  { id: 'f5-6', name: '傾斜彎道',
    tex: R`\tan@{th}{\theta} = \frac{@{v}{v}^2}{@{r}{r}\,@{g}{g}}`,
    sym: [['th', R`\theta`, '路面傾角', '°', ''],
          ['v', R`v`, '設計車速', 'm/s', ''],
          ['r', R`r`, '彎道半徑', 'm', ''],
          ['g', R`g`, '重力加速度', 'm/s²', '']],
    idea: '路面傾斜時，正向力的水平分量剛好提供向心力，車子不需要靠摩擦就能轉彎。',
    derive: [R`正向力 $\vec n = n(\sin\theta,\,\cos\theta)$。`,
             R`水平方向：$n\sin\theta = mv^2/r$。`,
             R`垂直方向：$n\cos\theta = mg$。兩式相除得 $\tan\theta = v^2/(rg)$。`,
             R`若是平路靠靜摩擦轉彎，則 $\mu_s mg = mv^2/r$，最高速率 $v_{max} = \sqrt{\mu_s r g}$。`],
    links: ['f5-5', 'f5-3'],
    ex: [{ ref: '例題 5.6 道路工程', q: R`半徑 200 m 的彎道要讓車速 25 m/s 的車不靠摩擦轉彎，路面要傾斜幾度？`,
           a: R`$\tan\theta = \dfrac{25^2}{(200)(9.8)} \approx 0.319$，$\theta \approx 18^\circ$。` }] }
], [
  { id: 'p5-1', ref: '改編自例題 5.4 拯救登山者', f: ['f5-1'],
    q: R`70 kg 的登山者懸在無摩擦冰崖邊，繩子另一端綁著冰面上一塊 940 kg 的石頭，石頭離崖邊 51 m。忽略繩子質量，石頭從靜止開始滑，經過多久會掉下崖邊？`,
    unit: 's', ans: 12.25,
    hints: [R`分別畫石頭和登山者的自由體圖，兩者用同一條繩子相連，加速度大小相同、張力相同。`,
            R`石頭：$T = m_r a$；登山者：$m_c g - T = m_c a$。兩式相加得 $a = \dfrac{m_c g}{m_r + m_c}$。`,
            R`石頭從靜止滑 51 m：$\Delta x = \tfrac12 a t^2$。`],
    sol: R`$a = \dfrac{(70)(9.8)}{940 + 70} \approx 0.679\ \text{m/s}^2$。$t = \sqrt{\dfrac{2\Delta x}{a}} = \sqrt{\dfrac{2(51)}{0.679}} \approx 12\ \text{s}$。` },
  { id: 'p5-2', ref: '改編自例題 5.9 轉彎', f: ['f5-5', 'f5-3'],
    q: R`一條水平道路以半徑 73 m 轉 90° 彎。路面積雪時輪胎與路面的靜摩擦係數只有 0.21，車子能安全轉彎的最高速率是多少？`,
    unit: 'm/s', ans: 12.26,
    hints: [R`平路轉彎的向心力只能靠靜摩擦力提供。`,
            R`最高速率時摩擦力達到上限：$\mu_s mg = m\dfrac{v^2}{r}$。`],
    sol: R`$v = \sqrt{\mu_s r g} = \sqrt{(0.21)(73)(9.8)} \approx 12\ \text{m/s}$（約 44 km/h）。乾燥路面 $\mu_s = 0.88$ 時可達 25 m/s。` },
  { id: 'p5-3', ref: '改編自例題 5.3 頂住滑雪選手', f: ['f5-1', 'f5-2'],
    q: R`60 kg 的滑雪選手站在 30° 的無摩擦斜坡上，起跑閘門以「水平方向」的力頂住他讓他保持靜止。閘門施的水平力是多少？`,
    unit: 'N', ans: 339.5,
    hints: [R`受三個力：重力、正向力（垂直斜面）、閘門的水平推力，合力為零。`,
            R`沿斜面方向寫平衡：水平力沿斜面的分量 $F_h\cos\theta$ 要抵消重力沿斜面的分量 $mg\sin\theta$。`],
    sol: R`$F_h\cos\theta = mg\sin\theta$，$F_h = mg\tan\theta = (60)(9.8)\tan 30^\circ \approx 340\ \text{N}$。` }
]);

/* ---------- Ch6 ---------- */
chapter({ id: 6, exam: 1, title: '功、能與功率', en: 'Energy, Work, and Power',
  blurb: '力乘位移得到功，功改變動能；變力的功是曲線下面積。' }, [
  { id: 'f6-1', name: '定力做的功',
    tex: R`@{W}{W} = @{F}{\vec F}\cdot\Delta@{r}{\vec r} = F\,\Delta r\cos@{th}{\theta}`,
    sym: [['W', R`W`, '功', 'J（焦耳）', '1 J = 1 N·m，是純量'],
          ['F', R`\vec F`, '作用力', 'N', '不一定是合力'],
          ['r', R`\Delta\vec r`, '位移', 'm', ''],
          ['th', R`\theta`, '力與位移的夾角', '°', 'θ > 90° 時功為負']],
    idea: '只有沿著位移方向的力分量才做功；和位移垂直的力（例如向心力）不做功。',
    derive: [R`把力拆成平行與垂直位移的兩個分量。`,
             R`平行分量 $F\cos\theta$ 乘上位移大小就是功。`,
             R`用內積寫成 $W = \vec F\cdot\Delta\vec r = F_x\Delta x + F_y\Delta y$。`],
    links: ['f6-2', 'f6-5', 'f7-1', 'f5-4'],
    ex: [{ ref: '例題 6.2 拉行李箱', q: R`以 60 N 的力、與水平成 35° 拉行李箱，在水平地面移動 45 m。做了多少功？`,
           a: R`$W = F\cos\theta\,\Delta x = (60)(\cos 35^\circ)(45) \approx 2.2\ \text{kJ}$。` }] },
  { id: 'f6-2', name: '變力做的功',
    tex: R`@{W}{W} = \int_{@{x1}{x_1}}^{@{x2}{x_2}} @{F}{F(x)}\,dx`,
    sym: [['W', R`W`, '功', 'J', ''],
          ['F', R`F(x)`, '隨位置改變的力', 'N', ''],
          ['x1', R`x_1`, '起點', 'm', ''],
          ['x2', R`x_2`, '終點', 'm', '']],
    idea: '力會變時，把路徑切成很多小段、每段近似定力再加起來——結果就是 F–x 圖曲線下的面積。',
    derive: [R`把區間切成 N 段，每段 $\Delta W_i \approx F(x_i)\,\Delta x$。`,
             R`總和 $W \approx \sum_i F(x_i)\,\Delta x$。`,
             R`令 $\Delta x \to 0$ 變成積分；幾何上就是 F–x 曲線下面積（x 軸下方算負）。`],
    links: ['f6-1', 'f6-3', 'f18-2'], sim: 'fxarea',
    ex: [{ ref: '例題 6.5 越來越粗糙的地面', q: R`把 180 kg 的箱子推過 10 m 長的粗糙區，動摩擦係數隨距離變化 $\mu_k = \mu_0 + ax^2$，$\mu_0 = 0.17$、$a = 0.0062\ \text{m}^{-2}$。等速推過去要做多少功？`,
           a: R`推力 $F(x) = \mu_k mg$。$W = \int_0^{10} (\mu_0 + ax^2)mg\,dx = mg\left[\mu_0 x + \tfrac13 a x^3\right]_0^{10} = (180)(9.8)(1.7 + 2.07) \approx 6.6\ \text{kJ}$。` }] },
  { id: 'f6-3', name: '拉伸彈簧所需的功',
    tex: R`@{W}{W} = \tfrac{1}{2}\,@{k}{k}\,@{x}{x}^2`,
    sym: [['W', R`W`, '外力對彈簧做的功', 'J', ''],
          ['k', R`k`, '彈力常數', 'N/m', '彈簧越硬 k 越大'],
          ['x', R`x`, '伸長或壓縮量', 'm', '從自然長度算起']],
    idea: '虎克定律 F = kx 隨伸長量線性增加，F–x 圖是三角形，面積就是 ½kx²。',
    derive: [R`要拉長彈簧，外力需抵消彈力：$F_{ext} = kx$。`,
             R`$W = \int_0^x kx'\,dx' = \tfrac12 kx^2$。`,
             R`也就是三角形面積：$\tfrac12 \times$ 底 $x$ $\times$ 高 $kx$。`],
    links: ['f6-2', 'f7-3', 'f13-6'], sim: 'fxarea',
    ex: [{ ref: '例題 6.4 高空彈跳', q: R`彈跳繩長 11 m、$k = 250\ \text{N/m}$，彈跳者到最低點時繩長變成兩倍。繩子被做了多少功？`,
           a: R`伸長量 $x = 11\ \text{m}$，$W = \tfrac12(250)(11)^2 \approx 15\ \text{kJ}$。` }] },
  { id: 'f6-4', name: '動能',
    tex: R`@{K}{K} = \tfrac{1}{2}\,@{m}{m}\,@{v}{v}^2`,
    sym: [['K', R`K`, '動能', 'J', '純量，永遠 ≥ 0'],
          ['m', R`m`, '質量', 'kg', ''],
          ['v', R`v`, '速率', 'm/s', '']],
    idea: '動能是物體因為運動而具有的能量；它的數值依參考座標而定。',
    derive: [R`從靜止推到速率 $v$，淨功 $W = \int F\,dx = \int m\dfrac{dv}{dt}\,dx$。`,
             R`$\dfrac{dv}{dt}\,dx = v\,dv$，所以 $W = \int_0^v mv'\,dv' = \tfrac12 mv^2$，定義為動能。`],
    links: ['f6-5', 'f10-6', 'f17-2'] },
  { id: 'f6-5', name: '功能定理',
    tex: R`@{W}{W_{net}} = \Delta @{K}{K} = \tfrac{1}{2}m@{v2}{v_2}^2 - \tfrac{1}{2}m@{v1}{v_1}^2`,
    sym: [['W', R`W_{net}`, '合力做的淨功', 'J', ''],
          ['K', R`\Delta K`, '動能變化', 'J', ''],
          ['v1', R`v_1`, '初速率', 'm/s', ''],
          ['v2', R`v_2`, '末速率', 'm/s', '']],
    idea: '合力做多少功，動能就改變多少；不需要知道過程中加速度怎麼變。',
    derive: [R`$W_{net} = \int F_{net}\,dx = \int m\dfrac{dv}{dt}\,dx$。`,
             R`用連鎖律 $\dfrac{dv}{dt}\,dx = v\,dv$。`,
             R`$W_{net} = \int_{v_1}^{v_2} mv\,dv = \tfrac12 mv_2^2 - \tfrac12 mv_1^2$。`],
    links: ['f6-4', 'f6-1', 'f7-4'],
    ex: [{ ref: '例題 6.6 超車路段', q: R`1400 kg 的車從 70 km/h 加速到 95 km/h，對車子做了多少淨功？`,
           a: R`$70\ \text{km/h} = 19.4\ \text{m/s}$、$95\ \text{km/h} = 26.4\ \text{m/s}$。$W = \tfrac12(1400)(26.4^2 - 19.4^2) \approx 220\ \text{kJ}$。之後煞車停下，淨功為 $-\tfrac12(1400)(26.4)^2 \approx -490\ \text{kJ}$。` }] },
  { id: 'f6-6', name: '功率',
    tex: R`@{P}{P} = \frac{dW}{dt} = @{F}{\vec F}\cdot@{v}{\vec v}`,
    sym: [['P', R`P`, '功率', 'W（瓦特）', '1 W = 1 J/s；1 hp = 746 W'],
          ['F', R`\vec F`, '作用力', 'N', ''],
          ['v', R`\vec v`, '速度', 'm/s', '']],
    idea: '功率是做功的快慢；等速前進時，所需功率 = 推進力 × 速率。',
    derive: [R`平均功率 $\bar P = W/\Delta t$；瞬時功率 $P = dW/dt$。`,
             R`$dW = \vec F\cdot d\vec r$，除以 $dt$ 得 $P = \vec F\cdot\vec v$。`],
    links: ['f6-1', 'f16-4'],
    ex: [{ ref: '例題 6.9 騎腳踏車', q: R`人加車共 82 kg，以 5.0 m/s 等速前進，空氣阻力 30 N。(a) 平地 (b) 5° 上坡時各需多少功率？`,
           a: R`(a) $P = F_{air}v = (30)(5.0) = 150\ \text{W}$。(b) 還要抵抗重力沿坡分量：$P = (30 + 82\cdot 9.8\sin 5^\circ)(5.0) \approx 500\ \text{W}$。` }] }
], [
  { id: 'p6-1', ref: '改編自例題 6.7 登華盛頓山', f: ['f6-6', 'f7-2'],
    q: R`55 kg 的登山客花 2.0 h 爬升 1300 m 的垂直高度。忽略摩擦損耗，他的平均輸出功率是多少？`,
    unit: 'W', ans: 97.3,
    hints: [R`他做的功等於重力位能的增加：$W = mgh$。`, R`時間要換成秒：2.0 h = 7200 s。`],
    sol: R`$P = \dfrac{mgh}{t} = \dfrac{(55)(9.8)(1300)}{7200} \approx 97\ \text{W}$。同樣路程 1500 kg 的汽車半小時開上去，平均功率約 11 kW。` },
  { id: 'p6-2', ref: '改編自例題 6.3 拖船', f: ['f6-1'],
    q: R`拖船推巡洋艦的力 $\vec F = (1.2,\ 2.3)\ \text{MN}$，巡洋艦的位移 $\Delta\vec r = (380,\ 460)\ \text{m}$。拖船做了多少功？（以 MJ 為單位）`,
    unit: 'MJ', ans: 1514,
    hints: [R`功是內積：$W = F_x\Delta x + F_y\Delta y$。`, R`1 MN × 1 m = 1 MJ。`],
    sol: R`$W = (1.2)(380) + (2.3)(460) = 456 + 1058 \approx 1510\ \text{MJ}$。` },
  { id: 'p6-3', ref: '改編自觀念題 6.11 彈性繩的最後一公尺', f: ['f6-3', 'f6-2'],
    q: R`承上題的高空彈跳繩（$k = 250\ \text{N/m}$），把繩子從伸長 10 m 拉到 11 m，也就是「最後一公尺」，需要做多少功？`,
    unit: 'J', ans: 2625,
    hints: [R`功是 F–x 圖在 x = 10 m 到 11 m 之間的面積。`, R`$W = \int_{10}^{11} kx\,dx = \tfrac12 k(x_2^2 - x_1^2)$。`],
    sol: R`$W = \tfrac12(250)(11^2 - 10^2) = 2625\ \text{J} \approx 2.6\ \text{kJ}$，是第一公尺（125 J）的 20 倍以上，因為越拉力越大。`,
    sim: { id: 'fxarea', preset: { k: 250, x: 11, from: 10 } } }
]);

/* ---------- Ch7 ---------- */
chapter({ id: 7, exam: 1, title: '能量守恆', en: 'Conservation of Energy',
  blurb: '保守力的功可以存成位能，動能與位能互換時總和不變。' }, [
  { id: 'f7-1', name: '位能的定義',
    tex: R`\Delta @{U}{U} = -@{W}{W_c} = -\int_{A}^{B} @{F}{\vec F}\cdot d\vec r`,
    sym: [['U', R`\Delta U`, '位能變化', 'J', '只有位能「差」有物理意義'],
          ['W', R`W_c`, '保守力做的功', 'J', ''],
          ['F', R`\vec F`, '保守力', 'N', '重力、彈力是保守力；摩擦力不是']],
    idea: '保守力做的功只跟起點、終點有關，與路徑無關，所以可以把它「存起來」成為位能。',
    derive: [R`保守力沿任何封閉路徑做的功都是 0。`,
             R`因此 A→B 的功只與端點有關，可定義 $U_B - U_A = -W_{AB}$。`,
             R`零點可以自己選，選定後每個位置都有一個 $U$ 值。`],
    links: ['f7-2', 'f7-3', 'f7-6', 'f8-5', 'f6-2'],
    ex: [{ ref: '例題 7.3 登山繩', q: R`登山繩的力 $F = -kx + bx^2$，$k = 223\ \text{N/m}$、$b = 4.10\ \text{N/m}^2$。取 $x = 0$ 時 $U = 0$，拉長 2.62 m 時位能是多少？`,
           a: R`$U = -\int_0^x(-kx' + bx'^2)\,dx' = \tfrac12 kx^2 - \tfrac13 bx^3 = \tfrac12(223)(2.62)^2 - \tfrac13(4.10)(2.62)^3 \approx 741\ \text{J}$，比理想彈簧的 765 J 少約 3%。` }] },
  { id: 'f7-2', name: '重力位能（地表附近）',
    tex: R`@{U}{U} = @{m}{m}\,@{g}{g}\,@{y}{y}`,
    sym: [['U', R`U`, '重力位能', 'J', ''],
          ['m', R`m`, '質量', 'kg', ''],
          ['g', R`g`, '重力加速度', 'm/s²', ''],
          ['y', R`y`, '相對零點的高度', 'm', '只看垂直高度']],
    idea: '只有垂直高度差會改變重力位能，水平移動不影響。',
    derive: [R`地表附近重力 $\vec F = (0,\,-mg)$ 為定力。`,
             R`$\Delta U = -\int(-mg)\,dy = mg\,\Delta y$。`],
    links: ['f7-1', 'f8-5', 'f15-6'],
    ex: [{ ref: '例題 7.1 搭電梯', q: R`55 kg 的工程師以 33 樓辦公室為位能零點，每層樓高 3.5 m。她在 59 樓與 1 樓的位能各是多少？`,
           a: R`59 樓：$U = (55)(9.8)(3.5)(59-33) \approx 49\ \text{kJ}$。1 樓：$U = (55)(9.8)(3.5)(1-33) \approx -60\ \text{kJ}$，位能可以是負的。` }] },
  { id: 'f7-3', name: '彈性位能',
    tex: R`@{U}{U} = \tfrac{1}{2}\,@{k}{k}\,@{x}{x}^2`,
    sym: [['U', R`U`, '彈性位能', 'J', '取平衡位置為零點'],
          ['k', R`k`, '彈力常數', 'N/m', ''],
          ['x', R`x`, '偏離平衡位置的位移', 'm', '伸長或壓縮都一樣']],
    idea: '不論拉長或壓縮，彈性位能都是正的；圖形是一條拋物線，最低點在平衡位置。',
    derive: [R`理想彈簧 $F = -kx$。`,
             R`$U(x) = -\int_0^x(-kx')\,dx' = \tfrac12 kx^2$。`],
    links: ['f7-1', 'f6-3', 'f13-6'],
    ex: [{ ref: '例題 7.2 彈簧比汽油', q: R`汽車懸吊彈簧的等效 $k = 120\ \text{kN/m}$。要壓縮多少才能儲存 1 g 汽油的能量（44 kJ）？`,
           a: R`$\tfrac12 kx^2 = 44\times10^3$，$x = \sqrt{\dfrac{2(44\times10^3)}{120\times10^3}} \approx 0.86\ \text{m}$。彈簧當能源完全比不上汽油。` }] },
  { id: 'f7-4', name: '機械能守恆',
    tex: R`@{K}{K_1} + @{U}{U_1} = K_2 + U_2`,
    sym: [['K', R`K`, '動能', 'J', ''],
          ['U', R`U`, '位能', 'J', '']],
    idea: '只有保守力做功時，動能和位能可以互相轉換，但總和 E = K + U 不變。',
    derive: [R`功能定理：$\Delta K = W_{net} = W_c + W_{nc}$。`,
             R`保守力的功 $W_c = -\Delta U$。`,
             R`若沒有非保守力（$W_{nc} = 0$），則 $\Delta K + \Delta U = 0$，即 $K + U$ 守恆。`],
    links: ['f6-5', 'f7-5', 'f8-6', 'f10-7', 'f15-6', 'f13-6'], sim: 'coaster',
    ex: [{ ref: '例題 7.4 麻醉大象', q: R`彈簧槍 $k = 940\ \text{N/m}$，壓縮 25 cm 後水平射出 38 g 的麻醉鏢。鏢離開槍口的速率是多少？`,
           a: R`$\tfrac12 kx^2 = \tfrac12 mv^2$，$v = x\sqrt{k/m} = (0.25)\sqrt{\dfrac{940}{0.038}} \approx 39\ \text{m/s}$。用牛頓第二定律解反而困難，因為彈力一直在變。` }] },
  { id: 'f7-5', name: '非保守力與能量',
    tex: R`\Delta @{E}{E} = \Delta K + \Delta U = @{W}{W_{nc}}`,
    sym: [['E', R`E`, '機械能', 'J', 'E = K + U'],
          ['W', R`W_{nc}`, '非保守力做的功', 'J', '摩擦力的功為負']],
    idea: '有摩擦時機械能會減少，少掉的部分變成熱（內能），總能量依然守恆。',
    derive: [R`同樣從 $\Delta K = W_c + W_{nc}$ 出發。`,
             R`代入 $W_c = -\Delta U$，得 $\Delta K + \Delta U = W_{nc}$。`,
             R`動摩擦：$W_{nc} = -\mu_k mg\,d < 0$。`],
    links: ['f7-4', 'f5-4', 'f18-1'], sim: 'coaster',
    ex: [{ ref: '例題 7.6 滑行木塊', q: R`質量 $m$ 的木塊被壓縮 $x_0$、常數 $k$ 的彈簧射出，在動摩擦係數 $\mu$ 的水平面上滑行。滑多遠停下？`,
           a: R`初始 $E_0 = \tfrac12 kx_0^2$，最後 $E = 0$。$0 - \tfrac12 kx_0^2 = -\mu mg\,x$，所以 $x = \dfrac{kx_0^2}{2\mu mg}$。` }] },
  { id: 'f7-6', name: '力與位能曲線',
    tex: R`@{F}{F_x} = -\frac{d@{U}{U}}{d@{x}{x}}`,
    sym: [['F', R`F_x`, '保守力', 'N', ''],
          ['U', R`U(x)`, '位能函數', 'J', ''],
          ['x', R`x`, '位置', 'm', '']],
    idea: '力指向位能「下坡」的方向；曲線越陡力越大，峰頂和谷底的力為零。',
    derive: [R`小位移時 $\Delta U = -F_x\,\Delta x$。`,
             R`取極限得 $F_x = -dU/dx$；三維為 $\vec F = -\nabla U$。`,
             R`總能量 $E = U(x)$ 的位置動能為 0，稱為轉折點。`],
    links: ['f7-1', 'f12-5'],
    ex: [{ ref: '例題 7.7 氫分子', q: R`氫分子位能井底部近似 $U = U_0 + a(x - x_0)^2$，$U_0 = -0.760\ \text{aJ}$、$a = 286\ \text{aJ/nm}^2$、$x_0 = 0.0741\ \text{nm}$。總能量 $-0.717\ \text{aJ}$ 時，原子間距的範圍？`,
           a: R`轉折點 $E = U$：$x - x_0 = \pm\sqrt{\dfrac{E - U_0}{a}} = \pm\sqrt{\dfrac{0.043}{286}} \approx \pm 0.0123\ \text{nm}$，所以 $x$ 在 0.0618 nm 到 0.0864 nm 之間。` }] }
], [
  { id: 'p7-1', ref: '改編自例題 7.5 彈簧與斜坡', f: ['f7-4', 'f7-3'],
    q: R`無摩擦斜坡底部有一個 $k = 140\ \text{N/m}$ 的彈簧，被 50 g 的木塊壓縮了 11 cm。放手後木塊能沿斜坡上升多高（垂直高度）？`,
    unit: 'm', ans: 1.729,
    hints: [R`初態只有彈性位能，終態（最高點）只有重力位能。`, R`$\tfrac12 kx^2 = mgh$。`],
    sol: R`$h = \dfrac{kx^2}{2mg} = \dfrac{(140)(0.11)^2}{2(0.050)(9.8)} \approx 1.7\ \text{m}$。` },
  { id: 'p7-2', ref: '改編自 7.4 位能曲線（雲霄飛車）', f: ['f7-4', 'f7-6'],
    q: R`無摩擦雲霄飛車在 A 點的高度是 12 m，前方最高的 C 點高 20 m。車子要越過 C 點，在 A 點的速率至少要多少？`,
    unit: 'm/s', ans: 12.52,
    hints: [R`要越過 C 點，總能量必須大於 C 點的位能：$E_A \ge U_C$。`, R`$\tfrac12 mv_A^2 + mgh_A \ge mgh_C$，質量可以消掉。`],
    sol: R`$v_A \ge \sqrt{2g(h_C - h_A)} = \sqrt{2(9.8)(8)} \approx 12.5\ \text{m/s}$。`,
    sim: { id: 'coaster', preset: { v0: 12.6, mu: 0 } } },
  { id: 'p7-3', ref: '改編自例題 7.6 滑行木塊（數字為補充）', f: ['f7-5', 'f5-4'],
    q: R`0.20 kg 的木塊被 $k = 500\ \text{N/m}$、壓縮 10 cm 的彈簧射出，在 $\mu_k = 0.25$ 的水平面上滑行。木塊滑多遠停下？`,
    unit: 'm', ans: 5.102,
    hints: [R`彈性位能最後全部被摩擦力消耗掉。`, R`$\tfrac12 kx_0^2 = \mu_k mg\,d$。`],
    sol: R`$d = \dfrac{kx_0^2}{2\mu_k mg} = \dfrac{(500)(0.10)^2}{2(0.25)(0.20)(9.8)} \approx 5.1\ \text{m}$。` }
]);

/* ---------- Ch8 ---------- */
chapter({ id: 8, exam: 1, title: '重力', en: 'Gravity',
  blurb: '萬有引力讓衛星繞行；圓軌道、脫離速度都來自能量與向心力。' }, [
  { id: 'f8-1', name: '萬有引力定律',
    tex: R`@{F}{F} = @{G}{G}\,\frac{@{m1}{m_1}@{m2}{m_2}}{@{r}{r}^2}`,
    sym: [['F', R`F`, '引力大小', 'N', '永遠互相吸引'],
          ['G', R`G`, '萬有引力常數', 'N·m²/kg²', '6.67 × 10⁻¹¹'],
          ['m1', R`m_1`, '質量一', 'kg', ''],
          ['m2', R`m_2`, '質量二', 'kg', ''],
          ['r', R`r`, '兩質心距離', 'm', '球形物體可當成質量集中在球心']],
    idea: '任兩個質量都互相吸引，大小與距離平方成反比；重力最弱，但作用距離最長。',
    derive: [R`牛頓比較月球的向心加速度和地表 $g$：月地距離約 60 倍地球半徑，加速度約 $g/3600$。`,
             R`$1/60^2 = 1/3600$，所以引力與距離平方成反比。`,
             R`卡文迪什用扭秤量出 $G$，之後就能「稱」地球的質量。`],
    links: ['f8-2', 'f5-5'] },
  { id: 'f8-2', name: '重力加速度',
    tex: R`@{g}{g} = \frac{@{G}{G}\,@{M}{M}}{@{r}{r}^2}`,
    sym: [['g', R`g`, '距中心 r 處的重力加速度', 'm/s²', ''],
          ['G', R`G`, '萬有引力常數', 'N·m²/kg²', ''],
          ['M', R`M`, '星球質量', 'kg', '地球 5.97 × 10²⁴ kg'],
          ['r', R`r`, '到星球中心的距離', 'm', '地球半徑 6.37 × 10⁶ m']],
    idea: '地表的 9.8 m/s² 只是 r = 地球半徑時的特例，高度增加 g 就變小。',
    derive: [R`質量 $m$ 的物體受力 $mg = \dfrac{GMm}{r^2}$。`, R`$m$ 消掉得 $g = GM/r^2$。`],
    links: ['f8-1', 'f5-2'],
    ex: [{ ref: '例題 8.1 太空站上的 g', q: R`國際太空站高度 380 km，那裡的重力加速度是多少？`,
           a: R`$g = \dfrac{(6.67\times10^{-11})(5.97\times10^{24})}{(6.37\times10^6 + 380\times10^3)^2} \approx 8.74\ \text{m/s}^2$，只比地表小 11%。太空人「失重」是因為在自由落下。` }] },
  { id: 'f8-3', name: '圓軌道速率',
    tex: R`@{v}{v} = \sqrt{\frac{@{G}{G}\,@{M}{M}}{@{r}{r}}}`,

          ['r', R`r`, '軌道半徑（到中心）', 'm', '']],
    idea: '重力剛好提供向心力；軌道越高速率越慢，而且與衛星本身的質量無關。',
    derive: [R`$\dfrac{GMm}{r^2} = \dfrac{mv^2}{r}$。`, R`解出 $v = \sqrt{GM/r}$。`],

    ex: [{ ref: '例題 8.2 國際太空站', q: R`太空站在 380 km 高的圓軌道上，軌道速率是多少？`,

  { id: 'f8-4', name: '克卜勒第三定律',
    tex: R`@{T}{T}^2 = \frac{4\pi^2}{@{G}{G}\,@{M}{M}}\,@{r}{r}^3`,
    sym: [['T', R`T`, '軌道週期', 's', ''],
          ['G', R`G`, '萬有引力常數', 'N·m²/kg²', ''],
          ['M', R`M`, '中心天體質量', 'kg', ''],
          ['r', R`r`, '軌道半徑', 'm', '橢圓軌道用半長軸']],
    idea: '週期平方正比於半徑立方——知道想要的週期，就能算出軌道高度。',
    derive: [R`繞一圈的時間 $T = 2\pi r/v$。`, R`代入 $v = \sqrt{GM/r}$：$T = 2\pi\sqrt{r^3/GM}$，兩邊平方即得。`],
    links: ['f8-3', 'f11-5'], sim: 'orbit',
    ex: [{ ref: '例題 8.3 地球同步軌道', q: R`同步衛星的週期是 24 h。它要在多高的軌道上？`,
           a: R`$r = \left(\dfrac{GMT^2}{4\pi^2}\right)^{1/3} = 4.22\times10^7\ \text{m}$，高度 $r - R_E \approx 35{,}800\ \text{km}$。` }] },
  { id: 'f8-5', name: '重力位能（一般形式）',
    tex: R`@{U}{U} = -\frac{@{G}{G}\,@{M}{M}\,@{m}{m}}{@{r}{r}}`,
    sym: [['U', R`U`, '重力位能', 'J', '取無限遠處 U = 0'],
          ['G', R`G`, '萬有引力常數', 'N·m²/kg²', ''],
          ['M', R`M`, '中心天體質量', 'kg', ''],
          ['m', R`m`, '物體質量', 'kg', ''],
          ['r', R`r`, '到中心的距離', 'm', '']],
    idea: '取無限遠處為零點，所以重力位能永遠是負的；在地表附近，它的變化就是 mgΔy。',
    derive: [R`$\Delta U = -\int_{r_1}^{r_2}\left(-\dfrac{GMm}{r^2}\right)dr = GMm\left(\dfrac1{r_1} - \dfrac1{r_2}\right)$。`,
             R`令 $r_1 \to \infty$ 處 $U = 0$，得 $U(r) = -GMm/r$。`],
    links: ['f7-1', 'f7-2', 'f8-6'],
    ex: [{ ref: '例題 8.4 到月球的第一段', q: R`把 11,000 kg 的材料從地表送到同步軌道（$r = 4.22\times10^7\ \text{m}$），要對抗地球重力做多少功？`,
           a: R`$W = GMm\left(\dfrac1{R_E} - \dfrac1r\right) = (6.67\times10^{-11})(5.97\times10^{24})(11{,}000)\left(\dfrac1{6.37\times10^6} - \dfrac1{4.22\times10^7}\right) \approx 5.8\times10^{11}\ \text{J}$。` }] },
  { id: 'f8-6', name: '脫離速度',
    tex: R`@{v}{v_{esc}} = \sqrt{\frac{2@{G}{G}\,@{M}{M}}{@{R}{R}}}`,
    sym: [['v', R`v_{esc}`, '脫離速度', 'm/s', '地表約 11.2 km/s'],
          ['G', R`G`, '萬有引力常數', 'N·m²/kg²', ''],
          ['M', R`M`, '星球質量', 'kg', ''],
          ['R', R`R`, '出發點到中心的距離', 'm', '']],
    idea: '總能量 E = K + U ≥ 0 就能飛到無限遠；脫離速度是同高度圓軌道速率的 √2 倍。',
    derive: [R`剛好脫離：到無限遠時 $K = 0$、$U = 0$，所以 $E = 0$。`,
             R`$\tfrac12 mv^2 - \dfrac{GMm}{R} = 0$，解出 $v_{esc} = \sqrt{2GM/R}$。`,
             R`圓軌道的總能量 $E = -\dfrac{GMm}{2r} < 0$，是束縛軌道。`],
    links: ['f8-5', 'f8-3', 'f7-4'], sim: 'orbit',
    ex: [{ ref: '例題 8.5 發射', q: R`火箭以 3.1 km/s 垂直發射（忽略空氣阻力），最高能到多高？`,
           a: R`能量守恆：$\tfrac12 v^2 - \dfrac{GM}{R_E} = -\dfrac{GM}{r}$，得 $r = \left(\dfrac1{R_E} - \dfrac{v^2}{2GM}\right)^{-1} \approx 6.90\times10^6\ \text{m}$，高度約 530 km。` }] }
], [
  { id: 'p8-1', ref: '改編自例題 8.1(c) 火星表面', f: ['f8-2'],
    q: R`火星質量 $0.642\times10^{24}\ \text{kg}$、半徑 $3.38\times10^6\ \text{m}$。火星表面的重力加速度是多少？`,
    unit: 'm/s²', ans: 3.748,

    sol: R`$g = \dfrac{(6.67\times10^{-11})(0.642\times10^{24})}{(3.38\times10^6)^2} \approx 3.7\ \text{m/s}^2$，約地球的 38%。` },
  { id: 'p8-2', ref: '改編自例題 8.2 太空站週期', f: ['f8-4', 'f8-3'],
    q: R`國際太空站在 380 km 高的圓軌道上。它繞地球一圈要幾分鐘？`,

    hints: [R`軌道半徑要加上地球半徑：$r = 6.37\times10^6 + 3.8\times10^5\ \text{m}$。`, R`$T = 2\pi\sqrt{r^3/GM}$，最後除以 60 換成分鐘。`],
    sol: R`$T = 2\pi\sqrt{\dfrac{(6.75\times10^6)^3}{(6.67\times10^{-11})(5.97\times10^{24})}} \approx 5.5\times10^3\ \text{s} \approx 92\ \text{min}$。`,
    sim: { id: 'orbit', preset: { alt: 380, vf: 1 } } },
  { id: 'p8-3', ref: '改編自例題 8.4 到月球的第二段', f: ['f8-5'],
    q: R`承例題 8.4，11,000 kg 的天文台在同步軌道（$4.22\times10^7\ \text{m}$）組裝後再送到距地心 $3.85\times10^8\ \text{m}$ 的月球。這一段對抗地球重力做了多少功？`,
    unit: 'J', ans: 9.242e10,
    hints: [R`用 $W = \Delta U = GMm\left(\dfrac1{r_1} - \dfrac1{r_2}\right)$。`, R`$r_1$ 是同步軌道半徑，$r_2$ 是月球距離。`],
    sol: R`$W = (6.67\times10^{-11})(5.97\times10^{24})(11{,}000)\left(\dfrac1{4.22\times10^7} - \dfrac1{3.85\times10^8}\right) \approx 9.2\times10^{10}\ \text{J}$，只有第一段的六分之一。` }

/* ---------- Ch9 ---------- */
chapter({ id: 9, exam: 1, title: '多質點系統', en: 'Systems of Particles',
  blurb: '質心像一個質點；沒有外力時總動量守恆，碰撞問題靠它解。' }, [
  { id: 'f9-1', name: '質心',
    tex: R`@{r}{\vec r_{cm}} = \frac{1}{@{M}{M}}\sum_i @{m}{m_i}\,@{ri}{\vec r_i}`,
    sym: [['r', R`\vec r_{cm}`, '質心位置', 'm', ''],
          ['M', R`M`, '總質量', 'kg', R`$M = \sum m_i$`],
          ['m', R`m_i`, '第 i 個質點的質量', 'kg', ''],
          ['ri', R`\vec r_i`, '第 i 個質點的位置', 'm', '']],
    idea: '質心是「質量加權的平均位置」，會比較靠近重的那一端。',
    derive: [R`兩質點：$x_{cm} = \dfrac{m_1x_1 + m_2x_2}{m_1 + m_2}$。`,
             R`推廣到 N 個質點，各分量分別計算。`,
             R`連續物體：$\vec r_{cm} = \dfrac1M\int\vec r\,dm$。`],
    links: ['f9-2', 'f12-3'],
    ex: [{ ref: '例題 9.1 舉重', q: R`1.5 m 長、質量可忽略的槓兩端各掛 50 kg 與 80 kg。質心在哪裡？`,
           a: R`以 50 kg 那端為原點：$x_{cm} = \dfrac{(80)(1.5)}{50 + 80} \approx 0.92\ \text{m}$，靠近較重的一端。` }] },
  { id: 'f9-2', name: '質心的運動',
    tex: R`@{F}{\vec F_{ext}} = @{M}{M}\,@{a}{\vec a_{cm}}`,
    sym: [['F', R`\vec F_{ext}`, '外力合力', 'N', '內力會成對抵消'],
          ['M', R`M`, '總質量', 'kg', ''],
          ['a', R`\vec a_{cm}`, '質心加速度', 'm/s²', '']],
    idea: '不管系統內部怎麼動、怎麼爆炸，質心都像一個質量 M 的質點，只受外力影響。',
    derive: [R`每個質點 $m_i\vec a_i = \vec F_i^{ext} + \vec F_i^{int}$。`,
             R`全部相加，內力依牛頓第三定律成對抵消。`,
             R`$\sum m_i\vec a_i = M\vec a_{cm}$，所以 $\vec F_{ext} = M\vec a_{cm}$。`],
    links: ['f9-1', 'f5-1', 'f9-4'],
    ex: [{ ref: '例題 9.4 馬戲團火車', q: R`4.8 t 的大象站在 15 t 車廂的一端，車廂停在無摩擦軌道上。大象往另一端走了 19 m，車廂移動多少？`,
           a: R`沒有水平外力，質心不動：$0 = m_J(19 + \Delta x_c) + m_c\Delta x_c$，$\Delta x_c = -\dfrac{(19)(4.8)}{4.8 + 15} \approx -4.6\ \text{m}$，車廂往反方向移 4.6 m。` }] },
  { id: 'f9-3', name: '動量與牛頓第二定律',
    tex: R`@{P}{\vec P} = \sum @{m}{m_i}\,@{v}{\vec v_i},\qquad @{F}{\vec F_{net}} = \frac{d\vec P}{dt}`,
    sym: [['P', R`\vec P`, '總動量', 'kg·m/s', ''],
          ['m', R`m_i`, '質量', 'kg', ''],
          ['v', R`\vec v_i`, '速度', 'm/s', ''],
          ['F', R`\vec F_{net}`, '外力合力', 'N', '']],
    idea: '力其實是「動量的變化率」；這個寫法連質量會改變的情況（火箭、水柱）也適用。',
    derive: [R`$\vec P = M\vec v_{cm}$。`, R`對時間微分：$d\vec P/dt = M\vec a_{cm} = \vec F_{ext}$。`,
             R`水柱打在牆上停下：$F = \dfrac{dm}{dt}v$。`],
    links: ['f9-2', 'f9-4', 'f11-4'],
    ex: [{ ref: '例題 9.6 救火', q: R`消防水柱每秒噴出 45 kg 的水，速率 32 m/s，垂直打在窗戶上停下。水施給窗戶多大的力？`,
           a: R`$F = \dfrac{dP}{dt} = \dfrac{dm}{dt}v = (45)(32) \approx 1400\ \text{N}$。` }] },
  { id: 'f9-4', name: '動量守恆',
    tex: R`\sum @{m}{m_i}\,@{vi}{\vec v_i} = \sum m_i\,@{vf}{\vec v_i'}\qquad(\vec F_{ext} = 0)`,
    sym: [['m', R`m_i`, '質量', 'kg', ''],
          ['vi', R`\vec v_i`, '之前的速度', 'm/s', ''],
          ['vf', R`\vec v_i'`, '之後的速度', 'm/s', '']],
    idea: '沒有外力時系統總動量不變；碰撞、爆炸、衰變都適用，而且每個分量各自守恆。',
    derive: [R`$\vec F_{ext} = d\vec P/dt$。`, R`外力為 0，所以 $d\vec P/dt = 0$，$\vec P$ 為常數。`,
             R`二維問題拆成 x、y 兩條方程式。`],
    links: ['f9-3', 'f11-5', 'f9-5', 'f9-6'], sim: 'collision',
    ex: [{ ref: '例題 9.8 核融合', q: R`兩個氘核融合成氦核：一個以 3.5 Mm/s 前進，另一個以 1.8 Mm/s、與第一個夾 64° 前進。氦核的速度？`,
           a: R`$\vec v_f = \dfrac{m_D}{m_{He}}(\vec v_1 + \vec v_2) = \tfrac12[(3.5,\,0) + 1.8(\cos64^\circ,\,\sin64^\circ)] \approx (2.14,\ 0.81)\ \text{Mm/s}$，大小 2.3 Mm/s，方向約 21°。` }] },
  { id: 'f9-5', name: '完全非彈性碰撞',
    tex: R`@{vf}{v_f} = \frac{@{m1}{m_1}@{v1}{v_1} + @{m2}{m_2}@{v2}{v_2}}{m_1 + m_2}`,
    sym: [['vf', R`v_f`, '碰後共同速度', 'm/s', ''],
          ['m1', R`m_1`, '物體一質量', 'kg', ''], ['v1', R`v_1`, '物體一碰前速度', 'm/s', ''],
          ['m2', R`m_2`, '物體二質量', 'kg', ''], ['v2', R`v_2`, '物體二碰前速度', 'm/s', '']],
    idea: '碰撞後黏在一起；動量守恆，但動能的損失是所有碰撞中最多的。',
    derive: [R`碰後兩者共同速度 $v_f$。`, R`動量守恆：$m_1v_1 + m_2v_2 = (m_1 + m_2)v_f$。`,
             R`衝擊擺：碰撞瞬間用動量守恆，之後上擺用能量守恆 $\tfrac12(m+M)V^2 = (m+M)gh$。`],
    links: ['f9-4', 'f7-4'], sim: 'collision',
    ex: [{ ref: '例題 9.7 冰上曲棍球', q: R`160 g 的冰球射入靜止在無摩擦冰面上的 6.4 kg 沙箱並嵌在裡面，沙箱以 1.2 m/s 滑出。冰球原本的速率？`,
           a: R`$m_pv_p = (m_p + m_c)v_c$，$v_p = \dfrac{0.16 + 6.4}{0.16}(1.2) \approx 49\ \text{m/s}$。` }] },
  { id: 'f9-6', name: '一維彈性碰撞',
    tex: R`@{v1f}{v_{1f}} = \frac{@{m1}{m_1} - @{m2}{m_2}}{m_1 + m_2}\,@{v1i}{v_{1i}},\qquad @{v2f}{v_{2f}} = \frac{2m_1}{m_1 + m_2}\,v_{1i}`,
    sym: [['v1f', R`v_{1f}`, '入射物碰後速度', 'm/s', ''],
          ['v2f', R`v_{2f}`, '靶碰後速度', 'm/s', '靶原本靜止'],
          ['m1', R`m_1`, '入射物質量', 'kg', ''], ['m2', R`m_2`, '靶質量', 'kg', ''],
          ['v1i', R`v_{1i}`, '入射物碰前速度', 'm/s', '']],
    idea: '動量和動能都守恆；質量相等時速度完全交換，輕的撞重的會反彈。',
    derive: [R`動量：$m_1v_{1i} = m_1v_{1f} + m_2v_{2f}$。`,
             R`動能：$\tfrac12 m_1v_{1i}^2 = \tfrac12 m_1v_{1f}^2 + \tfrac12 m_2v_{2f}^2$。`,
             R`把兩式整理後相除，得到上面的結果。`],
    links: ['f9-4', 'f6-4'], sim: 'collision',
    ex: [{ ref: '例題 9.11 槌球', q: R`一顆槌球彈性碰撞另一顆質量相同、靜止的球，入射球偏離原方向 30°。另一顆球往哪個方向走？`,
           a: R`動量 $\vec v_{1i} = \vec v_{1f} + \vec v_{2f}$ 平方後與動能式比較，得 $\vec v_{1f}\cdot\vec v_{2f} = 0$，兩球速度互相垂直，所以另一球偏 60°（在另一側）。` }] }
], [
  { id: 'p9-1', ref: '改編自例題 9.9 衝擊擺（數字為補充）', f: ['f9-5', 'f7-4'],
    q: R`10 g 的子彈射入懸掛的 2.0 kg 木塊並嵌在裡面，木塊上擺的垂直高度是 12 cm。子彈的速率是多少？`,
    unit: 'm/s', ans: 308.3,
    hints: [R`分兩段：碰撞瞬間動量守恆，碰撞後上擺時機械能守恆。`, R`上擺：$\tfrac12 V^2 = gh$，得 $V = \sqrt{2gh}$。`, R`碰撞：$mv = (m + M)V$。`],
    sol: R`$V = \sqrt{2(9.8)(0.12)} \approx 1.53\ \text{m/s}$，$v = \dfrac{m + M}{m}V = \dfrac{2.01}{0.010}(1.53) \approx 308\ \text{m/s}$。` },
  { id: 'p9-2', ref: '改編自例題 9.5 放射性衰變', f: ['f9-4'],
    q: R`以 1.6 Mm/s 前進的鋰-5 核（5 u）衰變成一個質子（1 u）和一個 α 粒子（4 u）。α 粒子以 1.4 Mm/s、與原方向夾 33° 飛出。質子的速率是多少？`,
    unit: 'Mm/s', ans: 4.496,
    hints: [R`動量在 x（原方向）和 y 方向各自守恆。`, R`x：$(5)(1.6) = (1)v_{px} + (4)(1.4)\cos33^\circ$；y：$0 = (1)v_{py} + (4)(1.4)\sin33^\circ$。`],
    sol: R`$v_{px} = 8 - 4.70 = 3.30\ \text{Mm/s}$，$v_{py} = -3.05\ \text{Mm/s}$，$v_p = \sqrt{3.30^2 + 3.05^2} \approx 4.5\ \text{Mm/s}$，方向在原方向另一側約 43°。` },
  { id: 'p9-3', ref: '改編自例題 9.10 核子工程', f: ['f9-6'],
    q: R`重水中的氘核（2 u）可以讓中子（1 u）減速。中子正面彈性碰撞一個靜止的氘核，中子原有的動能有百分之幾傳給了氘核？`,
    unit: '%', ans: 88.89,
    hints: [R`用一維彈性碰撞公式算 $v_{2f}$。`, R`$v_{2f} = \dfrac{2m_1}{m_1 + m_2}v_{1i} = \tfrac23 v_{1i}$。`, R`比例 $= \dfrac{\tfrac12 m_2v_{2f}^2}{\tfrac12 m_1v_{1i}^2}$。`],

chapter({ id: 10, exam: 2, title: '轉動', en: 'Rotational Motion',
  blurb: '把直線運動的 x、v、a、F、m 換成 θ、ω、α、τ、I。' }, [
  { id: 'f10-1', name: '角速度與線速度',
    tex: R`@{w}{\omega} = \frac{d@{th}{\theta}}{dt},\qquad @{v}{v} = @{w}{\omega}\,@{r}{r}`,
    sym: [['w', R`\omega`, '角速度', 'rad/s', '1 rpm = 2π/60 rad/s'],
          ['th', R`\theta`, '角位置', 'rad', '一圈 = 2π rad'],
          ['v', R`v`, '線速率', 'm/s', ''],
          ['r', R`r`, '到轉軸的距離', 'm', '']],
    idea: '剛體上每一點的角速度都相同，但離轉軸越遠，線速度越大。',
    derive: [R`弧長 $s = r\theta$（θ 必須用弧度）。`, R`對時間微分：$v = r\,\dfrac{d\theta}{dt} = r\omega$。`,
             R`同理，切線加速度 $a_t = r\alpha$。`],
    links: ['f5-5', 'f10-2', 'f10-7'],
