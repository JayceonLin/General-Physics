/* ---------- Ch8 軌道 ---------- */
const GM_E = 6.67e-11 * 5.97e24, R_E = 6.37e6;
SIMS.orbit = {
  title: '從某高度水平發射',
  params: [
    { k: 'alt', label: '發射高度', min: 200, max: 40000, step: 10, val: 380, unit: 'km', log: true, reset: true },
    { k: 'vf', label: '速率 ÷ 圓軌道速率', min: 0.6, max: 1.5, step: 0.01, val: 1, reset: true }],
  reset(s, p) {
    const r0 = R_E + p.alt * 1e3, vc = Math.sqrt(GM_E / r0), v = vc * p.vf;
    s.x = r0; s.y = 0; s.vx = 0; s.vy = v; s.trail = []; s.crash = false; s.t = 0;
    const E = 0.5 * v * v - GM_E / r0; s.E = E; s.a = E < 0 ? -GM_E / (2 * E) : Infinity;
    s.rmax = E < 0 ? 2 * s.a - r0 : r0 * 3; s.r0 = r0;
    s.Tper = E < 0 ? 2 * Math.PI * Math.sqrt(s.a ** 3 / GM_E) : null;
  },
  step(s, p, dt) {
    if (s.crash) { s.t += dt; if (s.t > 2) this.reset(s, p); return; }
    const per = s.Tper || 2 * Math.PI * Math.sqrt(s.r0 ** 3 / GM_E), warp = per / 7, n = 200, h = dt * warp / n;
    for (let i = 0; i < n; i++) {
      let r = Math.hypot(s.x, s.y), a = -GM_E / (r * r * r);
      s.vx += a * s.x * h / 2; s.vy += a * s.y * h / 2; s.x += s.vx * h; s.y += s.vy * h;
      r = Math.hypot(s.x, s.y); a = -GM_E / (r * r * r); s.vx += a * s.x * h / 2; s.vy += a * s.y * h / 2;
      if (r < R_E) { s.crash = true; s.t = 0; break; }
    }
    s.trail.push([s.x, s.y]); if (s.trail.length > 600) s.trail.shift();
    if (!s.Tper && Math.hypot(s.x, s.y) > s.r0 * 6) this.reset(s, p);
  },
  draw(ctx, W, H, s, p, C) {
    const view = Math.max(s.rmax, s.r0) * 1.08, sc = Math.min(W, H) / 2 / view, cy = H / 2;
    const gx = W / 2 - (s.Tper ? (s.r0 - s.rmax) / 2 * sc : 0);
    ctx.fillStyle = '#2b6cb0'; ctx.beginPath(); ctx.arc(gx, cy, Math.max(R_E * sc, 3), 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(160,210,255,.5)'; ctx.lineWidth = 1; ctx.stroke();
    const tr = s.trail.map(q => [gx + q[0] * sc, cy - q[1] * sc]); if (tr.length > 1) D.line(ctx, tr, C.accent, 1.4);
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(gx + s.x * sc, cy - s.y * sc, 3.5, 0, 7); ctx.fill();
    const kind = s.crash ? '撞上地面' : s.E >= 0 ? (Math.abs(p.vf - Math.SQRT2) < 0.01 ? '拋物線：剛好脫離' : '雙曲線：脫離地球') : Math.abs(p.vf - 1) < 0.005 ? '圓軌道' : '橢圓軌道';
    D.text(ctx, kind, 12, 18, s.E >= 0 ? C.warm : C.ok, 13, 'left', 600);
    D.text(ctx, '地球', gx, cy, '#e6f0ff', 11, 'center');
  },
  readout(s, p) {
    const vc = Math.sqrt(GM_E / s.r0), v = vc * p.vf;
    return [['軌道半徑 r', F(s.r0 / 1e3, 0) + ' km'], ['圓軌道速率 √(GM/r)', F(vc / 1e3, 2) + ' km/s'], ['發射速率 v', F(v / 1e3, 2) + ' km/s'],
      ['脫離速度 √(2GM/r)', F(Math.SQRT2 * vc / 1e3, 2) + ' km/s'], ['週期 T', s.Tper ? F(s.Tper / 60, 1) + ' min' : '不回來（開放軌道）']];
  }
};

function lamColor(nm) {
  let r = 0, g = 0, b = 0;
  if (nm < 440) { r = -(nm - 440) / 60; b = 1; } else if (nm < 490) { g = (nm - 440) / 50; b = 1; } else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
  else if (nm < 580) { r = (nm - 510) / 70; g = 1; } else if (nm < 645) { r = 1; g = -(nm - 645) / 65; } else r = 1;
  return [r, g, b].map(c => Math.round(255 * Math.min(1, Math.max(0, c)) ** 0.8));
}

      <span>${i + 1} / ${fs.length}</span><a href="#/ch/${c.id}/${next.id}" aria-label="下一條：${esc(next.name)}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></a></div>
    <h2 class="f-name">${esc(f.name)}</h2>
    <div class="f-display" id="f-display">${formulaHTML(f, true)}</div>
    <section class="sec def-sec"><h3>定義</h3><p class="f-def">${defHTML(DEFS[f.id])}</p>
      <p class="sec-note">底下有虛線的名詞和公式可以點，會跳出它的定義。</p></section>
    <section class="sec"><h3>什麼時候用</h3><p class="f-idea">${rich(f.idea)}</p></section>
    <section class="sec"><h3>符號拆解</h3><p class="sec-note">滑鼠移到公式或表格上，對應的符號會一起亮起。</p>
      <table class="sym-table"><thead><tr><th scope="col">符號</th><th scope="col">名稱</th><th scope="col">單位</th></tr></thead><tbody>
      ${f.sym.map(s => `<tr data-sym="${s[0]}" tabindex="0"><td class="sym-s">${tex(s[1], false)}</td><td>${GNAME[s[2]] ? `<button type="button" class="term" data-term="${GNAME[s[2]]}" aria-haspopup="dialog">${esc(s[2])}</button>` : rich(s[2])}${s[4] ? `<span class="sym-d">${rich(s[4])}</span>` : ''}</td><td class="sym-u">${esc(s[3])}</td></tr>`).join('')}
      </tbody></table></section>
    <section class="sec"><h3>和其他公式的關係</h3>${groups.map(([h, list]) => `<h4 class="rel-h">${h}</h4><ul class="rel-list rel-panel">${list.map(x => relItem(f.id, x.o)).join('')}</ul>`).join('')}</section>
    <section class="sec"><h3>推導</h3><ol class="derive">${f.derive.map(d => `<li>${rich(d)}</li>`).join('')}</ol></section>
    ${f.sim ? `<section class="sec"><h3>動手試試：${esc(SIMS[f.sim].title)}</h3><div class="sim-host" id="sim-main"></div></section>` : ''}
    ${f.ex && f.ex.length ? `<section class="sec"><h3>${c.supplement ? '例題' : '課本例題'}</h3>${f.ex.map(x => `<article class="ex"><p class="ex-ref">${esc(x.ref)}</p><p class="ex-q">${rich(x.q)}</p><details><summary>看解答</summary><div class="ex-a">${rich(x.a)}</div></details></article>`).join('')}</section>` : ''}
    <div class="panel-foot"><a class="btn btn-primary" href="#/ch/${c.id}/practice">練習第 ${c.id} 章（${c.problems.length} 題）</a>
      ${used.length ? `<p class="foot-note">這條公式會用在第 ${used.map(p => c.problems.indexOf(p) + 1).join('、')} 題。</p>` : ''}</div>`;
  if (f.sim) mountedSims.push(mountSim($('#sim-main'), f.sim, null, examColor(c.id)));
  bindSymbols();
  markSeen(f.id);
}
function bindSymbols() {
  const disp = $('#f-display'), rows = panelBody.querySelectorAll('.sym-table tr[data-sym]');
  const hi = (k, on) => { disp.querySelectorAll(`[data-sym="${k}"]`).forEach(n => n.classList.toggle('hi', on)); rows.forEach(r => r.classList.toggle('hi', on && r.dataset.sym === k)); };
  rows.forEach(r => { ['mouseenter', 'focus'].forEach(ev => r.addEventListener(ev, () => hi(r.dataset.sym, true))); ['mouseleave', 'blur'].forEach(ev => r.addEventListener(ev, () => hi(r.dataset.sym, false))); });
  disp.querySelectorAll('[data-sym]').forEach(n => {
    n.addEventListener('mouseenter', () => hi(n.dataset.sym, true)); n.addEventListener('mouseleave', () => hi(n.dataset.sym, false));
    n.addEventListener('click', () => { const r = panelBody.querySelector(`.sym-table tr[data-sym="${n.dataset.sym}"]`); if (r) { hi(n.dataset.sym, true); r.scrollIntoView({ block: 'nearest', behavior: REDUCED ? 'auto' : 'smooth' }); setTimeout(() => hi(n.dataset.sym, false), 1400); } });
  });
}

/* 練習題 */
function parseAnswer(s) {
  let t = String(s).trim().replace(/[，,\s]/g, '').replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/．/g, '.').replace(/[−–]/g, '-');
  t = t.replace(/(?:[x×*]|·)10\^?\(?(-?\d+)\)?/i, 'e$1');
  if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return NaN;
  return Number(t);
}
function fmtAns(v) { const a = Math.abs(v); if (a >= 1e5 || (a > 0 && a < 1e-3)) { const e = Math.floor(Math.log10(a)); return (v / 10 ** e).toFixed(2) + ' × 10' + sup(e); } return Number(v.toPrecision(4)).toString(); }
function renderPractice(c) {
  $('#panel-title').innerHTML = `<a href="#/ch/${c.id}" class="ph-ch"><span class="dot"></span>第 ${c.id} 章 ${esc(c.title)}</a>`;
  panelBody.innerHTML = `<h2 class="f-name">第 ${c.id} 章練習</h2>
    <p class="sec-note">${c.supplement ? '本章為補充題，依標準普物內容出題。' : '題目改編自課本例題。'}答案在正確值 2% 以內就算對，也可以輸入 3.2e7 這種寫法。</p>
    <ol class="probs">${c.problems.map((p, i) => `<li class="prob ${isOk(p.id) ? 'ok' : ''}" id="${p.id}" data-pid="${p.id}">
        <div class="prob-top"><span class="prob-no">第 ${i + 1} 題</span><span class="prob-ref">${esc(p.ref)}</span><span class="badge">${isOk(p.id) ? '已答對' : ''}</span></div>
        <p class="prob-q">${rich(p.q)}</p>
        <div class="prob-f">用到：${p.f.map(chipFor).join('')}</div>
        ${p.sim ? `<button type="button" class="btn-ghost sim-toggle" aria-expanded="false">打開情境模擬</button><div class="sim-host" hidden></div>` : ''}
        <form class="answer" novalidate><label for="in-${p.id}">你的答案</label><div class="answer-row"><input id="in-${p.id}" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="輸入數值">
          <span class="unit">${esc(p.unit)}</span><button class="btn btn-primary" type="submit">檢查</button></div></form>
        <p class="feedback" aria-live="polite"></p>
        <ol class="hints"></ol>
        <div class="prob-actions"><button type="button" class="btn-ghost hint-btn">給我提示（1/${p.hints.length}）</button><button type="button" class="btn-ghost sol-btn">看完整詳解</button></div>
        <div class="solution" hidden><p class="sol-ans">答案約 <strong>${fmtAns(p.ans)} ${esc(p.unit)}</strong></p><p>${rich(p.sol)}</p></div>
      </li>`).join('')}</ol>`;
  panelBody.querySelectorAll('.prob').forEach(li => bindProblem(li, PB[li.dataset.pid], c));
}
function bindProblem(li, p, c) {
  const fb = li.querySelector('.feedback'), input = li.querySelector('input'), hints = li.querySelector('.hints'), hb = li.querySelector('.hint-btn'), sol = li.querySelector('.solution');
  let shown = 0;
  li.querySelector('form').addEventListener('submit', e => {
    e.preventDefault(); const v = parseAnswer(input.value);
    if (isNaN(v)) { fb.className = 'feedback warn'; fb.textContent = '請輸入一個數字，例如 12.3 或 3.2e7。'; return; }
    const st = PROG.solved[p.id] || { tries: 0, ok: false }; st.tries++;
    const rel = (v - p.ans) / Math.abs(p.ans), tol = p.tol || 0.02;
    if (Math.abs(rel) <= tol) {
      st.ok = true; fb.className = 'feedback good'; fb.textContent = `答對了！正確值約 ${fmtAns(p.ans)} ${p.unit}${Math.abs(rel) > 0.001 ? `，你的誤差 ${(Math.abs(rel) * 100).toFixed(1)}%` : ''}。`;
      li.classList.add('ok'); li.querySelector('.badge').textContent = '已答對'; sol.hidden = false;
    } else {
      const ratio = v / p.ans, k = Math.round(Math.log10(Math.abs(ratio)));
      let msg = rel > 0 ? '還不對，你的答案偏大。' : '還不對，你的答案偏小。';
      if (ratio < 0) msg = '還不對，正負號相反了，檢查一下方向。';
      else if (k !== 0 && Math.abs(ratio / 10 ** k - 1) < 0.03) msg = `差了 10${sup(k)} 倍，檢查一下單位換算。`;
      fb.className = 'feedback bad'; fb.textContent = msg + (shown < p.hints.length ? '可以看看提示。' : '');
    }
    PROG.solved[p.id] = st; saveProg(); updateChapterStats();
  });
  hb.addEventListener('click', () => {
    if (shown >= p.hints.length) return;
    const h = document.createElement('li'); h.innerHTML = rich(p.hints[shown]); hints.appendChild(h); shown++;
    hb.textContent = shown >= p.hints.length ? '提示都看完了' : `再給一個提示（${shown + 1}/${p.hints.length}）`; hb.disabled = shown >= p.hints.length;
  });
  li.querySelector('.sol-btn').addEventListener('click', e => { sol.hidden = !sol.hidden; e.currentTarget.textContent = sol.hidden ? '看完整詳解' : '收起詳解'; });
  const tg = li.querySelector('.sim-toggle');
  if (tg) {
    let m = null; const host = tg.nextElementSibling;
    tg.addEventListener('click', () => {
      const open = host.hidden; host.hidden = !open; tg.setAttribute('aria-expanded', open); tg.textContent = open ? '收起情境模擬' : '打開情境模擬';
      if (open && !m) { m = mountSim(host, p.sim.id, p.sim.preset, examColor(c.id)); mountedSims.push(m); }
    });
  }
}

/* ---------- 模擬容器 ---------- */
function mountSim(host, id, preset, accent) {
  const def = SIMS[id], p = {};
  def.params.forEach(q => { p[q.k] = preset && preset[q.k] !== undefined ? preset[q.k] : q.val; if (q.type === 'select') p[q.k] = String(p[q.k]); });
  const C = { bg: '#0A0F2A', panel2: '#1A2250', line: '#4A5690', grid: '#1E2650', ink: '#E9ECFF', muted: '#9AA4D1', accent, warm: '#FF9466', cool: '#5FD8C8', ok: '#6FE3A6', bad: '#FF7A8A' };
  const uid = 's' + Math.random().toString(36).slice(2, 8);
  host.innerHTML = `<div class="sim"><canvas aria-label="${esc(def.title)}的動畫" role="img"></canvas>
    <div class="sim-controls">${def.params.map(q => {
      if (q.type === 'select') return `<label class="ctl" data-k="${q.k}" ${q.when ? `data-when="${q.when}"` : ''}><span class="ctl-l">${esc(q.label)}</span><select data-k="${q.k}">${q.options.map(o => `<option value="${o[0]}" ${String(p[q.k]) === o[0] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
      const u = q.log ? Math.round(1000 * Math.log(p[q.k] / q.min) / Math.log(q.max / q.min)) : p[q.k];
      return `<label class="ctl" data-k="${q.k}" ${q.when ? `data-when="${q.when}"` : ''}><span class="ctl-l">${esc(q.label)}<output id="${uid}-${q.k}"></output></span>
        <input type="range" data-k="${q.k}" min="${q.log ? 0 : q.min}" max="${q.log ? 1000 : q.max}" step="${q.log ? 1 : q.step}" value="${u}"></label>`;
    }).join('')}</div>
    <dl class="sim-readout"></dl>
    <div class="sim-actions"><button type="button" class="btn-ghost" data-act="reset">重新開始</button><button type="button" class="btn-ghost" data-act="pause">暫停</button></div></div>`;
  const cv = host.querySelector('canvas'), cx2 = cv.getContext('2d'), ro = host.querySelector('.sim-readout');
  const s = {}; def.reset(s, p);
  const fmtVal = (q, v) => { const d = q.step >= 1 ? 0 : q.step >= 0.1 ? 1 : q.step >= 0.01 ? 2 : 3; return (q.log ? Math.round(v) : Number(v).toFixed(d)) + (q.unit ? ' ' + q.unit : ''); };
  const showWhen = () => host.querySelectorAll('.ctl[data-when]').forEach(el => { const cur = p.mode || p.proc; el.hidden = !el.dataset.when.split('|').includes(cur); });
  def.params.forEach(q => { if (q.type !== 'select') host.querySelector(`#${uid}-${q.k}`).textContent = fmtVal(q, p[q.k]); });
  showWhen();
  host.querySelectorAll('[data-k]').forEach(inp => {
    if (inp.tagName === 'LABEL') return;
    inp.addEventListener('input', () => {
      const q = def.params.find(x => x.k === inp.dataset.k);
      if (q.type === 'select') p[q.k] = inp.value; else { const u = Number(inp.value); p[q.k] = q.log ? Math.round(q.min * Math.pow(q.max / q.min, u / 1000)) : u; host.querySelector(`#${uid}-${q.k}`).textContent = fmtVal(q, p[q.k]); }
      if (q.reset || q.type === 'select') def.reset(s, p); showWhen(); paint(true);
    });
  });
  let paused = false, raf = 0, last = 0, visible = true, frames = 0;
  host.querySelector('[data-act="reset"]').addEventListener('click', () => { def.reset(s, p); paint(true); });
  const pb = host.querySelector('[data-act="pause"]'); pb.addEventListener('click', () => { paused = !paused; pb.textContent = paused ? '繼續' : '暫停'; });
  let W = 0, H = 0;
  function size() { const w = host.clientWidth || 400; W = w; H = Math.round(Math.max(200, Math.min(340, w * 0.6))); const d = Math.min(window.devicePixelRatio || 1, 2); cv.width = W * d; cv.height = H * d; cv.style.height = H + 'px'; cx2.setTransform(d, 0, 0, d, 0, 0); }
  function paint(forceReadout) {
    cx2.fillStyle = C.bg; cx2.fillRect(0, 0, W, H);
    try { def.draw(cx2, W, H, s, p, C); } catch (e) { console.error(e); }
    if (forceReadout || frames % 8 === 0) ro.innerHTML = def.readout(s, p).map(r => `<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join('');
  }
  function tick(now) {
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now; frames++;
    if (visible) { if (!paused && dt > 0) def.step(s, p, dt); paint(false); }
    raf = requestAnimationFrame(tick);
  }
  size(); paint(true); raf = requestAnimationFrame(tick);
  const rs = new ResizeObserver(() => { size(); paint(true); }); rs.observe(host);
  const io = new IntersectionObserver(es => { visible = es[0].isIntersecting; }); io.observe(cv);
  return { destroy() { cancelAnimationFrame(raf); rs.disconnect(); io.disconnect(); } };
}

/* ---------- 路由 ---------- */
let route = { view: 'home', exam: 0 };
function parseHash() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'exam' && EXAMS[+parts[1]]) return { view: 'home', exam: +parts[1] };
  if (parts[0] === 'ch' && CH[+parts[1]]) {
    const ch = +parts[1];
    if (parts[2] === 'practice') return { view: 'chapter', ch, panel: 'practice' };
    if (parts[2] && FM[parts[2]] && FM[parts[2]].ch === ch) return { view: 'chapter', ch, panel: 'formula', f: parts[2] };
    return { view: 'chapter', ch };
  }
  return { view: 'home', exam: 0 };
}
function applyRoute() {
  closePop();
  const prev = route; route = parseHash();
  document.body.dataset.view = route.view;
  $$('.exam-filter button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.exam === (route.view === 'home' ? route.exam : -1))));
  showTip(null); S.hover = null;
  if (route.view === 'chapter') {
    view.hidden = false; sky.hidden = true;
    renderChapter(route.ch);
    document.title = `第 ${route.ch} 章 ${CH[route.ch].title}｜物理公式星系`;
    if (route.panel) openPanel(route); else closePanel();
    litF = null; applyLit();
    if (route.f && prev.f !== route.f) requestAnimationFrame(() => { const card = $('#card-' + route.f); if (card) card.scrollIntoView({ block: 'start', behavior: prev.ch === route.ch && !REDUCED ? 'smooth' : 'auto' }); });
    requestAnimationFrame(drawLinks);
  } else {
    view.hidden = true; sky.hidden = false; shownCh = null; closePanel(); renderLegend();
    document.title = '物理公式星系';
    requestAnimationFrame(() => flyHome(prev.view !== 'home'));
  }
}
$$('.exam-filter button').forEach(b => b.addEventListener('click', () => { location.hash = +b.dataset.exam ? '#/exam/' + b.dataset.exam : '#/'; }));
window.addEventListener('hashchange', applyRoute);
let rzT = 0;
window.addEventListener('resize', () => { resize(); clearTimeout(rzT); rzT = setTimeout(drawLinks, 80); });

function init() {
  updateSummary(); renderLegend();
  resize(); applyRoute();
  if (route.view === 'home') flyHome(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawLinks(); S.dirty = true; });
  requestAnimationFrame(loop);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
window.__PFG = { S, route: () => route, CH, FM, PB, REL };
})();

</script>
